name: Validate IPA 9.2 question v34 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v34.js'
      - 'assets/question-catalog-ipa92-v34.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V34_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v34-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v34-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate syntax and safe metadata
        run: |
          node --check assets/protected-content-provider-v376-v34.js
          node --check cloud/public-config-v342.js
          node --check sw.js
          node <<'NODE'
          const fs=require('node:fs');const vm=require('node:vm');const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v34.json','utf8'));const provider=fs.readFileSync('assets/protected-content-provider-v376-v34.js','utf8');const config=fs.readFileSync('cloud/public-config-v342.js','utf8');const sw=fs.readFileSync('sw.js','utf8');const ids=['ipa92_a_dual_duplex_system_001','ipa92_a_hot_cold_standby_001','ipa92_a_benchmark_001','ipa92_a_rasis_001','ipa92_a_foolproof_001'];const topics=['core_05_02','core_05_02','core_05_03','core_05_04','core_05_04'];const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);if(catalog.version!=='ipa92-catalog-v34'||catalog.contentVersion!=='ipa92-questions-v34'||catalog.items?.length!==5||catalog.counts?.subjectA!==5)throw new Error('v34 catalog contract');if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v34 ids');for(let i=0;i<catalog.items.length;i++){const x=catalog.items[i];if(x.sourcePool!=='subject_a'||x.qualityAudit!=='ipa92-original-v34'||x.cat!=='システム構成要素'||x.coreTopicId!==topics[i]||Object.keys(x).some(k=>protectedKeys.has(k)))throw new Error('unsafe v34 metadata');}if(!provider.includes("version:'v376-provider-31-ipa92-v1-v34'")||!provider.includes('const IPA92_V34_TOTAL=5;'))throw new Error('provider contract');if(!config.includes('IPA92_V34_METADATA')||!config.includes('activateV34Provider()')||!config.includes('catalogTotal===1168'))throw new Error('config contract');if(!sw.includes('protected-content-provider-v376-v34.js')||!sw.includes('question-catalog-ipa92-v34.json')||!sw.includes("fe-quest-v377-31"))throw new Error('sw contract');const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v34.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const n=new URL(String(url)).pathname.split('/').pop();return {ok:true,status:200,json:async()=>JSON.parse(fs.readFileSync('assets/'+n,'utf8'))}},window:{}};vm.createContext(ctx);vm.runInContext(provider,ctx);(async()=>{const merged=await ctx.window.FEQUEST_PROTECTED_CONTENT.loadCatalog();if(merged.items.length!==1168||merged.counts?.subjectA!==974||merged.counts?.trackedSubjectA!==983||merged.counts?.catalogQuestions!==1168)throw new Error('merged counts');for(const id of ids)if(!merged.items.some(x=>x.id===id))throw new Error('missing '+id);console.log('PASS v34 public runtime total=1168');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Validate production evidence
        run: |
          grep -Fq 'active protected question total after import: **1168**' .github/IPA92_V34_ACTIVATION_2026-09-15.md
          grep -Fq 'aeaa066efb2b94e9fd92ac1cb8e940ac8658c0f0' .github/IPA92_V34_ACTIVATION_2026-09-15.md
          grep -Fq 'b6a7ca0f0de038821dfcff80aac2043cd47233631717ee87d0efe5bf6d4a1c0d' .github/IPA92_V34_ACTIVATION_2026-09-15.md
          grep -Fq '34978215504' .github/IPA92_V34_ACTIVATION_2026-09-15.md
          grep -Fq '22c66e9050162d0fe1eb4eb7cbca9bedd03cf72ccd11c2a485dcdba6f262f737' .github/IPA92_V34_ACTIVATION_2026-09-15.md
