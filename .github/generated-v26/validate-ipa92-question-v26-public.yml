name: Validate IPA 9.2 question v26 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v26.js'
      - 'assets/question-catalog-ipa92-v26.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V26_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v26-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v26-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v26.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v26 safe catalog and provider
        run: |
          node <<'CHECK'
          const fs=require('node:fs'),vm=require('node:vm');
          const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v26.json','utf8'));
          const ids=["ipa92_a_article36_agreement_001","ipa92_a_nda_001","ipa92_a_gpl_lgpl_001","ipa92_a_web_internet_standards_bodies_001","ipa92_a_jis_itu_iec_001"];
          const topics=["core_21_04","core_21_04","core_06_05","core_21_06","core_21_06"];
          const cats=["ストラテジ","ストラテジ","コンピュータ","ストラテジ","ストラテジ"];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(c.version!=='ipa92-catalog-v26'||c.contentVersion!=='ipa92-questions-v26'||JSON.stringify(c.contentVersions)!==JSON.stringify(['ipa92-questions-v26'])||c.counts?.subjectA!==5||c.counts?.catalogQuestions!==5||c.items?.length!==5||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v26 catalog contract');
          c.items.forEach((item,i)=>{if(item.sourcePool!=='subject_a'||item.cat!==cats[i]||item.difficulty!=='standard'||item.coreTopicId!==topics[i]||item.qualityAudit!=='ipa92-original-v26'||Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('v26 safe metadata '+item.id)});
          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));const versions={};for(let i=7;i<=26;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));const source=fs.readFileSync('assets/protected-content-provider-v376-v26.js','utf8');
          const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v26.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=26;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data}},window:{}};vm.createContext(ctx);vm.runInContext(source,ctx);
          (async()=>{const api=ctx.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-23-ipa92-v1-v26'||api.catalogTotal!==1129)throw new Error('provider contract');const m=await api.loadCatalog();if(m.items.length!==1129||m.counts?.subjectA!==935||m.counts?.trackedSubjectA!==944||m.counts?.catalogQuestions!==1129)throw new Error('merged counts');const expected=Array.from({length:26},(_,i)=>'ipa92-questions-v'+(i+1));if(JSON.stringify(m.extensionContentVersions)!==JSON.stringify(expected)||new Set(m.items.map(x=>x.id)).size!==1129)throw new Error('versions/ids');console.log('PASS provider 1129')})().catch(e=>{console.error(e);process.exitCode=1});
          CHECK
      - name: Validate runtime metadata and release evidence
        run: |
          node <<'CHECK'
          const fs=require('node:fs'),vm=require('node:vm');const source=fs.readFileSync('cloud/public-config-v342.js','utf8');const bank=Array.from({length:83},(_,i)=>({id:'legacy_'+i}));const listeners={};const script={id:'',src:'',async:true,addEventListener(t,f){listeners[t]=f}};let ctx;const document={getElementById(){return null},createElement(){return script},head:{appendChild(n){if(n.src!=='./assets/protected-content-provider-v376-v26.js')throw new Error('provider src');ctx.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-23-ipa92-v1-v26',catalogTotal:1129};listeners.load()}}};ctx={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-22-ipa92-v1-v25',catalogTotal:1124}};vm.createContext(ctx);vm.runInContext('const QUESTION_BANK='+JSON.stringify(bank)+';\n'+source+'\nglobalThis.__BANK__=QUESTION_BANK;',ctx);(async()=>{const r=await ctx.FEQUEST_IPA92_V26_PROVIDER_READY;if(!r?.ok||ctx.__BANK__.length!==225||ctx.FEQUEST_IPA92_V26_SUBJECT_A_METADATA?.length!==5)throw new Error('runtime metadata');for(let i=7;i<=25;i++)if(ctx['FEQUEST_IPA92_V'+i+'_PROVIDER_READY']!==ctx.FEQUEST_IPA92_V26_PROVIDER_READY)throw new Error('alias '+i);console.log('PASS runtime metadata 225')})().catch(e=>{console.error(e);process.exitCode=1});
          CHECK
          grep -Fq '"./assets/protected-content-provider-v376-v26.js"' sw.js
          grep -Fq '"./assets/question-catalog-ipa92-v26.json"' sw.js
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-25';" sw.js
          grep -Fq 'active protected question total after import: **1129**' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq '7a6d6dfddf3f3902a78208aa112a2336d1c031e7' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq 'f4b3f564c804c6561f4270d061a4684621eb594e44fc43661025c8875fe6a087' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq '34849193673' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq '34849403822' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq 'v376-lessons-6-ipa92' .github/IPA92_V26_ACTIVATION_2026-09-14.md
