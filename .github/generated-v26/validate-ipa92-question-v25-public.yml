name: Validate IPA 9.2 question v25 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v25.js'
      - 'assets/question-catalog-ipa92-v25.json'
      - '.github/IPA92_V25_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v25-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v25-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v25 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v25.js
          node -e "const c=require('./assets/question-catalog-ipa92-v25.json');if(c.version!=='ipa92-catalog-v25'||c.contentVersion!=='ipa92-questions-v25'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-22-ipa92-v1-v25'" assets/protected-content-provider-v376-v25.js
          grep -Fq 'active protected question total after import: **1124**' .github/IPA92_V25_ACTIVATION_2026-09-14.md
