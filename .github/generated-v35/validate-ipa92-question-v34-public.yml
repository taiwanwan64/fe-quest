name: Validate IPA 9.2 question v34 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v34.js'
      - 'assets/question-catalog-ipa92-v34.json'
      - '.github/workflows/validate-ipa92-question-v34-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v34-historical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: node --check assets/protected-content-provider-v376-v34.js
      - run: |
          node <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v34.json','utf8'));const forbidden=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);if(c.version!=='ipa92-catalog-v34'||c.contentVersion!=='ipa92-questions-v34'||c.items?.length!==5)throw new Error('v34 historical catalog');for(const x of c.items)if(Object.keys(x).some(k=>forbidden.has(k)))throw new Error('protected field leaked');console.log('PASS v34 historical artifacts');
          NODE
