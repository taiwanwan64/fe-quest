name: Validate IPA 9.2 question v18 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v18.js'
      - 'assets/question-catalog-ipa92-v18.json'
      - '.github/IPA92_V18_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v18-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v18-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate historical v18 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v18.js
          node <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v18.json','utf8'));const ids=['ipa92_a_vrio_001','ipa92_a_growth_matrix_001','ipa92_a_3c_001'];const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);if(c.version!=='ipa92-catalog-v18'||c.contentVersion!=='ipa92-questions-v18'||c.items?.length!==3||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v18 artifact mismatch');for(const item of c.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v18'||Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('v18 safe metadata mismatch')}const p=fs.readFileSync('assets/protected-content-provider-v376-v18.js','utf8');if(!p.includes("version:'v376-provider-15-ipa92-v1-v18'"))throw new Error('v18 provider mismatch');console.log('PASS historical v18 public artifacts');
          NODE
