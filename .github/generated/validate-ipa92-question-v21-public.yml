name: Validate IPA 9.2 question v21 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v21.js'
      - 'assets/question-catalog-ipa92-v21.json'
      - '.github/IPA92_V21_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v21-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v21-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v21 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v21.js
          node -e "const c=require('./assets/question-catalog-ipa92-v21.json');if(c.version!=='ipa92-catalog-v21'||c.contentVersion!=='ipa92-questions-v21'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-18-ipa92-v1-v21'" assets/protected-content-provider-v376-v21.js
          grep -Fq 'active protected question total after import: **1104**' .github/IPA92_V21_ACTIVATION_2026-09-14.md
