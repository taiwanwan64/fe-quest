name: Validate IPA 9.2 question v20 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v20.js'
      - 'assets/question-catalog-ipa92-v20.json'
      - '.github/IPA92_V20_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v20-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v20-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v20 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v20.js
          node -e "const c=require('./assets/question-catalog-ipa92-v20.json');if(c.version!=='ipa92-catalog-v20'||c.contentVersion!=='ipa92-questions-v20'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-17-ipa92-v1-v20'" assets/protected-content-provider-v376-v20.js
          grep -Fq 'active protected question total after import: **1099**' .github/IPA92_V20_ACTIVATION_2026-09-14.md
