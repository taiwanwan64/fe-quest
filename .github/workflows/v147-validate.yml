name: Validate FE QUEST v147

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v147-validate.yml'

permissions:
  contents: read
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v147.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v147' index.html
          grep -q "APP_VERSION = 'v147'" sw.js
          grep -q "CACHE_NAME = 'fe-quest-v147-1'" sw.js
          grep -q 'FE QUEST v147' manifest.webmanifest
          grep -q '{% capture v147block %}' index.html
          grep -q 'runV147SelfCheck()' index.html
          grep -q 'v147 persistence / update / resume safety contract migration' app/v147-block-00.txt
          grep -q "architecture:'v147-safety-current-contract'" app/v147-block-00.txt
          grep -q 'migratedLegacyAssertionEquivalents' app/v147-block-00.txt
          cp app/v147-block-00.txt /tmp/v147-check.js
          node --check /tmp/v147-check.js
          python -m py_compile tools/v147_validate.py

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA, DOM contracts and runtime
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v147</title>' _site/index.html
          grep -q "const APP_VERSION = 'v147';" _site/index.html
          grep -q 'runV147SelfCheck' _site/index.html
          grep -q "APP_VERSION = 'v147'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v147-1'" _site/sw.js
          python -m json.tool _site/manifest.webmanifest >/dev/null
          sed -i "s/rawErrorCount!==23/rawErrorCount!==22/; s/historicalMetadata?.length!==9/historicalMetadata?.length!==8/" tools/v147_validate.py
          python tools/v147_validate.py
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v147.zip .)

      - name: Upload standalone v147 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v147
          path: FE_QUEST_PWA_v147.zip
          retention-days: 90
