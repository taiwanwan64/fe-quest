name: One-shot generate IPA 9.2 v30 public activation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/tmp-generate-v30-public.cjs'
      - '.github/workflows/tmp-generate-ipa92-v30-public.yml'
      - 'assets/question-catalog-ipa92-v30.json'
      - '.github/IPA92_V30_ACTIVATION_2026-09-15.md'

permissions:
  contents: write

jobs:
  generate-v30-public:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ipa92-v30-public-activation-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v30 public activation artifacts
        run: node .github/tmp-generate-v30-public.cjs
      - name: Commit generated non-workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/protected-content-provider-v376-v30.js cloud/public-config-v342.js sw.js .github/generated-v30
          git commit -m 'Generate IPA 9.2 v30 public activation artifacts'
          git push origin HEAD:${GITHUB_HEAD_REF}
