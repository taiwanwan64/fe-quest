name: FE QUEST v183 outer version shell feasibility validation

on:
  push:
    branches: [v183-staging]

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize conventional v183 outer shell
        run: python3 tools/v183_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build conventional FE QUEST v183
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare single-source Jekyll candidate
        run: python3 tools/v183_prepare_candidate.py

      - name: Build single-source Jekyll candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_candidate
          destination: ./_site_candidate
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate v183 feasibility and runtime
        run: python3 tools/v183_validate_generated.py

      - name: Commit validated conventional source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V183_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Retain FE QUEST v183 reliable outer version shell"
            git push origin HEAD:v183-staging
          fi
          echo "FEQUEST_V183_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "FEQUEST_V183_VALIDATION_TREE=$(git rev-parse HEAD^{tree})"

      - name: Package FE QUEST v183
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v183.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          wc -c FE_QUEST_PWA_v183.zip
          sha256sum FE_QUEST_PWA_v183.zip
          sha256sum _site/index.html _site/manifest.webmanifest _site/sw.js _site/icon-192.png _site/icon-512.png _site/apple-touch-icon.png

      - name: Upload FE QUEST v183
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v183-standalone
          path: FE_QUEST_PWA_v183.zip
          if-no-files-found: error
          retention-days: 90
