name: Stage IPA 9.2 v17 workflow blobs

on:
  push:
    branches: [ipa92-v17-public-activation-20260914]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate staged workflow files
        run: |
          python3 <<'PY'
          from pathlib import Path

          out=Path('staging/workflows'); out.mkdir(parents=True,exist_ok=True)

          def after_all(text, anchor, addition):
              if anchor not in text: raise SystemExit('missing anchor: '+anchor)
              return text.replace(anchor,anchor+'\n'+addition)

          # Patch the existing publication validator without reformatting unrelated guards.
          p=Path('.github/workflows/validate-publication.yml').read_text(encoding='utf-8')
          p=p.replace("fe-quest-v377-15","fe-quest-v377-16")
          p=after_all(p,'          node --check assets/protected-content-provider-v376-v16.js','          node --check assets/protected-content-provider-v376-v17.js')
          p=after_all(p,'          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v16.js"','          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"')
          p=after_all(p,'          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v16.json"','          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v17.json"')
          anchor='          grep -Fq \'"./assets/protected-content-provider-v376-v16.js"\' "$RUNNER_TEMP/site/sw.js"'
          if anchor in p: p=p.replace(anchor,anchor+'\n          grep -Fq \'"./assets/protected-content-provider-v376-v17.js"\' "$RUNNER_TEMP/site/sw.js"')
          anchor='          grep -Fq \'"./assets/question-catalog-ipa92-v16.json"\' "$RUNNER_TEMP/site/sw.js"'
          if anchor in p: p=p.replace(anchor,anchor+'\n          grep -Fq \'"./assets/question-catalog-ipa92-v17.json"\' "$RUNNER_TEMP/site/sw.js"')
          out.joinpath('validate-publication.yml.txt').write_text(p,encoding='utf-8')

          # Patch deploy guard analogously.
          d=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          d=d.replace("fe-quest-v377-15","fe-quest-v377-16")
          d=after_all(d,'          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v16.js"','          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"')
          d=after_all(d,'          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v16.json"','          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v17.json"')
          anchor='          grep -Fq \'"./assets/protected-content-provider-v376-v16.js"\' "$RUNNER_TEMP/site/sw.js"'
          if anchor in d: d=d.replace(anchor,anchor+'\n          grep -Fq \'"./assets/protected-content-provider-v376-v17.js"\' "$RUNNER_TEMP/site/sw.js"')
          anchor='          grep -Fq \'"./assets/question-catalog-ipa92-v16.json"\' "$RUNNER_TEMP/site/sw.js"'
          if anchor in d: d=d.replace(anchor,anchor+'\n          grep -Fq \'"./assets/question-catalog-ipa92-v17.json"\' "$RUNNER_TEMP/site/sw.js"')
          marker='          grep -Fq "version:\'v376-provider-12-ipa92-v1-v15\'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v15.js"'
          if marker in d: d=d.replace(marker,marker+'\n          grep -Fq "version:\'v376-provider-14-ipa92-v1-v17\'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"')
          out.joinpath('deploy-pages.yml.txt').write_text(d,encoding='utf-8')

          out.joinpath('validate-v16-historical.yml.txt').write_text('''name: Validate IPA 9.2 question v16 public activation\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v16.js'\n      - 'assets/question-catalog-ipa92-v16.json'\n      - '.github/IPA92_V16_ACTIVATION_2026-09-13.md'\n      - '.github/workflows/validate-ipa92-question-v16-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v16-historical:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate historical v16 artifacts\n        run: |\n          node --check assets/protected-content-provider-v376-v16.js\n          node <<'NODE'\n          const fs=require('node:fs');\n          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v16.json','utf8'));\n          const expectedIds=['ipa92_a_coso_internal_control_001','ipa92_a_csa_internal_control_001','ipa92_a_jisq38500_it_governance_001','ipa92_a_it_general_controls_001'];\n          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);\n          if(catalog.version!=='ipa92-catalog-v16'||catalog.contentVersion!=='ipa92-questions-v16')throw new Error('v16 catalog version mismatch');\n          if(!Array.isArray(catalog.items)||catalog.items.length!==4)throw new Error('v16 catalog count mismatch');\n          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(expectedIds))throw new Error('v16 IDs/order mismatch');\n          for(const item of catalog.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v16')throw new Error('v16 metadata contract mismatch');if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');}\n          const provider=fs.readFileSync('assets/protected-content-provider-v376-v16.js','utf8');\n          if(!provider.includes("version:'v376-provider-13-ipa92-v1-v16'"))throw new Error('v16 provider version mismatch');\n          console.log('PASS historical v16 public artifacts');\n          NODE\n''',encoding='utf-8')

          out.joinpath('validate-v17-public.yml.txt').write_text('''name: Validate IPA 9.2 question v17 public activation\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v17.js'\n      - 'assets/question-catalog-ipa92-v17.json'\n      - 'cloud/public-config-v342.js'\n      - 'sw.js'\n      - '.github/IPA92_V17_ACTIVATION_2026-09-14.md'\n      - '.github/workflows/validate-ipa92-question-v17-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v17-public:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate JavaScript syntax\n        run: |\n          node --check assets/protected-content-provider-v376-v17.js\n          node --check cloud/public-config-v342.js\n          node --check sw.js\n      - name: Validate v17 public-safe catalog\n        run: |\n          node <<'NODE'\n          const fs=require('node:fs');\n          const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v17.json','utf8'));\n          const ids=['ipa92_a_enterprise_architecture_001','ipa92_a_wfa_001','ipa92_a_soa_001','ipa92_a_zachman_framework_001'];\n          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);\n          if(c.version!=='ipa92-catalog-v17'||c.contentVersion!=='ipa92-questions-v17'||JSON.stringify(c.contentVersions)!==JSON.stringify(['ipa92-questions-v17']))throw new Error('v17 catalog version mismatch');\n          if(c.counts?.subjectA!==4||c.counts?.catalogQuestions!==4||c.items?.length!==4||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v17 catalog contract mismatch');\n          for(const item of c.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v17'||item.cat!=='システム戦略'||item.coreTopicId!=='core_16_01')throw new Error('v17 metadata contract mismatch');if(Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('protected field leaked');}\n          console.log('PASS v17 safe catalog');\n          NODE\n      - name: Validate provider merge and runtime activation\n        run: |\n          node <<'NODE'\n          const fs=require('node:fs'),vm=require('node:vm');\n          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));const versions={};for(let i=7;i<=17;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));\n          const src=fs.readFileSync('assets/protected-content-provider-v376-v17.js','utf8');const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v17.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=17;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data};},window:{}};vm.createContext(ctx);vm.runInContext(src,ctx);\n          (async()=>{const api=ctx.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-14-ipa92-v1-v17'||api.catalogTotal!==1086)throw new Error('provider contract');const m=await api.loadCatalog();if(m.items.length!==1086||m.counts?.subjectA!==892||m.counts?.trackedSubjectA!==901||m.counts?.catalogQuestions!==1086)throw new Error('merged counts');const expected=Array.from({length:17},(_,i)=>'ipa92-questions-v'+(i+1));if(JSON.stringify(m.extensionContentVersions)!==JSON.stringify(expected)||new Set(m.items.map(x=>x.id)).size!==1086)throw new Error('merged versions/ids');console.log('PASS provider 1086');})().catch(e=>{console.error(e);process.exitCode=1});\n          NODE\n          node <<'NODE'\n          const fs=require('node:fs'),vm=require('node:vm');const source=fs.readFileSync('cloud/public-config-v342.js','utf8');const bank=Array.from({length:83},(_,i)=>({id:'legacy_'+i}));const listeners={};const script={id:'',src:'',async:true,addEventListener(t,f){listeners[t]=f}};let ctx;const document={getElementById(){return null},createElement(){return script},head:{appendChild(n){if(n.src!=='./assets/protected-content-provider-v376-v17.js')throw new Error('provider src');ctx.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-14-ipa92-v1-v17',catalogTotal:1086};listeners.load()}}};ctx={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-13-ipa92-v1-v16',catalogTotal:1082}};vm.createContext(ctx);vm.runInContext('const QUESTION_BANK='+JSON.stringify(bank)+';\\n'+source+'\\nglobalThis.__BANK__=QUESTION_BANK;',ctx);(async()=>{const r=await ctx.FEQUEST_IPA92_V17_PROVIDER_READY;if(!r?.ok||ctx.__BANK__.length!==182||ctx.FEQUEST_IPA92_V17_SUBJECT_A_METADATA?.length!==4)throw new Error('runtime metadata');for(let i=7;i<=16;i++)if(ctx['FEQUEST_IPA92_V'+i+'_PROVIDER_READY']!==ctx.FEQUEST_IPA92_V17_PROVIDER_READY)throw new Error('readiness alias '+i);console.log('PASS runtime metadata 182');})().catch(e=>{console.error(e);process.exitCode=1});\n          NODE\n      - name: Validate publication and import checkpoint\n        run: |\n          grep -Fq '"./assets/protected-content-provider-v376-v17.js"' sw.js\n          grep -Fq '"./assets/question-catalog-ipa92-v17.json"' sw.js\n          grep -Fq "const CACHE_NAME = 'fe-quest-v377-16';" sw.js\n          grep -Fq 'active protected question total after import: **1086**' .github/IPA92_V17_ACTIVATION_2026-09-14.md\n          grep -Fq '7f8fc5702aa07ea6f61029c65733c4232c3a1074' .github/IPA92_V17_ACTIVATION_2026-09-14.md\n          grep -Fq '7a95d75d87b986238e2a686800ed0b1b4394e22317c64c352b7c3a2c800874f2' .github/IPA92_V17_ACTIVATION_2026-09-14.md\n          grep -Fq '34786004882' .github/IPA92_V17_ACTIVATION_2026-09-14.md\n          grep -Fq '34786016692' .github/IPA92_V17_ACTIVATION_2026-09-14.md\n''',encoding='utf-8')
          PY
      - name: Commit staged blobs
        run: |
          set -euo pipefail
          git config user.name 'taiwanwan64'
          git config user.email 'taiwanwan64@gmail.com'
          git add staging/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage v17 workflow definitions'
          git push origin HEAD:ipa92-v17-public-activation-20260914
