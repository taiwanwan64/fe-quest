name: Build IPA 9.2 v17 public activation

on:
  push:
    branches: [ipa92-v17-public-activation-20260914]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build public-safe v17 activation
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old,new,1)

          def insert_after_all(text, anchor, addition, label):
              count=text.count(anchor)
              if count<1:
                  raise SystemExit(f'{label}: anchor missing')
              return text.replace(anchor, anchor+'\n'+addition)

          # 1) Public-safe catalog.
          catalog={
            'version':'ipa92-catalog-v17',
            'contentVersion':'ipa92-questions-v17',
            'contentVersions':['ipa92-questions-v17'],
            'counts':{'subjectA':4,'catalogQuestions':4},
            'items':[
              {'id':'ipa92_a_enterprise_architecture_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'EA（Enterprise Architecture）','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
              {'id':'ipa92_a_wfa_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'WFA（Work Flow Architecture）','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
              {'id':'ipa92_a_soa_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'SOA（Service Oriented Architecture）','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
              {'id':'ipa92_a_zachman_framework_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'ザックマンフレームワーク','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
            ]
          }
          Path('assets/question-catalog-ipa92-v17.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 2) Extend the protected-content provider from immutable v16.
          p=Path('assets/protected-content-provider-v376-v16.js').read_text(encoding='utf-8')
          p=replace_once(p,"const IPA92_V16_CATALOG_URL=new URL('question-catalog-ipa92-v16.json',SCRIPT_URL).toString();","const IPA92_V16_CATALOG_URL=new URL('question-catalog-ipa92-v16.json',SCRIPT_URL).toString();\nconst IPA92_V17_CATALOG_URL=new URL('question-catalog-ipa92-v17.json',SCRIPT_URL).toString();",'provider catalog URL')
          p=replace_once(p,"const IPA92_V16_CATALOG_VERSION='ipa92-catalog-v16';","const IPA92_V16_CATALOG_VERSION='ipa92-catalog-v16';\nconst IPA92_V17_CATALOG_VERSION='ipa92-catalog-v17';",'provider catalog version')
          p=replace_once(p,"const IPA92_V16_CONTENT_VERSION='ipa92-questions-v16';","const IPA92_V16_CONTENT_VERSION='ipa92-questions-v16';\nconst IPA92_V17_CONTENT_VERSION='ipa92-questions-v17';",'provider content version')
          p=replace_once(p,"const IPA92_V16_TOTAL=4;","const IPA92_V16_TOTAL=4;\nconst IPA92_V17_TOTAL=4;",'provider v17 total')
          p=replace_once(p,"const IPA92_EXTENSION_TOTAL=IPA92_V1_V6_TOTAL+IPA92_V7_TOTAL+IPA92_V8_TOTAL+IPA92_V9_TOTAL+IPA92_V10_TOTAL+IPA92_V11_TOTAL+IPA92_V12_TOTAL+IPA92_V13_TOTAL+IPA92_V14_TOTAL+IPA92_V15_TOTAL+IPA92_V16_TOTAL;","const IPA92_EXTENSION_TOTAL=IPA92_V1_V6_TOTAL+IPA92_V7_TOTAL+IPA92_V8_TOTAL+IPA92_V9_TOTAL+IPA92_V10_TOTAL+IPA92_V11_TOTAL+IPA92_V12_TOTAL+IPA92_V13_TOTAL+IPA92_V14_TOTAL+IPA92_V15_TOTAL+IPA92_V16_TOTAL+IPA92_V17_TOTAL;",'provider extension total')
          p=replace_once(p,"fetchJson(IPA92_V15_CATALOG_URL),fetchJson(IPA92_V16_CATALOG_URL)","fetchJson(IPA92_V15_CATALOG_URL),fetchJson(IPA92_V16_CATALOG_URL),fetchJson(IPA92_V17_CATALOG_URL)",'provider promise inputs')
          p=replace_once(p,"v13,v14,v15,v16])=>{","v13,v14,v15,v16,v17])=>{",'provider promise destructure')
          p=replace_once(p,"['v16',v16,IPA92_V16_CATALOG_VERSION,IPA92_V16_CONTENT_VERSION,IPA92_V16_TOTAL,'ipa92-original-v16']","['v16',v16,IPA92_V16_CATALOG_VERSION,IPA92_V16_CONTENT_VERSION,IPA92_V16_TOTAL,'ipa92-original-v16'],\n        ['v17',v17,IPA92_V17_CATALOG_VERSION,IPA92_V17_CONTENT_VERSION,IPA92_V17_TOTAL,'ipa92-original-v17']",'provider entries')
          p=replace_once(p,"const extensionItems=[...legacy.items,...v7.items,...v8.items,...v9.items,...v10.items,...v11.items,...v12.items,...v13.items,...v14.items,...v15.items,...v16.items];","const extensionItems=[...legacy.items,...v7.items,...v8.items,...v9.items,...v10.items,...v11.items,...v12.items,...v13.items,...v14.items,...v15.items,...v16.items,...v17.items];",'provider extension items')
          p=replace_once(p,"version:`${BASE_CATALOG_VERSION}+ipa92-catalog-v1-v16`,","version:`${BASE_CATALOG_VERSION}+ipa92-catalog-v1-v17`,",'provider aggregate catalog version')
          p=replace_once(p,"extensionContentVersion:'ipa92-questions-v1-v16',","extensionContentVersion:'ipa92-questions-v1-v17',",'provider aggregate content version')
          p=replace_once(p,"IPA92_V14_CONTENT_VERSION,IPA92_V15_CONTENT_VERSION,IPA92_V16_CONTENT_VERSION]),","IPA92_V14_CONTENT_VERSION,IPA92_V15_CONTENT_VERSION,IPA92_V16_CONTENT_VERSION,IPA92_V17_CONTENT_VERSION]),",'provider content versions')
          p=replace_once(p,"version:'v376-provider-13-ipa92-v1-v16',maxBatch:MAX_BATCH,maxCache:MAX_CACHE,catalogTotal:MERGED_CATALOG_TOTAL,","version:'v376-provider-14-ipa92-v1-v17',maxBatch:MAX_BATCH,maxCache:MAX_CACHE,catalogTotal:MERGED_CATALOG_TOTAL,",'provider API version')
          Path('assets/protected-content-provider-v376-v17.js').write_text(p,encoding='utf-8')

          # 3) Extend current public config while preserving historical metadata globals/readiness aliases.
          cfg_path=Path('cloud/public-config-v342.js')
          c=cfg_path.read_text(encoding='utf-8')
          v17_meta='''  const IPA92_V17_METADATA=Object.freeze([\n    {"id":"ipa92_a_enterprise_architecture_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"EA（Enterprise Architecture）","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"},\n    {"id":"ipa92_a_wfa_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"WFA（Work Flow Architecture）","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"},\n    {"id":"ipa92_a_soa_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"SOA（Service Oriented Architecture）","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"},\n    {"id":"ipa92_a_zachman_framework_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"ザックマンフレームワーク","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"}\n  ].map(item=>Object.freeze(item)));\n\n'''
          c=replace_once(c,'  function installMetadata(items,label,expectedTotal){',v17_meta+'  function installMetadata(items,label,expectedTotal){','config v17 metadata')
          c=replace_once(c,"  function installV16Metadata(){return installMetadata(IPA92_V16_METADATA,'v16',4)}","  function installV16Metadata(){return installMetadata(IPA92_V16_METADATA,'v16',4)}\n  function installV17Metadata(){return installMetadata(IPA92_V17_METADATA,'v17',4)}",'config installer')
          c=replace_once(c,'    const v16Install=installV16Metadata();','    const v16Install=installV16Metadata();\n    const v17Install=installV17Metadata();','config finish install')
          c=replace_once(c,'    root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA_INSTALL=v16Install;','    root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA_INSTALL=v16Install;\n    root.FEQUEST_IPA92_V17_SUBJECT_A_METADATA_INSTALL=v17Install;','config install global')
          c=replace_once(c,"    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-13-ipa92-v1-v16'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1082;","    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-14-ipa92-v1-v17'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1086;",'config provider check')
          c=replace_once(c,'    const ok=providerOk&&v7Install.ok&&v8Install.ok&&v9Install.ok&&v10Install.ok&&v11Install.ok&&v12Install.ok&&v13Install.ok&&v14Install.ok&&v15Install.ok&&v16Install.ok;','    const ok=providerOk&&v7Install.ok&&v8Install.ok&&v9Install.ok&&v10Install.ok&&v11Install.ok&&v12Install.ok&&v13Install.ok&&v14Install.ok&&v15Install.ok&&v16Install.ok&&v17Install.ok;','config ok')
          c=replace_once(c,"    return Object.freeze({ok,status:ok?'activated':'metadata-install-failed',reused,v7:v7Install,v8:v8Install,v9:v9Install,v10:v10Install,v11:v11Install,v12:v12Install,v13:v13Install,v14:v14Install,v15:v15Install,v16:v16Install});","    return Object.freeze({ok,status:ok?'activated':'metadata-install-failed',reused,v7:v7Install,v8:v8Install,v9:v9Install,v10:v10Install,v11:v11Install,v12:v12Install,v13:v13Install,v14:v14Install,v15:v15Install,v16:v16Install,v17:v17Install});",'config activation result')
          c=c.replace('function activateV16Provider()','function activateV17Provider()')
          c=c.replace("v376-provider-13-ipa92-v1-v16","v376-provider-14-ipa92-v1-v17")
          c=c.replace("fequest-ipa92-v16-provider","fequest-ipa92-v17-provider")
          c=c.replace("./assets/protected-content-provider-v376-v16.js","./assets/protected-content-provider-v376-v17.js")
          c=replace_once(c,'  root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA=IPA92_V16_METADATA;','  root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA=IPA92_V16_METADATA;\n  root.FEQUEST_IPA92_V17_SUBJECT_A_METADATA=IPA92_V17_METADATA;','config metadata global')
          c=replace_once(c,'  const latestProviderReady=activateV16Provider();','  const latestProviderReady=activateV17Provider();','config latest activation')
          c=replace_once(c,'  root.FEQUEST_IPA92_V16_PROVIDER_READY=latestProviderReady;','  root.FEQUEST_IPA92_V17_PROVIDER_READY=latestProviderReady;\n  root.FEQUEST_IPA92_V16_PROVIDER_READY=latestProviderReady;','config latest ready alias')
          cfg_path.write_text(c,encoding='utf-8')

          # 4) Service-worker cache and assets.
          sw_path=Path('sw.js'); s=sw_path.read_text(encoding='utf-8')
          s=replace_once(s,"const CACHE_NAME = 'fe-quest-v377-15';","const CACHE_NAME = 'fe-quest-v377-16';",'sw cache')
          s=replace_once(s,'  "./assets/protected-content-provider-v376-v16.js",','  "./assets/protected-content-provider-v376-v16.js",\n  "./assets/protected-content-provider-v376-v17.js",','sw provider')
          s=replace_once(s,'  "./assets/question-catalog-ipa92-v16.json",','  "./assets/question-catalog-ipa92-v16.json",\n  "./assets/question-catalog-ipa92-v17.json",','sw catalog')
          sw_path.write_text(s,encoding='utf-8')

          # 5) Convert v16 validator to immutable historical-artifact validation.
          Path('.github/workflows/validate-ipa92-question-v16-public.yml').write_text('''name: Validate IPA 9.2 question v16 public activation\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v16.js'\n      - 'assets/question-catalog-ipa92-v16.json'\n      - '.github/IPA92_V16_ACTIVATION_2026-09-13.md'\n      - '.github/workflows/validate-ipa92-question-v16-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v16-historical:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate historical v16 artifacts\n        run: |\n          node --check assets/protected-content-provider-v376-v16.js\n          node <<'NODE'\n          const fs=require('node:fs');\n          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v16.json','utf8'));\n          const expectedIds=['ipa92_a_coso_internal_control_001','ipa92_a_csa_internal_control_001','ipa92_a_jisq38500_it_governance_001','ipa92_a_it_general_controls_001'];\n          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);\n          if(catalog.version!=='ipa92-catalog-v16'||catalog.contentVersion!=='ipa92-questions-v16')throw new Error('v16 catalog version mismatch');\n          if(!Array.isArray(catalog.items)||catalog.items.length!==4)throw new Error('v16 catalog count mismatch');\n          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(expectedIds))throw new Error('v16 IDs/order mismatch');\n          for(const item of catalog.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v16')throw new Error('v16 metadata contract mismatch');if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');}\n          const provider=fs.readFileSync('assets/protected-content-provider-v376-v16.js','utf8');\n          if(!provider.includes("version:'v376-provider-13-ipa92-v1-v16'"))throw new Error('v16 provider version mismatch');\n          console.log('PASS historical v16 public artifacts');\n          NODE\n''',encoding='utf-8')

          # 6) Update publication/deploy guards to the latest cache/assets while retaining historical checks.
          for file in ['.github/workflows/validate-publication.yml','.github/workflows/deploy-pages.yml']:
              path=Path(file); t=path.read_text(encoding='utf-8')
              t=t.replace("const CACHE_NAME = 'fe-quest-v377-15';","const CACHE_NAME = 'fe-quest-v377-16';")
              if 'validate-publication.yml' in file:
                  t=insert_after_all(t,'          node --check assets/protected-content-provider-v376-v16.js','          node --check assets/protected-content-provider-v376-v17.js','publication node check')
              t=insert_after_all(t,'          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v16.js"','          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"','publication provider file')
              t=insert_after_all(t,'          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v16.json"','          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v17.json"','publication catalog file')
              anchor='          grep -Fq \'"./assets/protected-content-provider-v376-v16.js"\' "$RUNNER_TEMP/site/sw.js"'
              if anchor in t:
                  t=t.replace(anchor,anchor+'\n          grep -Fq \'"./assets/protected-content-provider-v376-v17.js"\' "$RUNNER_TEMP/site/sw.js"')
              anchor='          grep -Fq \'"./assets/question-catalog-ipa92-v16.json"\' "$RUNNER_TEMP/site/sw.js"'
              if anchor in t:
                  t=t.replace(anchor,anchor+'\n          grep -Fq \'"./assets/question-catalog-ipa92-v17.json"\' "$RUNNER_TEMP/site/sw.js"')
              if 'deploy-pages.yml' in file:
                  marker="          grep -Fq \"version:'v376-provider-12-ipa92-v1-v15'\" \"$RUNNER_TEMP/site/assets/protected-content-provider-v376-v15.js\""
                  if marker in t:
                      t=t.replace(marker,marker+'\n          grep -Fq "version:\'v376-provider-14-ipa92-v1-v17\'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"')
              path.write_text(t,encoding='utf-8')

          # 7) Activation evidence checkpoint.
          Path('.github/IPA92_V17_ACTIVATION_2026-09-14.md').write_text('''# FE QUEST — IPA Ver.9.2 question v17 activation — 2026-09-14\n\n## Verified protected import\n\nThe protected v17 batch was imported through the private main + workflow_dispatch + GitHub OIDC path and verified against production before public-safe activation.\n\n- private repository: taiwanwan64/fe-quest-private-source\n- private source/main commit: 7f8fc5702aa07ea6f61029c65733c4232c3a1074\n- content version: ipa92-questions-v17\n- imported questions: **4**\n- active protected question total after import: **1086**\n- active protected lessons: **130**\n- staging rows after finalization: **0**\n- import manifest rows for v17: **1**\n- payload SHA-256: 7a95d75d87b986238e2a686800ed0b1b4394e22317c64c352b7c3a2c800874f2\n- source commit recorded by manifest: 7f8fc5702aa07ea6f61029c65733c4232c3a1074\n- imported at: 2026-09-13 22:10:59.887+00\n- import workflow run: 34786004882\n- workflow attempt: **1**\n- workflow conclusion: **success**\n- protected lesson import workflow run: 34786016692\n- protected lesson import conclusion: **success**\n\nThe protected core_16_01 lesson was also verified in production to contain EA context plus WFA, SOA and the Zachman framework. Existing lesson IDs remain stable.\n\n## Semantic-review decision\n\nThe live pre-v17 corpus already covered information-system strategy and mentioned EA at lesson level, but direct practice for EA itself was thin and WFA, SOA and the Zachman framework had no direct evidence. The v17 remediation therefore adds four original FE QUEST Subject-A questions and a narrow lesson overlay without duplicating broader strategy material.\n\n## Public-safe activation contract\n\nOnly safe metadata for the four v17 IDs is published. Stems, options, answers, explanations, hints and choice explanations remain protected.\n\n- provider version: v376-provider-14-ipa92-v1-v17\n- merged public catalog total: **1086**\n- extension content versions: ipa92-questions-v1 through ipa92-questions-v17\n- public-safe extension metadata total: **182** including the legacy v1-v6 metadata set\n- merged Subject-A count: **892**\n- tracked Subject-A count: **901**\n- service-worker cache: fe-quest-v377-16\n\n## Completion status\n\nThis activation adds direct-practice evidence but does not promote the cluster or overall Ver.9.2 coverage to verified-covered. Practice density, required visual/interactive verification, iPhone-equivalent touch/scroll QA, and learning-history/save-restore compatibility remain separate gates.\n''',encoding='utf-8')

          # 8) Latest public validator.
          Path('.github/workflows/validate-ipa92-question-v17-public.yml').write_text('''name: Validate IPA 9.2 question v17 public activation\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v17.js'\n      - 'assets/question-catalog-ipa92-v17.json'\n      - 'cloud/public-config-v342.js'\n      - 'sw.js'\n      - '.github/IPA92_V17_ACTIVATION_2026-09-14.md'\n      - '.github/workflows/validate-ipa92-question-v17-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v17-public:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate JavaScript syntax\n        run: |\n          node --check assets/protected-content-provider-v376-v17.js\n          node --check cloud/public-config-v342.js\n          node --check sw.js\n      - name: Validate v17 public-safe catalog\n        run: |\n          node <<'NODE'\n          const fs=require('node:fs');\n          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v17.json','utf8'));\n          const expectedIds=['ipa92_a_enterprise_architecture_001','ipa92_a_wfa_001','ipa92_a_soa_001','ipa92_a_zachman_framework_001'];\n          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);\n          if(catalog.version!=='ipa92-catalog-v17'||catalog.contentVersion!=='ipa92-questions-v17')throw new Error('v17 catalog version mismatch');\n          if(JSON.stringify(catalog.contentVersions)!==JSON.stringify(['ipa92-questions-v17']))throw new Error('v17 contentVersions mismatch');\n          if(catalog.counts?.subjectA!==4||catalog.counts?.catalogQuestions!==4||catalog.items?.length!==4)throw new Error('v17 counts mismatch');\n          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(expectedIds))throw new Error('v17 IDs/order mismatch');\n          for(const item of catalog.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v17'||item.cat!=='システム戦略'||item.coreTopicId!=='core_16_01')throw new Error('v17 metadata contract mismatch');if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');}\n          console.log('PASS v17 safe catalog: 4 items');\n          NODE\n      - name: Validate protected provider merges to 1086\n        run: |\n          node <<'NODE'\n          const fs=require('node:fs'),vm=require('node:vm');\n          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));\n          const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));\n          const versions={};for(let i=7;i<=17;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));\n          const source=fs.readFileSync('assets/protected-content-provider-v376-v17.js','utf8');\n          const context={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v17.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=17;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data};},window:{}};\n          vm.createContext(context);vm.runInContext(source,context);\n          (async()=>{const api=context.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-14-ipa92-v1-v17'||api.catalogTotal!==1086)throw new Error('v17 provider contract mismatch');const merged=await api.loadCatalog();if(merged.items.length!==1086||merged.counts?.subjectA!==892||merged.counts?.trackedSubjectA!==901||merged.counts?.catalogQuestions!==1086)throw new Error('m