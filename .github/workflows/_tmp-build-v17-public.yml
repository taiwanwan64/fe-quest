name: Build IPA 9.2 v17 public assets

on:
  push:
    branches: [ipa92-v17-public-activation-20260914]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate v17 public-safe assets
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def one(text, old, new, label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected one match, got {n}')
              return text.replace(old,new,1)

          items=[
            {'id':'ipa92_a_enterprise_architecture_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'EA（Enterprise Architecture）','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
            {'id':'ipa92_a_wfa_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'WFA（Work Flow Architecture）','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
            {'id':'ipa92_a_soa_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'SOA（Service Oriented Architecture）','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
            {'id':'ipa92_a_zachman_framework_001','sourcePool':'subject_a','cat':'システム戦略','difficulty':'standard','concept':'ザックマンフレームワーク','coreTopicId':'core_16_01','qualityAudit':'ipa92-original-v17'},
          ]
          Path('assets/question-catalog-ipa92-v17.json').write_text(json.dumps({'version':'ipa92-catalog-v17','contentVersion':'ipa92-questions-v17','contentVersions':['ipa92-questions-v17'],'counts':{'subjectA':4,'catalogQuestions':4},'items':items},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('assets/protected-content-provider-v376-v16.js').read_text(encoding='utf-8')
          p=one(p,"const IPA92_V16_CATALOG_URL=new URL('question-catalog-ipa92-v16.json',SCRIPT_URL).toString();","const IPA92_V16_CATALOG_URL=new URL('question-catalog-ipa92-v16.json',SCRIPT_URL).toString();\nconst IPA92_V17_CATALOG_URL=new URL('question-catalog-ipa92-v17.json',SCRIPT_URL).toString();",'catalog url')
          p=one(p,"const IPA92_V16_CATALOG_VERSION='ipa92-catalog-v16';","const IPA92_V16_CATALOG_VERSION='ipa92-catalog-v16';\nconst IPA92_V17_CATALOG_VERSION='ipa92-catalog-v17';",'catalog version')
          p=one(p,"const IPA92_V16_CONTENT_VERSION='ipa92-questions-v16';","const IPA92_V16_CONTENT_VERSION='ipa92-questions-v16';\nconst IPA92_V17_CONTENT_VERSION='ipa92-questions-v17';",'content version')
          p=one(p,"const IPA92_V16_TOTAL=4;","const IPA92_V16_TOTAL=4;\nconst IPA92_V17_TOTAL=4;",'v17 total')
          p=one(p,"const IPA92_EXTENSION_TOTAL=IPA92_V1_V6_TOTAL+IPA92_V7_TOTAL+IPA92_V8_TOTAL+IPA92_V9_TOTAL+IPA92_V10_TOTAL+IPA92_V11_TOTAL+IPA92_V12_TOTAL+IPA92_V13_TOTAL+IPA92_V14_TOTAL+IPA92_V15_TOTAL+IPA92_V16_TOTAL;","const IPA92_EXTENSION_TOTAL=IPA92_V1_V6_TOTAL+IPA92_V7_TOTAL+IPA92_V8_TOTAL+IPA92_V9_TOTAL+IPA92_V10_TOTAL+IPA92_V11_TOTAL+IPA92_V12_TOTAL+IPA92_V13_TOTAL+IPA92_V14_TOTAL+IPA92_V15_TOTAL+IPA92_V16_TOTAL+IPA92_V17_TOTAL;",'extension total')
          p=one(p,"fetchJson(IPA92_V15_CATALOG_URL),fetchJson(IPA92_V16_CATALOG_URL)","fetchJson(IPA92_V15_CATALOG_URL),fetchJson(IPA92_V16_CATALOG_URL),fetchJson(IPA92_V17_CATALOG_URL)",'fetch list')
          p=one(p,"v13,v14,v15,v16])=>{","v13,v14,v15,v16,v17])=>{",'destructure')
          p=one(p,"['v16',v16,IPA92_V16_CATALOG_VERSION,IPA92_V16_CONTENT_VERSION,IPA92_V16_TOTAL,'ipa92-original-v16']","['v16',v16,IPA92_V16_CATALOG_VERSION,IPA92_V16_CONTENT_VERSION,IPA92_V16_TOTAL,'ipa92-original-v16'],\n        ['v17',v17,IPA92_V17_CATALOG_VERSION,IPA92_V17_CONTENT_VERSION,IPA92_V17_TOTAL,'ipa92-original-v17']",'entries')
          p=one(p,"const extensionItems=[...legacy.items,...v7.items,...v8.items,...v9.items,...v10.items,...v11.items,...v12.items,...v13.items,...v14.items,...v15.items,...v16.items];","const extensionItems=[...legacy.items,...v7.items,...v8.items,...v9.items,...v10.items,...v11.items,...v12.items,...v13.items,...v14.items,...v15.items,...v16.items,...v17.items];",'items')
          p=one(p,"version:`${BASE_CATALOG_VERSION}+ipa92-catalog-v1-v16`,","version:`${BASE_CATALOG_VERSION}+ipa92-catalog-v1-v17`,",'merged version')
          p=one(p,"extensionContentVersion:'ipa92-questions-v1-v16',","extensionContentVersion:'ipa92-questions-v1-v17',",'extension version')
          p=one(p,"IPA92_V14_CONTENT_VERSION,IPA92_V15_CONTENT_VERSION,IPA92_V16_CONTENT_VERSION]),","IPA92_V14_CONTENT_VERSION,IPA92_V15_CONTENT_VERSION,IPA92_V16_CONTENT_VERSION,IPA92_V17_CONTENT_VERSION]),",'versions')
          p=one(p,"version:'v376-provider-13-ipa92-v1-v16',maxBatch:MAX_BATCH,maxCache:MAX_CACHE,catalogTotal:MERGED_CATALOG_TOTAL,","version:'v376-provider-14-ipa92-v1-v17',maxBatch:MAX_BATCH,maxCache:MAX_CACHE,catalogTotal:MERGED_CATALOG_TOTAL,",'provider version')
          Path('assets/protected-content-provider-v376-v17.js').write_text(p,encoding='utf-8')

          cpath=Path('cloud/public-config-v342.js'); c=cpath.read_text(encoding='utf-8')
          meta='''  const IPA92_V17_METADATA=Object.freeze([\n    {"id":"ipa92_a_enterprise_architecture_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"EA（Enterprise Architecture）","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"},\n    {"id":"ipa92_a_wfa_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"WFA（Work Flow Architecture）","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"},\n    {"id":"ipa92_a_soa_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"SOA（Service Oriented Architecture）","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"},\n    {"id":"ipa92_a_zachman_framework_001","sourcePool":"subject_a","cat":"システム戦略","difficulty":"standard","concept":"ザックマンフレームワーク","coreTopicId":"core_16_01","qualityAudit":"ipa92-original-v17"}\n  ].map(item=>Object.freeze(item)));\n\n'''
          c=one(c,'  function installMetadata(items,label,expectedTotal){',meta+'  function installMetadata(items,label,expectedTotal){','metadata')
          c=one(c,"  function installV16Metadata(){return installMetadata(IPA92_V16_METADATA,'v16',4)}","  function installV16Metadata(){return installMetadata(IPA92_V16_METADATA,'v16',4)}\n  function installV17Metadata(){return installMetadata(IPA92_V17_METADATA,'v17',4)}",'installer')
          c=one(c,'    const v16Install=installV16Metadata();','    const v16Install=installV16Metadata();\n    const v17Install=installV17Metadata();','install call')
          c=one(c,'    root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA_INSTALL=v16Install;','    root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA_INSTALL=v16Install;\n    root.FEQUEST_IPA92_V17_SUBJECT_A_METADATA_INSTALL=v17Install;','install global')
          c=one(c,"    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-13-ipa92-v1-v16'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1082;","    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-14-ipa92-v1-v17'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1086;",'provider check')
          c=one(c,'    const ok=providerOk&&v7Install.ok&&v8Install.ok&&v9Install.ok&&v10Install.ok&&v11Install.ok&&v12Install.ok&&v13Install.ok&&v14Install.ok&&v15Install.ok&&v16Install.ok;','    const ok=providerOk&&v7Install.ok&&v8Install.ok&&v9Install.ok&&v10Install.ok&&v11Install.ok&&v12Install.ok&&v13Install.ok&&v14Install.ok&&v15Install.ok&&v16Install.ok&&v17Install.ok;','ok')
          c=one(c,"    return Object.freeze({ok,status:ok?'activated':'metadata-install-failed',reused,v7:v7Install,v8:v8Install,v9:v9Install,v10:v10Install,v11:v11Install,v12:v12Install,v13:v13Install,v14:v14Install,v15:v15Install,v16:v16Install});","    return Object.freeze({ok,status:ok?'activated':'metadata-install-failed',reused,v7:v7Install,v8:v8Install,v9:v9Install,v10:v10Install,v11:v11Install,v12:v12Install,v13:v13Install,v14:v14Install,v15:v15Install,v16:v16Install,v17:v17Install});",'result')
          c=c.replace('function activateV16Provider()','function activateV17Provider()').replace("v376-provider-13-ipa92-v1-v16","v376-provider-14-ipa92-v1-v17").replace('fequest-ipa92-v16-provider','fequest-ipa92-v17-provider').replace('./assets/protected-content-provider-v376-v16.js','./assets/protected-content-provider-v376-v17.js')
          c=one(c,'  root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA=IPA92_V16_METADATA;','  root.FEQUEST_IPA92_V16_SUBJECT_A_METADATA=IPA92_V16_METADATA;\n  root.FEQUEST_IPA92_V17_SUBJECT_A_METADATA=IPA92_V17_METADATA;','metadata global')
          c=one(c,'  const latestProviderReady=activateV16Provider();','  const latestProviderReady=activateV17Provider();','activate')
          c=one(c,'  root.FEQUEST_IPA92_V16_PROVIDER_READY=latestProviderReady;','  root.FEQUEST_IPA92_V17_PROVIDER_READY=latestProviderReady;\n  root.FEQUEST_IPA92_V16_PROVIDER_READY=latestProviderReady;','ready')
          cpath.write_text(c,encoding='utf-8')

          spath=Path('sw.js'); s=spath.read_text(encoding='utf-8')
          s=one(s,"const CACHE_NAME = 'fe-quest-v377-15';","const CACHE_NAME = 'fe-quest-v377-16';",'cache')
          s=one(s,'  "./assets/protected-content-provider-v376-v16.js",','  "./assets/protected-content-provider-v376-v16.js",\n  "./assets/protected-content-provider-v376-v17.js",','sw provider')
          s=one(s,'  "./assets/question-catalog-ipa92-v16.json",','  "./assets/question-catalog-ipa92-v16.json",\n  "./assets/question-catalog-ipa92-v17.json",','sw catalog')
          spath.write_text(s,encoding='utf-8')

          Path('.github/IPA92_V17_ACTIVATION_2026-09-14.md').write_text('''# FE QUEST — IPA Ver.9.2 question v17 activation — 2026-09-14\n\n## Verified protected import\n\nThe protected v17 batch was imported through the private main + workflow_dispatch + GitHub OIDC path and verified against production before public-safe activation.\n\n- private repository: `taiwanwan64/fe-quest-private-source`\n- private source/main commit: `7f8fc5702aa07ea6f61029c65733c4232c3a1074`\n- content version: `ipa92-questions-v17`\n- imported questions: **4**\n- active protected question total after import: **1086**\n- active protected lessons: **130**\n- staging rows after finalization: **0**\n- import manifest rows for v17: **1**\n- payload SHA-256: `7a95d75d87b986238e2a686800ed0b1b4394e22317c64c352b7c3a2c800874f2`\n- source commit recorded by manifest: `7f8fc5702aa07ea6f61029c65733c4232c3a1074`\n- imported at: `2026-09-13 22:10:59.887+00`\n- import workflow run: `34786004882` — success\n- protected lesson import workflow run: `34786016692` — success\n\nThe protected `core_16_01` lesson was verified in production to contain EA context plus WFA, SOA and the Zachman framework. Existing lesson IDs remain stable.\n\n## Semantic-review decision\n\nThe pre-v17 corpus already covered information-system strategy and mentioned EA at lesson level, but direct practice for EA was thin and WFA, SOA and the Zachman framework had no direct evidence. The v17 remediation adds four original Subject-A questions and a narrow lesson overlay without duplicating broader strategy material.\n\n## Public-safe activation contract\n\nOnly safe metadata for the four v17 IDs is published. Stems, options, answers, explanations, hints and choice explanations remain protected.\n\n- provider version: `v376-provider-14-ipa92-v1-v17`\n- merged public catalog total: **1086**\n- extension content versions: `ipa92-questions-v1` through `ipa92-questions-v17`\n- public-safe extension metadata total: **182**\n- merged Subject-A count: **892**\n- tracked Subject-A count: **901**\n- service-worker cache: `fe-quest-v377-16`\n\n## Completion status\n\nThis activation does not promote this cluster or overall Ver.9.2 coverage to `verified-covered`. Practice density, interactive/visual verification, iPhone-equivalent touch/scroll QA, and learning-history/save-restore compatibility remain separate gates.\n''',encoding='utf-8')
          PY
      - name: Commit non-workflow activation assets
        run: |
          set -euo pipefail
          git config user.name 'taiwanwan64'
          git config user.email 'taiwanwan64@gmail.com'
          git add assets/protected-content-provider-v376-v17.js assets/question-catalog-ipa92-v17.json cloud/public-config-v342.js sw.js .github/IPA92_V17_ACTIVATION_2026-09-14.md
          git commit -m 'Add IPA 9.2 v17 public-safe assets'
          git push origin HEAD:ipa92-v17-public-activation-20260914
