name: FE QUEST v116 one-tap update release

on:
  push:
    paths:
      - '.github/workflows/v116-update.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v116 update-flow simplification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>FE QUEST PWA v115</title>','<title>FE QUEST PWA v116</title>')
          s=s.replace("const APP_VERSION = 'v115';","const APP_VERSION = 'v116';")
          s=s.replace("assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v115','v115 version/schema contract drift');","assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v116','v116 version/schema contract drift');")

          old="""async function applyPendingUpdateSafely(){
            if(profileConflictBlocked){
              showAppNotice('error','先に最新の学習データを読み込んでください','別の画面で更新された学習データがあるため、この古い画面からは更新を適用しません。','最新状態を読み込む',()=>location.reload());return false;
            }
            if(profileWriteBlocked&&profileRecoverySource==='future'){
              // The newer-format data is already stored. Never overwrite it with this older runtime;
              // applying a waiting service worker is the recovery path itself.
              persistResilientUiState();
              const futureWorker=pendingUpdateRegistration?.waiting;
              if(futureWorker)futureWorker.postMessage({type:'SKIP_WAITING'});else location.reload();
              return true;
            }
            if(profileWriteBlocked){
              showAppNotice('error','保存を確認してから更新してください','学習データへの保存が停止しています。現在の確定済みデータを書き出すか再読み込みしてから更新してください。','再読み込み',()=>location.reload());return false;
            }
            if(!persistProfileSilently()){
              showAppNotice('error','更新前の保存を確認できませんでした','未保存のままアプリを切り替えないよう更新を停止しました。再読み込みまたはデータ書き出し後にもう一度お試しください。');return false;
            }
            try{await Promise.race([writeRecoveryCheckpoint(profile,'pre-update',true),new Promise(resolve=>setTimeout(()=>resolve(false),1800))]);}catch(_e){}
            persistResilientUiState();
            const worker=pendingUpdateRegistration?.waiting;
            if(worker)worker.postMessage({type:'SKIP_WAITING'});
            else location.reload();
            return true;
          }
          function showUpdateAvailable(reg){
            pendingUpdateRegistration=reg;
            showAppNotice('update','新しいFE QUESTがあります','更新前に学習データの保存を確認し、可能なら長期復旧点を作ってから最新版へ切り替えます。','更新する',()=>applyPendingUpdateSafely());
            refreshPwaHealth();
          }
          """

          new="""function activatePendingUpdateOrReload(){
            // v116: updating is always a one-tap operation.  A blocked/conflicting screen has
            // already rolled in-memory data back to the last committed snapshot, so it must
            // not ask the learner to manually export/reload before installing a safer runtime.
            persistResilientUiState();
            const worker=pendingUpdateRegistration?.waiting;
            if(worker)worker.postMessage({type:'SKIP_WAITING'});
            else location.reload();
            return true;
          }
          async function applyPendingUpdateSafely(){
            // If this tab is stale, conflicted, or write-blocked, do not write from it.
            // Simply activate the waiting app and let the new runtime load the authoritative
            // committed profile. This avoids the previous manual reload/export loop.
            if(profileConflictBlocked||profileWriteBlocked){
              return activatePendingUpdateOrReload();
            }
            const saved=persistProfileSilently();
            if(!saved){
              // persistProfileSilently rolls the profile back to the committed snapshot on
              // failure/conflict.  Proceeding with the app update is therefore safer than
              // trapping the learner in a recovery workflow.
              return activatePendingUpdateOrReload();
            }
            try{await Promise.race([writeRecoveryCheckpoint(profile,'pre-update',true),new Promise(resolve=>setTimeout(()=>resolve(false),1800))]);}catch(_e){}
            return activatePendingUpdateOrReload();
          }
          function showUpdateAvailable(reg){
            pendingUpdateRegistration=reg;
            showAppNotice('update','FE QUESTを更新できます','学習データを保護して、自動で最新版へ切り替えます。','今すぐ更新',()=>applyPendingUpdateSafely());
            refreshPwaHealth();
          }
          """
          if old not in s:
              raise SystemExit('v115 update block not found')
          s=s.replace(old,new)

          old_assert="assert(String(applyPendingUpdateSafely).includes(\"profileRecoverySource==='future'\")&&String(applyPendingUpdateSafely).includes('SKIP_WAITING'),'v99 future-schema update escape missing');"
          new_assert="assert(typeof activatePendingUpdateOrReload==='function'&&String(activatePendingUpdateOrReload).includes('SKIP_WAITING')&&String(applyPendingUpdateSafely).includes('profileConflictBlocked||profileWriteBlocked'),'v116 one-tap safe-update path missing');"
          if old_assert not in s:
              raise SystemExit('v115 update self-check not found')
          s=s.replace(old_assert,new_assert)
          p.write_text(s)

          m=Path('manifest.webmanifest')
          ms=m.read_text()
          ms=ms.replace('"name": "FE QUEST v115"','"name": "FE QUEST v116"')
          old_desc='基本情報技術者試験向けPWA。v115では起動時の初期化順序を修正し、ホーム・学習・演習・計画の主要CTAが実際に動作する状態へ復旧。図解・操作ラボの内容描画も復旧し、BIT先生は画面を遮らないヘッダー右上へ移動。v114までの日常利用UX、問題・教材データ、データ保護、試験直前調整を維持。'
          new_desc='基本情報技術者試験向けPWA。v116ではアプリ更新を1タップ化し、保存停止・別画面競合・更新待機時でも手動の再読み込みやバックアップ操作を要求せず、安全な確定済み学習データを保ったまま最新版へ切り替える更新導線へ改善。v115までの主要CTA復旧、BIT先生配置、日常利用UX、問題・教材データ、データ保護、試験直前調整を維持。'
          if old_desc not in ms:
              raise SystemExit('v115 manifest description not found')
          ms=ms.replace(old_desc,new_desc)
          m.write_text(ms)

          sw=Path('sw.js')
          sws=sw.read_text().replace("const APP_VERSION = 'v115';","const APP_VERSION = 'v116';").replace("const CACHE_NAME = 'fe-quest-v115-1';","const CACHE_NAME = 'fe-quest-v116-1';")
          sw.write_text(sws)
          PY

          cat > audits/UPDATE_FLOW_SIMPLIFICATION_AUDIT_v116.txt <<'EOF'
          FE QUEST v116 — 更新導線簡素化 / 1タップ安全更新 監査

          ユーザー報告:
          - 更新通知から更新を押すと「保存を確認してから更新してください」となり、再読み込みを要求された。
          - 手動で復旧点を作ろうとしても「復旧点を作成できません」となり、更新のための手順が循環していた。

          v116の修正:
          - 更新通知を「FE QUESTを更新できます」「今すぐ更新」に簡素化。
          - 通常状態では、学習データを保存し、可能ならpre-update復旧点を自動作成してから更新する。
          - profileWriteBlocked / profileConflictBlocked の場合は古い画面から追加保存せず、確定済みデータを保護したまま待機中Service Workerを有効化する。
          - 保存確認に失敗した場合も、既存ロジックで最後の正常保存状態へ戻した後、そのまま最新版へ切り替える。
          - バックアップ書き出し、復旧点の手動作成、再読み込み後の再操作を更新条件にしない。

          データ保護:
          - Profile Schema v5維持。
          - 保存可能時のpre-update復旧点作成を維持。
          - 保存停止・競合時は古い画面から学習プロファイルを書き込まない。
          - controllerchange後の自動再読み込みとUI状態保存を維持。
          - 問題・教材データはv115から変更しない。

          静的検証:
          - APP_VERSION v116
          - Service Worker cache fe-quest-v116-1
          - 「保存を確認してから更新してください」の更新デッドエンドを削除
          - profileConflictBlocked || profileWriteBlocked → activatePendingUpdateOrReload の自動経路を追加
          - SKIP_WAITING / controllerchange / pre-update checkpointを維持

          利用手順:
          更新通知が表示されたら「今すぐ更新」を1回押すだけ。
          EOF

          python - <<'PY'
          import json,re
          from pathlib import Path
          html=Path('index.html').read_text()
          json.load(open('manifest.webmanifest'))
          assert 'FE QUEST PWA v116' in html
          assert "const APP_VERSION = 'v116';" in html
          assert 'FE QUESTを更新できます' in html
          assert '今すぐ更新' in html
          assert '保存を確認してから更新してください' not in html
          assert 'if(profileConflictBlocked||profileWriteBlocked)' in html
          assert "writeRecoveryCheckpoint(profile,'pre-update',true)" in html
          assert "postMessage({type:'SKIP_WAITING'})" in html
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          assert len(scripts)==1
          Path('/tmp/main.js').write_text(scripts[0])
          PY
          node --check /tmp/main.js
          grep -q "const APP_VERSION = 'v116';" sw.js
          grep -q "fe-quest-v116-1" sw.js

      - name: Commit v116 and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/v116-update.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release FE QUEST v116 one-tap update flow'
          git push
