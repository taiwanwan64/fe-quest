name: FE QUEST v152 release validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Probe built boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('_site/index.html').read_text(encoding='utf-8')
          legacy_decl=len(re.findall(r'(?m)^\s*function runAppSelfCheck\(\)\{',h))
          old_boot=h.count('window.FEQUEST_SELF_CHECK=runAppSelfCheck();')
          new_boot=h.count('window.FEQUEST_SELF_CHECK=runV152SelfCheck();')
          version=h.count("const APP_VERSION = 'v152';")
          manifest=Path('_site/manifest.webmanifest').exists()
          sw=Path('_site/sw.js').exists()
          fixture=len(list(Path('_site').rglob('legacy-run-app-self-check-v131.fixture.json')))
          msg='bytes={} legacyDecl={} oldBoot={} newBoot={} version={} manifest={} sw={} fixtureDeployed={}'.format(len(h.encode('utf-8')),legacy_decl,old_boot,new_boot,version,manifest,sw,fixture)
          print('::warning title=FE QUEST v152 build probe::'+msg)
          PY
      - name: Validate FE QUEST v152
        run: python3 tools/v152_validate.py
