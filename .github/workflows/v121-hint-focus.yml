name: FE QUEST v121 hint focus

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v121-hint-focus.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v121 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('<title>FE QUEST PWA v120</title>', '<title>FE QUEST PWA v121</title>'),
              ("const APP_VERSION = 'v120';", "const APP_VERSION = 'v121';"),
              ("assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v120','v120 version/schema contract drift');", "assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v121','v121 version/schema contract drift');"),
              ("document.getElementById('quizResultTitle').textContent='💡 もう一度考えてみましょう';\n    document.getElementById('quizExplanation').textContent=q.hint;\n    document.getElementById('quizHint').textContent='まだ正解は表示しません。ヒントを使って、別の根拠で選び直してください。';", "document.getElementById('quizResultTitle').textContent='💡 ヒント';\n    document.getElementById('quizExplanation').textContent=q.hint;\n    document.getElementById('quizHint').textContent='';")
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('missing index target: ' + old[:80])
              s = s.replace(old, new, 1)
          marker = '  // 通常演習ではすべて「初回誤答→ヒント→1回だけ再挑戦」に統一する。\n'
          if marker in s:
              s = s.replace(marker, marker + '  // v121: 誤答時はヒント本文だけを表示し、採点ルールやメタ説明は出さない。\n', 1)
          p.write_text(s, encoding='utf-8')

          m = Path('manifest.webmanifest')
          ms = m.read_text(encoding='utf-8')
          if '"name": "FE QUEST v120"' not in ms:
              raise SystemExit('manifest version target missing')
          ms = ms.replace('"name": "FE QUEST v120"', '"name": "FE QUEST v121"', 1)
          old_desc = '"description": "基本情報技術者試験向けPWA。v120では問題画面のメタ情報タグを同じ高さ・余白で整列し、意味の薄い「問題」表示を削除。誤答時の再挑戦ルールや復習登録の処理説明を問題画面から外し、学習者が問題・ヒント・解説に集中できる表示へ整理。v119までのスマホ横スクロール対策、演習集中表示、CTA配置、問題・教材データを維持。"'
          new_desc = '"description": "基本情報技術者試験向けPWA。v121では誤答時の表示を「ヒント本文＋もう一度回答する」に絞り、「まだ正解は表示しません」「ヒントを使って」など問題解答に不要なメタ説明を削除。v120までの問題タグ整列、復習登録の非表示化、スマホ横スクロール対策、演習集中表示、CTA配置、問題・教材データを維持。"'
          if old_desc not in ms:
              raise SystemExit('manifest description target missing')
          ms = ms.replace(old_desc, new_desc, 1)
          m.write_text(ms, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          if "const APP_VERSION = 'v120';" not in sws:
              raise SystemExit('service worker version target missing')
          sws = sws.replace("const APP_VERSION = 'v120';", "const APP_VERSION = 'v121';", 1)
          sws = sws.replace("const CACHE_NAME = 'fe-quest-v120-1';", "const CACHE_NAME = 'fe-quest-v121-1';", 1)
          sw.write_text(sws, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v121';" in s
          assert "APP_VERSION==='v121'" in s
          assert 'まだ正解は表示しません。ヒントを使って、別の根拠で選び直してください。' not in s
          assert "document.getElementById('quizResultTitle').textContent='💡 ヒント';" in s
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', s)
          Path('/tmp/feq-main.js').write_text('\n'.join(scripts), encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          PY
          node --check /tmp/feq-main.js
          node --check sw.js

      - name: Commit release
        shell: bash
        run: |
          rm -f .github/workflows/v121-hint-focus.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.webmanifest sw.js .github/workflows/v121-hint-focus.yml
          git commit -m 'Release FE QUEST v121 hint-focused retry feedback'
          git push
