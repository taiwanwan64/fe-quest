name: Promote IPA 9.2 v23 public workflows

on:
  push:
    branches: [ipa92-v23-public-activation-20260914]
    paths:
      - '.github/workflows/promote-ipa92-v23-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ipa92-v23-public-activation-20260914
      - name: Promote reviewed generated workflows and clean scaffolding
        run: |
          set -euo pipefail
          test -f .github/generated/validate-ipa92-question-v23-public.yml
          test -f .github/generated/validate-publication.yml
          test -f .github/generated/deploy-pages.yml
          cp .github/generated/validate-ipa92-question-v23-public.yml .github/workflows/validate-ipa92-question-v23-public.yml
          cp .github/generated/validate-publication.yml .github/workflows/validate-publication.yml
          cp .github/generated/deploy-pages.yml .github/workflows/deploy-pages.yml
          rm -rf .github/generated
          rm -f .github/workflows/generate-ipa92-v23-public.yml
          rm -f .github/workflows/generate-ipa92-v23-public-fix.yml
          rm -f .github/workflows/promote-ipa92-v23-public.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote IPA 9.2 v23 public workflows'
          git push origin HEAD:ipa92-v23-public-activation-20260914
