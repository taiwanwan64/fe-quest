      - '.github/workflows/auth-live-test-v342.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated live auth page
        run: python3 .github/cloud-sync-v342/validate_auth_live_test.py
