name: Validate FE QUEST v145

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v145-validate.yml'

permissions:
  contents: read
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v145.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v145' index.html
          grep -q "APP_VERSION = 'v145'" sw.js
          grep -q "CACHE_NAME = 'fe-quest-v145-1'" sw.js
          grep -q 'FE QUEST v145' manifest.webmanifest
          grep -q '{% capture v145block %}' index.html
          grep -q 'runV145SelfCheck()' index.html
          grep -q "architecture:'v145-three-layer'" app/v145-block-00.txt
          grep -q "currentContract:current" app/v145-block-00.txt
          grep -q "historicalDiagnostics:historical" app/v145-block-00.txt
          grep -q "browserUiContract:browserUi" app/v145-block-00.txt
          cp app/v145-block-00.txt /tmp/v145-check.js
          node --check /tmp/v145-check.js
          python -m py_compile tools/v145_validate.py

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA, DOM contracts and runtime
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v145</title>' _site/index.html
          grep -q "const APP_VERSION = 'v145';" _site/index.html
          grep -q 'v145-three-layer' _site/index.html
          grep -q "APP_VERSION = 'v145'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v145-1'" _site/sw.js
          python -m json.tool _site/manifest.webmanifest >/dev/null
          python tools/v145_validate.py
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v145.zip .)

      - name: Upload standalone v145 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v145
          path: FE_QUEST_PWA_v145.zip
          retention-days: 90
