name: FE QUEST v353 inline lesson diagram

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v353/**'
      - '.github/workflows/v353-inline-lesson-diagram.yml'
      - '.github/workflows/v353-materialize-inline-lesson-diagram.yml'
      - 'audits/V353_INLINE_LESSON_DIAGRAM.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v353.html'
      - 'app/core-twos-complement-diagram-v353.js'
      - 'app/core-twos-complement-diagram-v353.css'
      - 'assets/app-v353.css'
      - 'assets/app-v353.js'
      - 'assets/asset-manifest-v353.json'

permissions:
  contents: read

jobs:
  validate-v353-inline-lesson-diagram:
    if: startsWith(github.head_ref, 'v353-inline-lesson-diagram')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v353/.*|\.github/workflows/v353-inline-lesson-diagram\.yml|\.github/workflows/v353-materialize-inline-lesson-diagram\.yml|audits/V353_INLINE_LESSON_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v353\.html|app/core-twos-complement-diagram-v353\.js|app/core-twos-complement-diagram-v353\.css|assets/app-v353\.css|assets/app-v353\.js|assets/asset-manifest-v353\.json)$' | grep -q .; then
            echo 'Unexpected file in the v353 inline lesson diagram release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v352.html assets/app-v352.css assets/app-v352.js assets/asset-manifest-v352.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v353/validate_inline_lesson_diagram.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive lesson diagram
        run: python .github/v353/browser_inline_lesson_diagram.py
      - name: Upload lesson diagram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v353-inline-lesson-diagram-evidence
          path: _browser_evidence/v353/
          if-no-files-found: warn
          retention-days: 14
