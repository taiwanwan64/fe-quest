name: FE QUEST v171 stable learning source validation

on:
  push:
    branches: [v171-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v171-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v171 stable learning source boundary
        run: python3 tools/v171_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build stable production source
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Prepare v170-versioned boundary reference
        run: python3 tools/v171_prepare_reference.py

      - name: Build versioned-boundary reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_v171_reference_src
          destination: ./_site_reference

      - name: Validate FE QUEST v171 learning source equivalence
        run: python3 tools/v171_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V171_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST v171 stable learning source boundary"
            git push origin HEAD:v171-staging
          fi
          echo "FEQUEST_V171_VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Package FE QUEST v171
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v171.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum FE_QUEST_PWA_v171.zip

      - name: Upload FE QUEST v171
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v171-standalone
          path: FE_QUEST_PWA_v171.zip
          if-no-files-found: error
          retention-days: 90
