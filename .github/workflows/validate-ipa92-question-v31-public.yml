name: Validate IPA 9.2 question v31 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v31.js'
      - 'assets/question-catalog-ipa92-v31.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V31_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v31-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v31-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v31.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v31 safe public contract and runtime merge
        run: |
          node <<'CHECK'
          const fs=require('node:fs');const vm=require('node:vm');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v31.json','utf8'));const provider=fs.readFileSync('assets/protected-content-provider-v376-v31.js','utf8');const config=fs.readFileSync('cloud/public-config-v342.js','utf8');const sw=fs.readFileSync('sw.js','utf8');
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          const ids=['ipa92_a_superscalar_vliw_001','ipa92_a_amdahl_law_001','ipa92_a_flynn_architecture_001','ipa92_a_swapping_001','ipa92_a_segment_paging_001'];
          if(catalog.version!=='ipa92-catalog-v31'||catalog.contentVersion!=='ipa92-questions-v31'||catalog.items?.length!==5||catalog.counts?.subjectA!==5||catalog.counts?.catalogQuestions!==5)throw new Error('v31 catalog contract');
          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v31 ids');
          for(const item of catalog.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v31'||!['コンピュータ構成要素','ソフトウェア'].includes(item.cat)||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||''))||Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('invalid safe metadata');}
          if(!provider.includes("version:'v376-provider-28-ipa92-v1-v31'")||!provider.includes('const IPA92_V31_TOTAL=5;')||!provider.includes("const IPA92_V31_CONTENT_VERSION='ipa92-questions-v31';"))throw new Error('provider contract');
          if(!config.includes('const IPA92_V31_METADATA=Object.freeze([')||!config.includes('activateV31Provider()')||!config.includes('catalogTotal===1153'))throw new Error('config contract');
          if(!sw.includes('"./assets/protected-content-provider-v376-v31.js"')||!sw.includes('"./assets/question-catalog-ipa92-v31.json"')||!sw.includes("const CACHE_NAME = 'fe-quest-v377-28';"))throw new Error('sw contract');
          const context={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v31.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const name=new URL(String(url)).pathname.split('/').pop();return {ok:true,status:200,json:async()=>JSON.parse(fs.readFileSync('assets/'+name,'utf8'))}},window:{}};vm.createContext(context);vm.runInContext(provider,context);
          (async()=>{const merged=await context.window.FEQUEST_PROTECTED_CONTENT.loadCatalog();if(merged.items.length!==1153||merged.counts?.subjectA!==959||merged.counts?.trackedSubjectA!==968||merged.counts?.catalogQuestions!==1153)throw new Error('merged counts');for(const id of ids)if(!merged.items.some(x=>x.id===id))throw new Error('missing '+id);console.log('PASS v31 public contract: 5 safe metadata items, merged production total 1153');})().catch(e=>{console.error(e);process.exitCode=1});
          CHECK
      - name: Validate production evidence marker
        run: |
          grep -Fq 'active protected question total after import: **1153**' .github/IPA92_V31_ACTIVATION_2026-09-15.md
          grep -Fq '0cfa3f0b4929993b9b949670356b50f26978c470' .github/IPA92_V31_ACTIVATION_2026-09-15.md
          grep -Fq 'fa632c704fe0e531fcffd5c4ddab6e07b5da9389bc8622170c33dff17f701eed' .github/IPA92_V31_ACTIVATION_2026-09-15.md
          grep -Fq '34951718668' .github/IPA92_V31_ACTIVATION_2026-09-15.md
          grep -Fq 'v376-lessons-1' .github/IPA92_V31_ACTIVATION_2026-09-15.md
