name: FE QUEST v342 sync integration discovery

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/cloud-sync-v342/discover_integration_boundary.py'
      - '.github/workflows/cloud-sync-integration-v342.yml'
      - 'cloud/**'
      - 'app/base-shell-v341.html'
      - 'assets/app-v341.js'

permissions:
  contents: write

jobs:
  discover:
    if: startsWith(github.head_ref, 'cloud-sync-integration-v342')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v342 integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Discover exact production local commit boundary
        run: python3 .github/cloud-sync-v342/discover_integration_boundary.py

      - name: Commit integration discovery evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/V342_SYNC_INTEGRATION_DISCOVERY.json audits/V342_SYNC_INTEGRATION_DISCOVERY.md
          if ! git diff --cached --quiet; then
            git commit -m "Record FE QUEST v342 sync integration boundary"
            git fetch origin "$GITHUB_HEAD_REF"
            git rebase "origin/$GITHUB_HEAD_REF"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
