name: FE QUEST v128 full-bank quality release
on:
  push:
    paths:
      - 'tools/apply_v128.py'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v128
        run: python tools/apply_v128.py
      - name: Verify v128
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text()
          assert "<title>FE QUEST PWA v128</title>" in s
          assert "const APP_VERSION = 'v128';" in s
          assert "SUBJECT_A_V128_QUALITY_OVERRIDE_IDS.length===28" in s
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/main.js').write_text(max(scripts,key=len))
          m=json.loads(Path('manifest.webmanifest').read_text())
          assert m['name']=='FE QUEST v128'
          w=Path('sw.js').read_text()
          assert "const APP_VERSION = 'v128';" in w and "fe-quest-v128-1" in w
          print('V128_STATIC_VERIFY_OK')
          PY
          node --check /tmp/main.js
          node --check sw.js
      - name: Commit v128
        run: |
          rm -rf tools .github/workflows/v128-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release FE QUEST v128 Subject A quality audit"
          git push
