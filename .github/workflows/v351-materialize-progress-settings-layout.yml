name: Materialize FE QUEST v351 layout release

on:
  push:
    branches: ['v351-progress-settings-polish']
    paths:
      - 'app/progress-settings-layout-v351.css'
      - '.github/v351/materialize_progress_settings_layout.py'
      - '.github/workflows/v351-materialize-progress-settings-layout.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v351-progress-settings-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize versioned split release
        run: python .github/v351/materialize_progress_settings_layout.py
      - name: Validate generated release
        run: python .github/v351/validate_progress_settings_layout.py
      - name: Commit generated v351 assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js app/base-shell-v351.html assets/app-v351.css assets/app-v351.js assets/asset-manifest-v351.json
          if git diff --cached --quiet; then
            echo 'v351 assets already materialized'
            exit 0
          fi
          git commit -m 'Materialize FE QUEST v351 split release'
          git push origin HEAD:v351-progress-settings-polish
