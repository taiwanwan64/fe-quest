name: Validate IPA 9.2 question v18 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v18.js'
      - 'assets/question-catalog-ipa92-v18.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V18_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v18-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v18-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v18.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v18 public-safe catalog
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v18.json','utf8'));
          const ids=['ipa92_a_vrio_001','ipa92_a_growth_matrix_001','ipa92_a_3c_001'];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(c.version!=='ipa92-catalog-v18'||c.contentVersion!=='ipa92-questions-v18'||JSON.stringify(c.contentVersions)!==JSON.stringify(['ipa92-questions-v18']))throw new Error('v18 catalog version mismatch');
          if(c.counts?.subjectA!==3||c.counts?.catalogQuestions!==3||c.items?.length!==3||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v18 catalog contract mismatch');
          for(const item of c.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v18'||item.cat!=='経営戦略'||!['core_18_03','core_18_05'].includes(item.coreTopicId))throw new Error('v18 metadata contract mismatch');if(Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('protected field leaked');}
          console.log('PASS v18 safe catalog');
          NODE
      - name: Validate provider merge and runtime activation
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));const versions={};for(let i=7;i<=18;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));
          const src=fs.readFileSync('assets/protected-content-provider-v376-v18.js','utf8');const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v18.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=18;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data};},window:{}};vm.createContext(ctx);vm.runInContext(src,ctx);
          (async()=>{const api=ctx.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-15-ipa92-v1-v18'||api.catalogTotal!==1089)throw new Error('provider contract');const m=await api.loadCatalog();if(m.items.length!==1089||m.counts?.subjectA!==895||m.counts?.trackedSubjectA!==904||m.counts?.catalogQuestions!==1089)throw new Error('merged counts');const expected=Array.from({length:18},(_,i)=>'ipa92-questions-v'+(i+1));if(JSON.stringify(m.extensionContentVersions)!==JSON.stringify(expected)||new Set(m.items.map(x=>x.id)).size!==1089)throw new Error('merged versions/ids');console.log('PASS provider 1089');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');const source=fs.readFileSync('cloud/public-config-v342.js','utf8');const bank=Array.from({length:83},(_,i)=>({id:'legacy_'+i}));const listeners={};const script={id:'',src:'',async:true,addEventListener(t,f){listeners[t]=f}};let ctx;const document={getElementById(){return null},createElement(){return script},head:{appendChild(n){if(n.src!=='./assets/protected-content-provider-v376-v18.js')throw new Error('provider src');ctx.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-15-ipa92-v1-v18',catalogTotal:1089};listeners.load()}}};ctx={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-14-ipa92-v1-v17',catalogTotal:1086}};vm.createContext(ctx);vm.runInContext('const QUESTION_BANK='+JSON.stringify(bank)+';\n'+source+'\nglobalThis.__BANK__=QUESTION_BANK;',ctx);(async()=>{const r=await ctx.FEQUEST_IPA92_V18_PROVIDER_READY;if(!r?.ok||ctx.__BANK__.length!==185||ctx.FEQUEST_IPA92_V18_SUBJECT_A_METADATA?.length!==3)throw new Error('runtime metadata');for(let i=7;i<=17;i++)if(ctx['FEQUEST_IPA92_V'+i+'_PROVIDER_READY']!==ctx.FEQUEST_IPA92_V18_PROVIDER_READY)throw new Error('readiness alias '+i);console.log('PASS runtime metadata 185');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Validate publication and import checkpoint
        run: |
          grep -Fq '"./assets/protected-content-provider-v376-v18.js"' sw.js
          grep -Fq '"./assets/question-catalog-ipa92-v18.json"' sw.js
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-17';" sw.js
          grep -Fq 'active protected question total after import: **1089**' .github/IPA92_V18_ACTIVATION_2026-09-14.md
          grep -Fq '7314adcab7cac74b7781b6d7718793796105c5eb' .github/IPA92_V18_ACTIVATION_2026-09-14.md
          grep -Fq 'fa4a0f9e6404e5a3d0e010168c4d188e65561e4115e1448735505c67200d0b1c' .github/IPA92_V18_ACTIVATION_2026-09-14.md
          grep -Fq '34788793844' .github/IPA92_V18_ACTIVATION_2026-09-14.md
          grep -Fq '34788801896' .github/IPA92_V18_ACTIVATION_2026-09-14.md
