name: FE QUEST v351 progress settings layout

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v351/**'
      - '.github/workflows/v351-progress-settings-layout.yml'
      - '.github/workflows/v351-materialize-progress-settings-layout.yml'
      - '.github/workflows/v346-external-beta-readiness.yml'
      - '.github/workflows/v347-beta-journey-dry-run.yml'
      - 'audits/V351_PROGRESS_SETTINGS_LAYOUT.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v351.html'
      - 'app/progress-settings-layout-v351.css'
      - 'assets/app-v351.css'
      - 'assets/app-v351.js'
      - 'assets/asset-manifest-v351.json'

permissions:
  contents: read

jobs:
  validate-v351-layout:
    if: startsWith(github.head_ref, 'v351-progress-settings-polish')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v351/.*|\.github/workflows/v351-progress-settings-layout\.yml|\.github/workflows/v351-materialize-progress-settings-layout\.yml|\.github/workflows/v346-external-beta-readiness\.yml|\.github/workflows/v347-beta-journey-dry-run\.yml|audits/V351_PROGRESS_SETTINGS_LAYOUT\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v351\.html|app/progress-settings-layout-v351\.css|assets/app-v351\.css|assets/app-v351\.js|assets/asset-manifest-v351\.json)$' | grep -q .; then
            echo 'Unexpected file in the v351 layout release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v345.html assets/app-v345.css assets/app-v345.js assets/asset-manifest-v345.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v351/validate_progress_settings_layout.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive browser layout
        run: python .github/v351/browser_progress_settings_layout.py
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v351-progress-settings-layout-evidence
          path: _browser_evidence/v351/
          if-no-files-found: warn
          retention-days: 14
