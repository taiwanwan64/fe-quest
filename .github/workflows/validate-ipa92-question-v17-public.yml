name: Validate IPA 9.2 question v17 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v17.js'
      - 'assets/question-catalog-ipa92-v17.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V17_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v17-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v17-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v17.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v17 public-safe catalog
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v17.json','utf8'));
          const ids=['ipa92_a_enterprise_architecture_001','ipa92_a_wfa_001','ipa92_a_soa_001','ipa92_a_zachman_framework_001'];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(c.version!=='ipa92-catalog-v17'||c.contentVersion!=='ipa92-questions-v17'||JSON.stringify(c.contentVersions)!==JSON.stringify(['ipa92-questions-v17']))throw new Error('v17 catalog version mismatch');
          if(c.counts?.subjectA!==4||c.counts?.catalogQuestions!==4||c.items?.length!==4||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v17 catalog contract mismatch');
          for(const item of c.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v17'||item.cat!=='システム戦略'||item.coreTopicId!=='core_16_01')throw new Error('v17 metadata contract mismatch');if(Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('protected field leaked');}
          console.log('PASS v17 safe catalog');
          NODE
      - name: Validate provider merge and runtime activation
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));const versions={};for(let i=7;i<=17;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));
          const src=fs.readFileSync('assets/protected-content-provider-v376-v17.js','utf8');const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v17.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=17;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data};},window:{}};vm.createContext(ctx);vm.runInContext(src,ctx);
          (async()=>{const api=ctx.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-14-ipa92-v1-v17'||api.catalogTotal!==1086)throw new Error('provider contract');const m=await api.loadCatalog();if(m.items.length!==1086||m.counts?.subjectA!==892||m.counts?.trackedSubjectA!==901||m.counts?.catalogQuestions!==1086)throw new Error('merged counts');const expected=Array.from({length:17},(_,i)=>'ipa92-questions-v'+(i+1));if(JSON.stringify(m.extensionContentVersions)!==JSON.stringify(expected)||new Set(m.items.map(x=>x.id)).size!==1086)throw new Error('merged versions/ids');console.log('PASS provider 1086');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');const source=fs.readFileSync('cloud/public-config-v342.js','utf8');const bank=Array.from({length:83},(_,i)=>({id:'legacy_'+i}));const listeners={};const script={id:'',src:'',async:true,addEventListener(t,f){listeners[t]=f}};let ctx;const document={getElementById(){return null},createElement(){return script},head:{appendChild(n){if(n.src!=='./assets/protected-content-provider-v376-v17.js')throw new Error('provider src');ctx.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-14-ipa92-v1-v17',catalogTotal:1086};listeners.load()}}};ctx={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-13-ipa92-v1-v16',catalogTotal:1082}};vm.createContext(ctx);vm.runInContext('const QUESTION_BANK='+JSON.stringify(bank)+';\n'+source+'\nglobalThis.__BANK__=QUESTION_BANK;',ctx);(async()=>{const r=await ctx.FEQUEST_IPA92_V17_PROVIDER_READY;if(!r?.ok||ctx.__BANK__.length!==182||ctx.FEQUEST_IPA92_V17_SUBJECT_A_METADATA?.length!==4)throw new Error('runtime metadata');for(let i=7;i<=16;i++)if(ctx['FEQUEST_IPA92_V'+i+'_PROVIDER_READY']!==ctx.FEQUEST_IPA92_V17_PROVIDER_READY)throw new Error('readiness alias '+i);console.log('PASS runtime metadata 182');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Validate publication and import checkpoint
        run: |
          grep -Fq '"./assets/protected-content-provider-v376-v17.js"' sw.js
          grep -Fq '"./assets/question-catalog-ipa92-v17.json"' sw.js
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-16';" sw.js
          grep -Fq 'active protected question total after import: **1086**' .github/IPA92_V17_ACTIVATION_2026-09-14.md
          grep -Fq '7f8fc5702aa07ea6f61029c65733c4232c3a1074' .github/IPA92_V17_ACTIVATION_2026-09-14.md
          grep -Fq '7a95d75d87b986238e2a686800ed0b1b4394e22317c64c352b7c3a2c800874f2' .github/IPA92_V17_ACTIVATION_2026-09-14.md
          grep -Fq '34786004882' .github/IPA92_V17_ACTIVATION_2026-09-14.md
          grep -Fq '34786016692' .github/IPA92_V17_ACTIVATION_2026-09-14.md
