name: Validate IPA 9.2 question v24 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v24.js'
      - 'assets/question-catalog-ipa92-v24.json'
      - '.github/IPA92_V24_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v24-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v24-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v24 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v24.js
          node -e "const c=require('./assets/question-catalog-ipa92-v24.json');if(c.version!=='ipa92-catalog-v24'||c.contentVersion!=='ipa92-questions-v24'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-21-ipa92-v1-v24'" assets/protected-content-provider-v376-v24.js
          grep -Fq 'active protected question total after import: **1119**' .github/IPA92_V24_ACTIVATION_2026-09-14.md
