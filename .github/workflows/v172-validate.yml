name: FE QUEST v172 stable base validation

on:
  push:
    branches: [v172-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v172-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align stable-base Liquid structural whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/v172_materialize.py')
          s=p.read_text()
          old="if old_projection in s: s=s.replace(old_projection,stable_capture,1)"
          new="stable_projection=stable_capture+'\\n'*7\nif old_projection in s: s=s.replace(old_projection,stable_projection,1)"
          if old in s: s=s.replace(old,new,1)
          if "stable_projection=stable_capture+'\\n'*7" not in s: raise AssertionError('materializer whitespace patch')
          p.write_text(s)
          p=Path('tools/v172_prepare_reference.py')
          s=p.read_text()
          old="req(stable in s,'stable base capture not found')\ns=s.replace(stable,legacy,1)"
          new="stable_projection=stable+'\\n'*7\nreq(stable_projection in s,'stable base capture with structural whitespace not found')\ns=s.replace(stable_projection,legacy,1)"
          if old in s: s=s.replace(old,new,1)
          if "stable_projection=stable+'\\n'*7" not in s: raise AssertionError('reference whitespace patch')
          p.write_text(s)
          print('FEQUEST_V172_LIQUID_WHITESPACE_ALIGNED structural-newlines=7')
          PY

      - name: Instrument self-check failure detail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/v172_validate.py')
          s=p.read_text()
          old="const __feqSelfRaw=globalThis.FEQUEST_SELF_CHECK;if(!__feqSelfRaw)throw new Error('snapshot self-check missing');"
          new=old+"console.log('__FEQ_SELF_ERRORS__ '+JSON.stringify(__feqSelfRaw.errors||[]));"
          if old in s and '__FEQ_SELF_ERRORS__' not in s: s=s.replace(old,new,1)
          if '__FEQ_SELF_ERRORS__' not in s: raise AssertionError('self-check instrumentation')
          old2="req(m.group(3)=='1',label+' self-check')"
          new2="\n    if m.group(3)!='1':\n        print(z.stdout)\n    req(m.group(3)=='1',label+' self-check')"
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s)
          PY

      - name: Materialize v172 stable production base
        run: python3 tools/v172_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build stable-base production source
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Prepare legacy-Liquid projection reference
        run: python3 tools/v172_prepare_reference.py

      - name: Build legacy-Liquid projection reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_v172_reference_src
          destination: ./_site_reference

      - name: Diagnose generated HTML byte boundary
        shell: bash
        run: |
          wc -c _site/index.html _site_reference/index.html
          sha256sum _site/index.html _site_reference/index.html
          python3 - <<'PY'
          from pathlib import Path
          a=Path('_site/index.html').read_bytes(); b=Path('_site_reference/index.html').read_bytes()
          n=min(len(a),len(b)); i=next((i for i in range(n) if a[i]!=b[i]),n)
          print('FEQUEST_V172_FIRST_DIFF',i,'len-a',len(a),'len-b',len(b),'equal',a==b)
          PY

      - name: Validate FE QUEST v172 base equivalence
        run: python3 tools/v172_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V172_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST v172 stable production base"
            git push origin HEAD:v172-staging
          fi
          echo "FEQUEST_V172_VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Package FE QUEST v172
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v172.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum FE_QUEST_PWA_v172.zip

      - name: Upload FE QUEST v172
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v172-standalone
          path: FE_QUEST_PWA_v172.zip
          if-no-files-found: error
          retention-days: 90
