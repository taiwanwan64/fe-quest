name: FE QUEST v165 release validation

on:
  push:
    branches: [v165-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v165-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v165 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def sha(b): return hashlib.sha256(b).hexdigest()
          def req(v,m):
              if not v: raise SystemExit(m)

          expected_runtime_sha='88db821278597a5a2dc073da6935ceb979b39632b243fed9cd7846cd924abe50'
          archived=[]
          rendered=b''
          for i in range(9):
              p=Path(f'app/runtime-semantic-diagnostics-v159-{i:02d}.txt')
              b=p.read_bytes(); rendered+=b
              archived.append({'path':str(p),'sha256':sha(b),'utf8_bytes':len(b)})
          req(len(rendered)==55525 and sha(rendered)==expected_runtime_sha,'archival runtime identity mismatch')
          Path('app/runtime-semantic-diagnostics.txt').write_bytes(rendered)
          for i in range(9):
              p=Path(f'app/runtime-semantic-diagnostics-{i:02d}.txt')
              if p.exists(): p.unlink()

          fp=Path('app/runtime-diagnostic-data-finalize.txt')
          fs=fp.read_text()
          fs=fs.replace("projectionMode:'stable-semantic-runtime-loader'","projectionMode:'stable-physical-semantic-runtime-source'")
          fp.write_text(fs)
          req(len(fp.read_bytes())==1255 and sha(fp.read_bytes())=='df1b9caab6cf990bb43e9199227a200bda6202442b06bce4c9cd1af6d9cb2645','finalizer identity mismatch')

          wp=Path('app/runtime-diagnostic-wrapper.txt')
          s=wp.read_text()
          s=s.replace('semanticRuntimeLoaderModule','physicalRuntimeModule').replace('semanticRuntimeLoaderSourceCount','physicalRuntimeSourceCount')
          s=s.replace('    materializedRuntimeParts:Object.freeze(["app/runtime-semantic-diagnostics-00.txt","app/runtime-semantic-diagnostics-01.txt","app/runtime-semantic-diagnostics-02.txt","app/runtime-semantic-diagnostics-03.txt","app/runtime-semantic-diagnostics-04.txt","app/runtime-semantic-diagnostics-05.txt","app/runtime-semantic-diagnostics-06.txt","app/runtime-semantic-diagnostics-07.txt","app/runtime-semantic-diagnostics-08.txt"]),\n','')
          s=s.replace('    materializedRuntimePartCount:9,\n','')
          s=s.replace('renderedRuntimeSha256','physicalRuntimeSha256').replace('renderedRuntimeUtf8Bytes','physicalRuntimeUtf8Bytes')
          s=s.replace('_regression/single-semantic-runtime-loader-v163.fixture.json','_regression/physical-semantic-runtime-source-v165.fixture.json')
          s=s.replace('single-loader-module-byte-exact-stable-parts','byte-exact-physical-semantic-runtime-source')
          s=s.replace('single-semantic-runtime-loader','single-physical-semantic-runtime-source')
          s=s.replace("Object.freeze(['runV160SelfCheck','runV161SelfCheck','runV162SelfCheck','runV163SelfCheck'])","Object.freeze(['runV160SelfCheck','runV161SelfCheck','runV162SelfCheck','runV163SelfCheck','runV164SelfCheck'])")
          s=s.replace('retiredAdapters.length===4&&new Set(retiredAdapters).size===4','retiredAdapters.length===5&&new Set(retiredAdapters).size===5')
          s=s.replace('stable-semantic-runtime-loader','stable-physical-semantic-runtime-source')
          s=s.replace('7334c3b40e084fbf4e96bba94dd3297188fbae15d5739844208956ae3036c4d6','df1b9caab6cf990bb43e9199227a200bda6202442b06bce4c9cd1af6d9cb2645')
          s=s.replace('finalizeUtf8Bytes:1246','finalizeUtf8Bytes:1255').replace('s.finalizeUtf8Bytes===1246','s.finalizeUtf8Bytes===1255')
          s=s.replace('a.retiredAdapters===4','a.retiredAdapters===5')
          s=s.replace('&&s.materializedRuntimePartCount===9&&s.materializedRuntimeParts.length===9','')
          s=s.replace("&&s.materializedRuntimeParts.every(p=>!p.includes('-v159-'))",'')
          wp.write_text(s)
          req(len(wp.read_bytes())==18563 and sha(wp.read_bytes())=='e291730f6fe069d77b191ceafecc8bcadc124e48f08a8022230f72d30c71db49','wrapper identity mismatch')

          adapter="""// ===== FE QUEST v165 release adapter =====
          (() => {
            function runV165SelfCheck(){return feqRunSelfCheck('v165','runV165SelfCheck');}
            globalThis.runV165SelfCheck=runV165SelfCheck;
          })();
          """
          # Strip heredoc indentation while preserving the exact 190-byte source.
          adapter='\n'.join(line[10:] if line.startswith('          ') else line for line in adapter.splitlines())+'\n'
          ap=Path('app/v165-block-00.txt'); ap.write_text(adapter)
          req(len(ap.read_bytes())==190 and sha(ap.read_bytes())=='d8f242d01d0bcc6ed1f3fa95175b892d20561e95dd953990ecdb55c90f83f645','adapter identity mismatch')

          ip=Path('index.html'); x=ip.read_text()
          x=x.replace('v164block','v165block').replace('app/v164-block-00.txt','app/v165-block-00.txt')
          x=x.replace('FE QUEST PWA v164','FE QUEST PWA v165').replace("const APP_VERSION = 'v164';","const APP_VERSION = 'v165';").replace('runV164SelfCheck()','runV165SelfCheck()')
          ip.write_text(x)
          req(sha(ip.read_bytes())=='c229987e80f8d009b8762e4719b2f545af4874336645327b0f864e696a28a8bc','assembler identity mismatch')

          mp=Path('manifest.webmanifest'); m=json.loads(mp.read_text())
          m['name']='FE QUEST v165'
          m['description']='基本情報技術者試験向けPWA。v165では検証済み55,525 bytes / SHA-256 88db8212…be50のsemantic runtimeをapp/runtime-semantic-diagnostics.txtへ物理単一ソース化し、9分割stable backingをproduction sourceから除去。stable wrapper 6、stable helper 17、current-contract 71、科目A710問、Profile Schema v5、browser UI 23、critical curriculum 56、remaining release sentinel 28、CI coverage 84/84、legacy 293 residual 0を維持。'
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          req(sha(mp.read_bytes())=='ca9aa251c7f19a6981c49a2daa36056012913a7e85e13986f5e92ec30bae6202','manifest identity mismatch')

          sp=Path('sw.js'); sw=sp.read_text().replace("const APP_VERSION = 'v164';","const APP_VERSION = 'v165';").replace("const CACHE_NAME = 'fe-quest-v164-1';","const CACHE_NAME = 'fe-quest-v165-1';")
          sp.write_text(sw)
          req(len(sp.read_bytes())==2514 and sha(sp.read_bytes())=='8b57e82bcd45fcceef946f3ed73ff6c339d085c9885684d5918b06673d7221fe','service worker identity mismatch')

          fixture={
            'name':'physical-semantic-runtime-source-v165','version':'v165',
            'physical_runtime':{'path':'app/runtime-semantic-diagnostics.txt','sha256':expected_runtime_sha,'utf8_bytes':55525,'source_count':1,'liquid_include_count':0,'byte_exact_with_v164_rendered_runtime':True,'stable_runtime_path_policy':'single-physical-semantic-runtime-source','materialization_mode':'byte-exact-physical-semantic-runtime-source'},
            'retired_stable_loader':{'fixture':'_regression/single-semantic-runtime-loader-v163.fixture.json','loader_sha256':'6835c6489a035effebff9c026c948a195b147d2e5146ddc6154067641104aac1','loader_utf8_bytes':558,'backing_part_count':9,'production_paths_absent':True},
            'archival_versioned_runtime':{'parts':archived,'part_count':9,'concatenated_sha256':expected_runtime_sha,'concatenated_utf8_bytes':55525,'byte_exact_with_physical_runtime':True},
            'active_provenance':{'finalizer_path':'app/runtime-diagnostic-data-finalize.txt','finalizer_sha256':'df1b9caab6cf990bb43e9199227a200bda6202442b06bce4c9cd1af6d9cb2645','finalizer_utf8_bytes':1255,'sourceModule':'app/runtime-semantic-diagnostics.txt','projectionMode':'stable-physical-semantic-runtime-source'},
            'stable_wrapper':{'path':'app/runtime-diagnostic-wrapper.txt','sha256':'e291730f6fe069d77b191ceafecc8bcadc124e48f08a8022230f72d30c71db49','utf8_bytes':18563,'stable_global_count':6,'retired_v159_wrapper_global_count':6,'retired_release_adapters':['runV160SelfCheck','runV161SelfCheck','runV162SelfCheck','runV163SelfCheck','runV164SelfCheck']},
            'release_adapter':{'path':'app/v165-block-00.txt','allowed_versioned_global':'runV165SelfCheck','sha256':'d8f242d01d0bcc6ed1f3fa95175b892d20561e95dd953990ecdb55c90f83f645','utf8_bytes':190},
            'previous_provenance_fixture':'_regression/stable-semantic-provenance-v164.fixture.json','previous_runtime_fixture':'_regression/single-semantic-runtime-loader-v163.fixture.json','production_policy':'byte-exact-single-physical-semantic-runtime-source'
          }
          Path('_regression/physical-semantic-runtime-source-v165.fixture.json').write_text(json.dumps(fixture,ensure_ascii=False,indent=2)+'\n')
          req(all(not Path(f'app/runtime-semantic-diagnostics-{i:02d}.txt').exists() for i in range(9)),'split runtime backing remains')
          print('FEQUEST_V165_SOURCE_MATERIALIZED runtime=55525 sha256='+expected_runtime_sha+' split-backing=0')
          PY

      - name: Commit materialized source when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app index.html manifest.webmanifest sw.js _regression/physical-semantic-runtime-source-v165.fixture.json
          if git diff --cached --quiet; then
            echo "FEQUEST_V165_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST v165 semantic runtime"
            git push origin HEAD:v165-staging
          fi
          echo "FEQUEST_V165_VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate FE QUEST v165
        run: python3 tools/v165_validate.py

      - name: Package FE QUEST v165
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v165.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum FE_QUEST_PWA_v165.zip

      - name: Upload FE QUEST v165
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v165-standalone
          path: FE_QUEST_PWA_v165.zip
          if-no-files-found: error
