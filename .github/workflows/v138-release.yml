name: Release FE QUEST v138

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v138-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated v138 release payload
        run: |
          cat <<'PAYLOAD' | base64 -d | tar -xz
[... ELLIPSIZATION ...]
PAYLOAD

      - name: Assemble and validate standalone v138
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil
          base=Path('app/base-v131.html').read_text()
          counts={'v132':8,'v133':6,'v134':7,'v135':1,'v136':8,'v137':1,'v138':9}
          insertion=''.join(''.join(Path(f'app/{v}-block-{i:02d}.txt').read_text() for i in range(n)) for v,n in counts.items())
          s=base.replace('<title>FE QUEST PWA v131</title>','<title>FE QUEST PWA v138</title>',1)
          s=s.replace("const APP_VERSION = 'v131';","const APP_VERSION = 'v138';",1)
          s=s.replace("assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v131','v131 version/schema contract drift');","assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v138','v138 version/schema contract drift');",1)
          marker='const CORE_A_TOPIC_TOTAL_QUESTION_COUNTS=QUESTION_BANK.filter(q=>q.coreTopicId)'
          assert marker in s
          s=s.replace(marker,insertion+marker,1)
          assert "SUBJECT_A_V138_IDS.length===110" in s
          assert "qualityAudit:'v138-condition-specific-pass'" in s
          assert "generic condition mismatch remains" in s
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          assert manifest['name']=='FE QUEST v138'
          sw=Path('sw.js').read_text()
          assert "const APP_VERSION = 'v138';" in sw
          assert "const CACHE_NAME = 'fe-quest-v138-1';" in sw
          assert "const APP_VERSION = 'v138';" in s
          assert 'const PROFILE_SCHEMA_VERSION = 5;' in s
          out=Path('/tmp/FE_QUEST_PWA_v138'); out.mkdir(exist_ok=True)
          (out/'index.html').write_text(s)
          for f in ['manifest.webmanifest','sw.js','icon-192.png','icon-512.png','apple-touch-icon.png']:
              shutil.copy2(f,out/f)
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/app-v138.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app-v138.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          cd /tmp && zip -qr FE_QUEST_PWA_v138.zip FE_QUEST_PWA_v138

      - uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v138
          path: /tmp/FE_QUEST_PWA_v138.zip
          if-no-files-found: error

      - name: Commit v138 release and clean workflow
        run: |
          rm -f .github/workflows/v138-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release FE QUEST v138'
          git push
