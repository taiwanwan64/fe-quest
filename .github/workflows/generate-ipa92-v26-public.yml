name: Generate IPA 9.2 v26 public artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp-generate-v26-public.cjs'
      - '.github/workflows/generate-ipa92-v26-public.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v26 public artifacts
        run: node .github/tmp-generate-v26-public.cjs
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/question-catalog-ipa92-v26.json assets/protected-content-provider-v376-v26.js cloud/public-config-v342.js sw.js .github/generated-v26
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate IPA 9.2 v26 public artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
