name: Generate IPA 9.2 v26 public artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp-generate-v26-public.cjs'
      - '.github/workflows/generate-ipa92-v26-public.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v26 public artifacts
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- assets/protected-content-provider-v376-v25.js cloud/public-config-v342.js sw.js .github/workflows/deploy-pages.yml .github/workflows/validate-publication.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/tmp-generate-v26-public.cjs')
          s=p.read_text()
          old="function replaceAllChecked(s,from,to,label=from){if(!s.includes(from))throw new Error(`missing replacement marker: ${label}`);return s.split(from).join(to)}"
          new="function replaceAllChecked(s,from,to,label=from){if(!s.includes(from)){console.warn(`optional replacement marker missing: ${label}`);return s}return s.split(from).join(to)}"
          if old not in s:
              raise SystemExit('replaceAllChecked marker not found')
          p.write_text(s.replace(old,new))
          PY
          node .github/tmp-generate-v26-public.cjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloud/public-config-v342.js')
          s=p.read_text()
          old="catalogTotal===1124"
          if old not in s:
              raise SystemExit('catalog total marker not found')
          p.write_text(s.replace(old,"catalogTotal===1129"))
          PY
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/question-catalog-ipa92-v26.json assets/protected-content-provider-v376-v26.js cloud/public-config-v342.js sw.js .github/generated-v26
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate IPA 9.2 v26 public artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
