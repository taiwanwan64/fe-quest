name: Refresh sanitized v376 staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v376-staging.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download corrected validated publication artifact
        env:
          ARTIFACT_URL: https://api.github.com/repos/taiwanwan64/fe-quest/actions/artifacts/10288576290/zip
          EXPECTED_SHA256: 372a68e140a81668fdaf82e7f70287475d08b18c945f5e61aea7c0986c314bbb
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/fe-quest-v376-sanitized-publication.zip"
          if ! curl --fail --location --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$ARTIFACT_URL" -o "$ZIP"; then
            curl --fail --location --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$ARTIFACT_URL" -o "$ZIP"
          fi
          echo "$EXPECTED_SHA256  $ZIP" | sha256sum --check --strict
          unzip -tq "$ZIP"
      - name: Replace deploy files while preserving Pages automation
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/fe-quest-v376-sanitized-publication.zip"
          PUB="$RUNNER_TEMP/fe-quest-v376-publication"
          rm -rf "$PUB"
          mkdir -p "$PUB"
          unzip -q "$ZIP" -d "$PUB"
          test "$(find "$PUB" -type f | wc -l | tr -d ' ')" = '32'
          test -f "$PUB/index.html"
          test -f "$PUB/assets/app-v376.js"
          test -f "$PUB/sw.js"
          grep -Fq "const APP_VERSION = 'v376';" "$PUB/assets/app-v376.js"
          ! grep -Fq "const APP_VERSION = 'v375';" "$PUB/assets/app-v376.js"
          grep -Fq "const APP_VERSION = 'v376';" "$PUB/sw.js"
          test ! -e "$PUB/.github"
          test ! -e "$PUB/supabase"
          ! grep -RIl --exclude='*.png' -E 'fequest_lesson_bank_private|fequest_question_bank_private|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' "$PUB"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$PUB"/. .
          printf '%s\n' 'User-agent: *' 'Disallow: /' > robots.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: corrected sanitized FE QUEST v376 staging'
          git push origin HEAD:main
