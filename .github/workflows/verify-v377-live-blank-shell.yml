name: Verify v377 live blank-shell recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for expected production assets
        env:
          BASE_URL: https://taiwanwan64.github.io/fe-quest
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/sw.js?verify=$GITHUB_SHA-$attempt" -o /tmp/sw.js \
              && curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/assets/first-impression-ux-v377.js?verify=$GITHUB_SHA-$attempt" -o /tmp/ux.js \
              && grep -Fq "const CACHE_NAME = 'fe-quest-v377-5';" /tmp/sw.js \
              && grep -Fq "const VERSION='v377-first-impression-ux-5';" /tmp/ux.js \
              && grep -Fq "blankShellRecovery:'guarded-v2'" /tmp/ux.js; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          grep -Fq "const APP_VERSION = 'v377';" /tmp/sw.js
          grep -Fq "observerMode:'scoped-readiness'" /tmp/ux.js
          ! grep -Fq "fequest_question_bank_private" /tmp/ux.js
          ! grep -Fq "fequest_lesson_bank_private" /tmp/ux.js
          echo 'PASS live static markers: v377-5 cache + UX v5 + guarded-v2'

      - name: Install Chromium verifier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-verify"
          cd "$RUNNER_TEMP/live-verify"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Reproduce and recover the live PC header-only shell
        env:
          BASE_URL: https://taiwanwan64.github.io/fe-quest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live-verify"
          cat > verify.cjs <<'NODE'
          const {chromium}=require('playwright');
          function assert(ok,message){if(!ok)throw new Error(message)}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:900},locale:'ja-JP'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error?.stack||error)));
            try{
              const base=process.env.BASE_URL;
              await page.goto(`${base}/?v377-live-verify=${Date.now()}`,{waitUntil:'load',timeout:60000});
              await page.waitForFunction(()=>globalThis.FEQUEST_FIRST_IMPRESSION_UX_V377?.version==='v377-first-impression-ux-5',{timeout:30000});
              await page.evaluate(async()=>{if(navigator.serviceWorker)await navigator.serviceWorker.ready;});
              await page.reload({waitUntil:'load',timeout:60000});
              await page.waitForFunction(()=>globalThis.FEQUEST_FIRST_IMPRESSION_UX_V377?.version==='v377-first-impression-ux-5',{timeout:30000});

              const cachesNow=await page.evaluate(()=>caches.keys());
              assert(cachesNow.includes('fe-quest-v377-5'),`v377-5 cache not active: ${cachesNow.join(',')}`);
              assert((await page.evaluate(()=>globalThis.FEQUEST_FIRST_IMPRESSION_UX_V377?.blankShellRecovery))==='guarded-v2','guarded-v2 marker missing');

              const forced=await page.evaluate(()=>{
                document.getElementById('firstRunGuidedV364')?.remove();
                document.getElementById('fequestV376AccessDialog')?.remove();
                for(const screen of document.querySelectorAll('.screen.active'))screen.classList.remove('active');
                document.getElementById('home')?.classList.add('active');
                document.body.classList.add('fequest-first-run-v364');
                const home=document.getElementById('home');
                const visibleChildren=home?[...home.children].filter(element=>{
                  const style=getComputedStyle(element);
                  const rect=element.getBoundingClientRect();
                  return style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)!==0&&rect.width>0&&rect.height>0;
                }).length:-1;
                return {visibleChildren,healthy:globalThis.FEQUEST_FIRST_IMPRESSION_UX_V377.routeHealthy()};
              });
              assert(forced.visibleChildren===0,`forced shell was not header-only: visible home children=${forced.visibleChildren}`);
              assert(forced.healthy===false,'forced header-only shell incorrectly reported healthy');

              const recovered=await page.evaluate(()=>globalThis.FEQUEST_FIRST_IMPRESSION_UX_V377.recoverNow());
              assert(recovered===true,'live recovery did not produce a healthy route');
              await page.waitForFunction(()=>globalThis.FEQUEST_FIRST_IMPRESSION_UX_V377.routeHealthy()===true,{timeout:10000});
              const marker=await page.evaluate(()=>document.documentElement.dataset.v377BlankShellRecovery||'');
              assert(['onboarding-restored','existing-home','home-fallback','home-restored'].includes(marker),`unexpected recovery marker: ${marker}`);
              const painted=await page.evaluate(()=>{
                const guided=document.getElementById('firstRunGuidedV364');
                const active=[...document.querySelectorAll('.screen.active')];
                const roots=[guided,...active].filter(Boolean);
                return roots.some(root=>{
                  const style=getComputedStyle(root);const rect=root.getBoundingClientRect();
                  return style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)!==0&&rect.width>0&&rect.height>0&&root.textContent.trim().length>0;
                });
              });
              assert(painted,'recovered route has no paintable content');
              assert(errors.length===0,`page errors: ${errors.join(' | ')}`);
              console.log(`PASS live browser: forced header-only shell recovered with marker=${marker}, cache=fe-quest-v377-5`);
            }finally{
              await context.close();
              await browser.close();
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node verify.cjs
