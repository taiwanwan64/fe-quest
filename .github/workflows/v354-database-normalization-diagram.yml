name: FE QUEST v354 database normalization diagram

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v354/**'
      - '.github/workflows/v354-database-normalization-diagram.yml'
      - '.github/workflows/v354-materialize-database-normalization-diagram.yml'
      - 'audits/V354_DATABASE_NORMALIZATION_DIAGRAM.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v354.html'
      - 'app/database-normalization-diagram-v354.js'
      - 'app/database-normalization-diagram-v354.css'
      - 'assets/app-v354.css'
      - 'assets/app-v354.js'
      - 'assets/asset-manifest-v354.json'

permissions:
  contents: read

jobs:
  validate-v354-database-normalization-diagram:
    if: startsWith(github.head_ref, 'v354-database-normalization-diagram')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v354/.*|\.github/workflows/v354-database-normalization-diagram\.yml|\.github/workflows/v354-materialize-database-normalization-diagram\.yml|audits/V354_DATABASE_NORMALIZATION_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v354\.html|app/database-normalization-diagram-v354\.js|app/database-normalization-diagram-v354\.css|assets/app-v354\.css|assets/app-v354\.js|assets/asset-manifest-v354\.json)$' | grep -q .; then
            echo 'Unexpected file in the v354 database normalization diagram release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v353.html assets/app-v353.css assets/app-v353.js assets/asset-manifest-v353.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v354/validate_database_normalization_diagram.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive database diagram
        run: python .github/v354/browser_database_normalization_diagram.py
      - name: Upload database diagram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v354-database-normalization-diagram-evidence
          path: _browser_evidence/v354/
          if-no-files-found: warn
          retention-days: 14
