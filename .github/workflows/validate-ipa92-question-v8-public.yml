name: Validate IPA 9.2 question v8 public activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v8-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication candidate
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v8.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v8 public-safe catalog
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v8.json','utf8'));
          const expectedIds=[
            'ipa92_a_sli_slo_001','ipa92_a_sli_slo_002','ipa92_a_service_request_001','ipa92_a_known_error_001',
            'ipa92_a_cloud_model_001','ipa92_a_cloud_model_002','ipa92_a_cloud_deploy_001','ipa92_a_cloud_deploy_002',
            'ipa92_a_ai_xai_001','ipa92_a_ai_hitl_001','ipa92_a_ai_hallucination_001','ipa92_a_ai_hallucination_002',
            'ipa92_a_privacy_anon_001','ipa92_a_privacy_pseudo_001','ipa92_a_sme_fairtrade_001','ipa92_a_sme_fairtrade_002'
          ];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v8'||catalog.contentVersion!=='ipa92-questions-v8')throw new Error('v8 catalog version mismatch');
          if(JSON.stringify(catalog.contentVersions)!==JSON.stringify(['ipa92-questions-v8']))throw new Error('v8 contentVersions mismatch');
          if(catalog.counts?.subjectA!==16||catalog.counts?.catalogQuestions!==16)throw new Error('v8 counts mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==16)throw new Error('v8 item count mismatch');
          const ids=catalog.items.map(item=>item.id);
          if(JSON.stringify(ids)!==JSON.stringify(expectedIds))throw new Error('v8 IDs/order mismatch');
          if(new Set(ids).size!==16)throw new Error('v8 duplicate IDs');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v8')throw new Error(`v8 metadata contract mismatch: ${item.id}`);
            if(typeof item.cat!=='string'||typeof item.concept!=='string'||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||'')))throw new Error(`v8 unsafe/incomplete metadata: ${item.id}`);
            const leaked=Object.keys(item).find(key=>protectedKeys.has(key));
            if(leaked)throw new Error(`protected field leaked: ${item.id}:${leaked}`);
          }
          console.log('PASS v8 safe catalog: 16 items');
          NODE
      - name: Validate protected provider merges to 1019
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));
          const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));
          const v7=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v7.json','utf8'));
          const v8=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v8.json','utf8'));
          const source=fs.readFileSync('assets/protected-content-provider-v376-v8.js','utf8');
          const context={
            console,setTimeout,clearTimeout,URL,AbortController,
            document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v8.js'},baseURI:'https://example.test/'},
            sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},
            fetch:async url=>{
              const s=String(url);
              const data=s.endsWith('question-catalog-ipa92-v8.json')?v8:s.endsWith('question-catalog-ipa92-v7.json')?v7:s.endsWith('question-catalog-ipa92-v1-v6.json')?legacy:base;
              return {ok:true,status:200,json:async()=>data};
            },
            window:{}
          };
          vm.createContext(context);
          vm.runInContext(source,context,{filename:'assets/protected-content-provider-v376-v8.js'});
          (async()=>{
            const api=context.window.FEQUEST_PROTECTED_CONTENT;
            if(api?.version!=='v376-provider-5-ipa92-v1-v8'||api.catalogTotal!==1019)throw new Error('v8 provider contract mismatch');
            const merged=await api.loadCatalog();
            if(merged.items.length!==1019)throw new Error(`merged total mismatch: ${merged.items.length}`);
            if(merged.counts?.subjectA!==825)throw new Error(`merged subjectA mismatch: ${merged.counts?.subjectA}`);
            if(merged.counts?.trackedSubjectA!==834)throw new Error(`merged trackedSubjectA mismatch: ${merged.counts?.trackedSubjectA}`);
            if(merged.counts?.catalogQuestions!==1019)throw new Error(`merged catalogQuestions mismatch: ${merged.counts?.catalogQuestions}`);
            const expectedVersions=['ipa92-questions-v1','ipa92-questions-v2','ipa92-questions-v3','ipa92-questions-v4','ipa92-questions-v5','ipa92-questions-v6','ipa92-questions-v7','ipa92-questions-v8'];
            if(JSON.stringify(merged.extensionContentVersions)!==JSON.stringify(expectedVersions))throw new Error('merged content versions mismatch');
            const ids=merged.items.map(item=>item.id);
            if(new Set(ids).size!==1019)throw new Error('merged duplicate IDs');
            for(const item of v8.items)if(!ids.includes(item.id))throw new Error(`merged catalog missing ${item.id}`);
            console.log('PASS protected provider merged catalog: 1019');
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Validate v8 runtime metadata activation
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const source=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const legacyItems=Array.from({length:83},(_,i)=>({id:`legacy_${i}`}));
          const listeners={};
          const script={
            id:'',src:'',async:true,
            addEventListener(type,fn){listeners[type]=fn;}
          };
          const document={
            baseURI:'https://example.test/',
            getElementById(){return null;},
            createElement(tag){if(tag!=='script')throw new Error('unexpected element');return script;},
            head:{appendChild(node){
              if(node!==script||node.src!=='./assets/protected-content-provider-v376-v8.js')throw new Error(`unexpected v8 provider src: ${node.src}`);
              context.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-5-ipa92-v1-v8',catalogTotal:1019};
              listeners.load();
            }}
          };
          const context={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-3-ipa92-v1-v6',catalogTotal:987}};
          vm.createContext(context);
          vm.runInContext(`const QUESTION_BANK=${JSON.stringify(legacyItems)};\n${source}\nglobalThis.__BANK__=QUESTION_BANK;`,context,{filename:'cloud/public-config-v342.js'});
          (async()=>{
            const ready=await context.FEQUEST_IPA92_V8_PROVIDER_READY;
            if(!ready?.ok)throw new Error(`v8 provider activation failed: ${JSON.stringify(ready)}`);
            if(context.FEQUEST_IPA92_V7_PROVIDER_READY!==context.FEQUEST_IPA92_V8_PROVIDER_READY)throw new Error('v7 readiness alias does not point at latest provider');
            const bank=context.__BANK__;
            if(bank.length!==115)throw new Error(`runtime metadata total mismatch: ${bank.length}`);
            const v7=context.FEQUEST_IPA92_V7_SUBJECT_A_METADATA;
            const v8=context.FEQUEST_IPA92_V8_SUBJECT_A_METADATA;
            if(!Array.isArray(v7)||v7.length!==16)throw new Error('runtime v7 metadata mismatch');
            if(!Array.isArray(v8)||v8.length!==16)throw new Error('runtime v8 metadata mismatch');
            if(context.FEQUEST_IPA92_V7_SUBJECT_A_METADATA_INSTALL?.ok!==true)throw new Error('runtime v7 installer failed');
            if(context.FEQUEST_IPA92_V8_SUBJECT_A_METADATA_INSTALL?.ok!==true)throw new Error('runtime v8 installer failed');
            for(const item of [...v7,...v8])if(!bank.some(q=>q.id===item.id))throw new Error(`runtime missing ${item.id}`);
            console.log('PASS v8 runtime metadata activation: legacy=83 v7=16 v8=16 total=115');
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Validate service-worker publication assets
        run: |
          grep -Fq '"./assets/protected-content-provider-v376-v8.js"' sw.js
          grep -Fq '"./assets/question-catalog-ipa92-v8.json"' sw.js
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-12';" sw.js
          test -f assets/protected-content-provider-v376-v8.js
          test -f assets/question-catalog-ipa92-v8.json
      - name: Validate verified import checkpoint
        run: |
          grep -Fq 'active protected question total after import: **1019**' .github/IPA92_V8_ACTIVATION_2026-09-13.md
          grep -Fq 'ce0f81e539663b4ed8acb062aef10f1da2953dca' .github/IPA92_V8_ACTIVATION_2026-09-13.md
          grep -Fq '80d6b08ea1be1f1b347656e3124614c7cd7badefe2a175cfd897a7596a6e9009' .github/IPA92_V8_ACTIVATION_2026-09-13.md
