name: FE QUEST v355 crypto signature key comparison

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v355/**'
      - '.github/workflows/v355-crypto-signature-key-comparison.yml'
      - '.github/workflows/v355-materialize-crypto-signature-key-comparison.yml'
      - 'audits/V355_CRYPTO_SIGNATURE_KEY_COMPARISON.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v355.html'
      - 'app/crypto-signature-key-comparison-v355.js'
      - 'app/crypto-signature-key-comparison-v355.css'
      - 'assets/app-v355.css'
      - 'assets/app-v355.js'
      - 'assets/asset-manifest-v355.json'

permissions:
  contents: read

jobs:
  validate-v355-crypto-signature-key-comparison:
    if: startsWith(github.head_ref, 'v355-crypto-signature-key-comparison')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v355/.*|\.github/workflows/v355-crypto-signature-key-comparison\.yml|\.github/workflows/v355-materialize-crypto-signature-key-comparison\.yml|audits/V355_CRYPTO_SIGNATURE_KEY_COMPARISON\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v355\.html|app/crypto-signature-key-comparison-v355\.js|app/crypto-signature-key-comparison-v355\.css|assets/app-v355\.css|assets/app-v355\.js|assets/asset-manifest-v355\.json)$' | grep -q .; then
            echo 'Unexpected file in the v355 crypto/signature key comparison release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v354.html assets/app-v354.css assets/app-v354.js assets/asset-manifest-v354.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v355/validate_crypto_signature_key_comparison.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive key comparison
        run: python .github/v355/browser_crypto_signature_key_comparison.py
      - name: Upload key comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v355-crypto-signature-key-comparison-evidence
          path: _browser_evidence/v355/
          if-no-files-found: warn
          retention-days: 14
