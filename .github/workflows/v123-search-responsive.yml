name: FE QUEST v123 search responsive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v123-search-responsive.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v123 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit('missing target: ' + label)
              s = s.replace(old, new, 1)

          replace_once('<title>FE QUEST PWA v122</title>', '<title>FE QUEST PWA v123</title>', 'title')
          replace_once("const APP_VERSION = 'v122';", "const APP_VERSION = 'v123';", 'app version')
          replace_once("assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v122','v122 version/schema contract drift');", "assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v123','v123 version/schema contract drift');", 'version assertion')

          old_search = '.core-course-search{flex:1;min-height:48px;border:1px solid #dce4e9;border-radius:14px;padding:10px 14px;font-size:14px;background:#fff;color:var(--text)}'
          new_search = '.core-course-search{flex:1;width:100%;max-width:100%;min-width:0;box-sizing:border-box;min-height:48px;border:1px solid #dce4e9;border-radius:14px;padding:10px 14px;font-size:15px;background:#fff;color:var(--text)}'
          replace_once(old_search, new_search, 'core search css')

          old_mobile = '@media(max-width:660px){.core-course-tools{display:block}.core-course-stats{margin-top:8px}.core-chapter-head{grid-template-columns:48px 1fr}.core-chapter-progress{grid-column:2;text-align:left}.core-topic-row{grid-template-columns:58px 1fr}.core-topic-pct{grid-column:2;text-align:left}.core-text-title{font-size:20px}}'
          new_mobile = '@media(max-width:660px){.core-course-tools{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;width:100%}.core-course-search{width:100%;font-size:16px}.core-course-stats{margin-top:0;padding-left:2px}.core-chapter-head{grid-template-columns:48px 1fr}.core-chapter-progress{grid-column:2;text-align:left}.core-topic-row{grid-template-columns:58px 1fr}.core-topic-pct{grid-column:2;text-align:left}.core-text-title{font-size:20px}}'
          replace_once(old_mobile, new_mobile, 'core mobile layout')

          old_input = 'placeholder="用語・テーマを検索（例：正規化、DNS、EVM）">'
          new_input = 'placeholder="用語・テーマを検索" aria-label="科目Aの用語・テーマを検索" autocomplete="off">'
          replace_once(old_input, new_input, 'search placeholder')

          p.write_text(s, encoding='utf-8')

          m = Path('manifest.webmanifest')
          manifest = json.loads(m.read_text(encoding='utf-8'))
          if manifest.get('name') != 'FE QUEST v122':
              raise SystemExit('unexpected manifest version: ' + str(manifest.get('name')))
          manifest['name'] = 'FE QUEST v123'
          manifest['description'] = '基本情報技術者試験向けPWA。v123では科目Aコアコースの検索欄をスマホで横幅いっぱいにし、プレースホルダーを短くして見切れを解消。iPhoneでは16px入力文字を使用し、教材完了数を検索欄の下に分離して小画面でも安定する配置へ調整。v122までのヒント自動高、章の初期折りたたみ、教材文体統一、問題集中UIを維持。'
          m.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          if "const APP_VERSION = 'v122';" not in sws or "const CACHE_NAME = 'fe-quest-v122-1';" not in sws:
              raise SystemExit('service worker v122 target missing')
          sws = sws.replace("const APP_VERSION = 'v122';", "const APP_VERSION = 'v123';", 1)
          sws = sws.replace("const CACHE_NAME = 'fe-quest-v122-1';", "const CACHE_NAME = 'fe-quest-v123-1';", 1)
          sw.write_text(sws, encoding='utf-8')

          Path('audits').mkdir(exist_ok=True)
          Path('audits/CORE_A_SEARCH_RESPONSIVE_AUDIT_v123.txt').write_text('''FE QUEST v123 — 科目A検索欄レスポンシブ監査

対象
- スマートフォンの科目Aコアコースで検索欄が狭く、プレースホルダー「用語・テーマを検索（例：正規化、DNS、EVM）」が途中で見切れる。
- 検索欄と「教材完了」件数が同一行の幅を取り合い、小画面で入力欄の有効幅が不足する。

修正
1. 検索入力を width:100%、max-width:100%、min-width:0、box-sizing:border-box とし、利用可能幅を安定して使う。
2. 660px以下では検索ツール行を1列グリッド化し、検索欄を上、教材完了数を下に配置する。
3. iPhoneの入力文字は16pxにし、フォーカス時のSafari自動ズームを避ける。
4. プレースホルダーは「用語・テーマを検索」に短縮し、詳しい意味は aria-label に保持する。
5. 章一覧、教材内容、問題、正解キー、Profile Schema v5は変更しない。

検証
- APP_VERSION v123
- MAIN_JS_SYNTAX_OK
- SW_SYNTAX_OK
- MANIFEST_JSON_OK
- CORE_A_SEARCH_FULL_WIDTH_OK
- MOBILE_ONE_COLUMN_SEARCH_TOOLS_OK
- IOS_INPUT_16PX_OK
- COMPACT_PLACEHOLDER_OK
''', encoding='utf-8')
          PY

      - name: Verify v123
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          s = Path('index.html').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v123';" in s
          assert "APP_VERSION==='v123'" in s
          assert 'placeholder="用語・テーマを検索" aria-label="科目Aの用語・テーマを検索" autocomplete="off"' in s
          assert '.core-course-search{flex:1;width:100%;max-width:100%;min-width:0;box-sizing:border-box;' in s
          assert '.core-course-tools{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;width:100%}' in s
          assert '.core-course-search{width:100%;font-size:16px}' in s
          assert json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))['name'] == 'FE QUEST v123'
          assert Path('audits/CORE_A_SEARCH_RESPONSIVE_AUDIT_v123.txt').exists()
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', s)
          Path('/tmp/feq-v123-main.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/feq-v123-main.js
          node --check sw.js

      - name: Commit v123 release
        shell: bash
        run: |
          rm -f .github/workflows/v123-search-responsive.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release FE QUEST v123 responsive core search'
          git push
