name: Validate FE QUEST v148

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v148-validate.yml'

permissions:
  contents: read
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v148.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v148' index.html
          grep -q "APP_VERSION = 'v148'" sw.js
          grep -q "CACHE_NAME = 'fe-quest-v148-1'" sw.js
          grep -q 'FE QUEST v148' manifest.webmanifest
          grep -q '{% capture v148block %}' index.html
          grep -q 'runV148SelfCheck()' index.html
          grep -q 'v148 question-cue / functional-UX / browser-contract migration' app/v148-block-00.txt
          grep -q "architecture:'v148-quality-ux-current-contract'" app/v148-block-00.txt
          grep -q 'V148_EXTRA_UI_CONTRACTS' app/v148-block-00.txt
          cp app/v148-block-00.txt /tmp/v148-check.js
          node --check /tmp/v148-check.js
          python -m py_compile tools/v148_validate.py

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA, DOM contracts and runtime
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v148</title>' _site/index.html
          grep -q "const APP_VERSION = 'v148';" _site/index.html
          grep -q 'runV148SelfCheck' _site/index.html
          grep -q "APP_VERSION = 'v148'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v148-1'" _site/sw.js
          python -m json.tool _site/manifest.webmanifest >/dev/null
          python tools/v148_validate.py
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v148.zip .)

      - name: Upload standalone v148 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v148
          path: FE_QUEST_PWA_v148.zip
          retention-days: 90
