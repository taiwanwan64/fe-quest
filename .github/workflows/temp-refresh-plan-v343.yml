name: FE QUEST one-shot v343 plan refresh

on:
  push:
    branches: ['v343-plan-refresh']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v343-plan-refresh
          fetch-depth: 0
      - name: Refresh source-of-truth plan
        run: python3 .github/temp_refresh_plan_v343.py
      - name: Verify current release before documenting
        shell: bash
        run: |
          grep -F '{% include_relative app/base-shell-v343.html %}' index.html
          grep -F "const APP_VERSION = 'v343';" sw.js
          grep -F '現行アプリ: **v343**' FE_QUEST_DEVELOPMENT_PLAN.md
          grep -F '次の計画バージョン: **v344**' FE_QUEST_DEVELOPMENT_PLAN.md
      - name: Commit only the refreshed plan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/temp_refresh_plan_v343.py .github/workflows/temp-refresh-plan-v343.yml
          git add FE_QUEST_DEVELOPMENT_PLAN.md .github/temp_refresh_plan_v343.py .github/workflows/temp-refresh-plan-v343.yml
          git commit -m 'Refresh FE QUEST development plan for v343'
          git push origin HEAD:v343-plan-refresh
