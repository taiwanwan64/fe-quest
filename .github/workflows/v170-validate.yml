name: FE QUEST v170 learning compaction validation

on:
  push:
    branches: [v170-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v170-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v170 learning bundle
        run: python3 tools/v170_materialize.py

      - name: Preserve expanded assembler output whitespace
        run: python3 tools/v170_preserve_liquid_whitespace.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build compact production assembler
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Prepare expanded reference source
        run: python3 tools/v170_prepare_reference.py

      - name: Build expanded 47-include reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_v170_reference_src
          destination: ./_site_reference

      - name: Diagnose generated HTML delta
        run: python3 tools/v170_diff_debug.py

      - name: Validate FE QUEST v170 compaction equivalence
        run: python3 tools/v170_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V170_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST v170 byte-exact learning bundle"
            git push origin HEAD:v170-staging
          fi
          echo "FEQUEST_V170_VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Package FE QUEST v170
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v170.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum FE_QUEST_PWA_v170.zip

      - name: Upload FE QUEST v170
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v170-standalone
          path: FE_QUEST_PWA_v170.zip
          if-no-files-found: error
          retention-days: 90
