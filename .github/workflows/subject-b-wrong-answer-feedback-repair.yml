name: FE QUEST Subject B wrong-answer feedback repair

on:
  push:
    branches: ['subject-b-wrong-answer-feedback-repair-v*']

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve wrong-answer feedback repair target
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^subject-b-wrong-answer-feedback-repair-(v[0-9]+)$ ]]; then
            echo "Invalid Subject B wrong-answer feedback repair branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          NUMBER="${VERSION#v}"
          PREVIOUS="v$((NUMBER-1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "FEQUEST_SUBJECT_B_WRONG_ANSWER_FEEDBACK_REPAIR_TARGET version=$VERSION previous=$PREVIOUS"

      - name: Materialize conventional release shell
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build repair candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare approved content and parent references
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-content-staging" python3 .github/content-release/prepare_reference.py

      - name: Build approved content reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Build untouched parent reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent_reference
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate standard release invariants
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_validate.py

      - name: Validate Subject B wrong-answer feedback repair
        run: python3 .github/subject-b-wrong-answer-feedback-repair/validate_repair.py

      - name: Commit validated release shell and repair evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_SUBJECT_B_WRONG_ANSWER_FEEDBACK_REPAIR_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST ${{ steps.release.outputs.version }} Subject B wrong-answer feedback repair"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "FEQUEST_SUBJECT_B_WRONG_ANSWER_FEEDBACK_REPAIR_HEAD=$(git rev-parse HEAD)"

      - name: Package release
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          cd _site
          zip "../FE_QUEST_PWA_${VERSION}.zip" index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum "FE_QUEST_PWA_${VERSION}.zip"

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-${{ steps.release.outputs.version }}-standalone
          path: FE_QUEST_PWA_${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90
