name: FE QUEST v158 release validation

on:
  push:
    branches: [v158-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate FE QUEST v158
        run: python3 tools/v158_validate.py
      - name: Package FE QUEST v158
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v158.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
      - name: Upload FE QUEST v158
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v158-standalone
          path: FE_QUEST_PWA_v158.zip
          if-no-files-found: error
