name: FE QUEST v342 Safari first-run date

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/release/split_release_common.py'
      - '.github/release/release_validate_split.py'
      - 'v342-preview.html'
      - 'cloud/sync-ui-v342.css'
      - 'assets/asset-manifest-v342.json'
      - '.github/cloud-sync-v342/validate_safari_first_run.py'
      - '.github/workflows/v342-safari-first-run.yml'

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'v342-safari-date-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Safari first-run date sizing
        run: python3 .github/cloud-sync-v342/validate_safari_first_run.py
      - name: Syntax-check split release validator
        run: python3 -m py_compile .github/release/release_validate_split.py
