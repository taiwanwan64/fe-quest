name: FE QUEST v342 Safari first-run date

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/release/split_release_common.py'
      - 'v342-preview.html'
      - '.github/cloud-sync-v342/validate_safari_first_run.py'
      - '.github/workflows/v342-safari-first-run.yml'

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'v342-safari-date-fix')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Safari first-run date sizing
        run: python3 .github/cloud-sync-v342/validate_safari_first_run.py
