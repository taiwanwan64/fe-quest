name: FE QUEST v344 recent learning report

on:
  pull_request:
    branches: ['main']
    paths:
      - 'app/learning-outcomes-v344.js'
      - '.github/v344/validate_recent_learning_report.py'
      - '.github/release/split_release_common.py'
      - '.github/release/release_validate_split.py'
      - '.github/release/release_materialize_split.py'
      - '.github/release/runtime_stub.py'
      - '.github/workflows/v344-recent-learning-report.yml'
      - '_regression/v344-recent-learning-report.fixture.json'
      - 'audits/V344_RECENT_LEARNING_REPORT.md'
      - 'app/base-shell-v343.html'
      - 'assets/app-v343.css'
      - 'assets/app-v343.js'
      - 'assets/asset-manifest-v343.json'
      - 'cloud/**'
      - 'vendor/supabase/supabase-2.112.3.js'

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'v344-recent-learning-report')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Check feature source syntax
        run: node --check app/learning-outcomes-v344.js
      - name: Check generated v344 syntax directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,tempfile,sys
          sys.path.insert(0,str(Path('.github/release').resolve()))
          from split_release_common import materialize_tree
          root=Path('/tmp/v344-syntax-tree')
          if root.exists():shutil.rmtree(root)
          root.mkdir()
          for rel in ['index.html','manifest.webmanifest','sw.js']:shutil.copy2(rel,root/rel)
          for d in ['app','assets','cloud','vendor']:shutil.copytree(d,root/d)
          p=materialize_tree(root,'v344','v343')['files']
          Path('/tmp/v344-generated.js').write_text(p['js'].read_text())
          print('generated bytes',len(p['js'].read_bytes()))
          PY
          node --check /tmp/v344-generated.js
      - name: Validate v344 bounded learning report
        run: python3 .github/v344/validate_recent_learning_report.py
      - name: Syntax check generic release validators
        run: python3 -m py_compile .github/release/split_release_common.py .github/release/release_validate_split.py .github/release/release_materialize_split.py
      - name: Verify production v343 is byte-untouched
        shell: bash
        run: |
          grep -F '{% include_relative app/base-shell-v343.html %}' index.html
          grep -F "const APP_VERSION = 'v343';" sw.js
          git diff --exit-code origin/main...HEAD -- index.html sw.js app/base-shell-v343.html assets/app-v343.css assets/app-v343.js assets/asset-manifest-v343.json cloud vendor/supabase/supabase-2.112.3.js
