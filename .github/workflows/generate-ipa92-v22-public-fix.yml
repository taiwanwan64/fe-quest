name: Generate IPA 9.2 v22 public activation fix

on:
  push:
    branches: [ipa92-v22-public-activation-20260914]
    paths:
      - '.github/workflows/generate-ipa92-v22-public-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ipa92-v22-public-activation-20260914
      - name: Run corrected v22 generator
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('.github/workflows/generate-ipa92-v22-public.yml','utf8');
          const start=source.indexOf("          node <<'NODE'\n");
          const end=source.indexOf('\n          NODE\n',start);
          if(start<0||end<0)throw new Error('generator block not found');
          let script=source.slice(start+"          node <<'NODE'\n".length,end).split('\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\n');
          const skipLabels=['publication sw provider','publication sw catalog','publication provider marker','deploy sw provider','deploy sw catalog','deploy provider marker'];
          script=script.split('\n').filter(line=>!skipLabels.some(label=>line.includes("'"+label+"'"))).join('\n');
          new Function('require','process','console',script)(require,process,console);
          NODE
      - name: Commit generated non-workflow and staged workflow files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/question-catalog-ipa92-v22.json assets/protected-content-provider-v376-v22.js cloud/public-config-v342.js sw.js .github/IPA92_V22_ACTIVATION_2026-09-14.md .github/generated/
          git commit -m 'Generate IPA 9.2 v22 public activation assets'
          git push origin HEAD:ipa92-v22-public-activation-20260914
