name: Validate FE QUEST v146

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v146-validate.yml'

permissions:
  contents: read
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v146.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v146' index.html
          grep -q "APP_VERSION = 'v146'" sw.js
          grep -q "CACHE_NAME = 'fe-quest-v146-1'" sw.js
          grep -q 'FE QUEST v146' manifest.webmanifest
          grep -q '{% capture v146block %}' index.html
          grep -q 'runV146SelfCheck()' index.html
          grep -q 'v146 current-contract expansion' app/v146-block-00.txt
          grep -q "architecture:'v146-expanded-current-contract'" app/v146-block-00.txt
          grep -q 'migratedLegacyAssertionEquivalents' app/v146-block-00.txt
          cp app/v146-block-00.txt /tmp/v146-check.js
          node --check /tmp/v146-check.js
          python -m py_compile tools/v146_validate.py

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA, DOM contracts and runtime
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v146</title>' _site/index.html
          grep -q "const APP_VERSION = 'v146';" _site/index.html
          grep -q 'runV146SelfCheck' _site/index.html
          grep -q "APP_VERSION = 'v146'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v146-1'" _site/sw.js
          python -m json.tool _site/manifest.webmanifest >/dev/null
          python tools/v146_validate.py
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v146.zip .)

      - name: Upload standalone v146 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v146
          path: FE_QUEST_PWA_v146.zip
          retention-days: 90
