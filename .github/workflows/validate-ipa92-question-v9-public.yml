name: Validate IPA 9.2 question v9 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v9.js'
      - 'assets/question-catalog-ipa92-v9.json'
      - '.github/IPA92_V9_ACTIVATION_2026-09-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v9-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate historical v9 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v9.js
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v9.json','utf8'));
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v9'||catalog.contentVersion!=='ipa92-questions-v9')throw new Error('v9 catalog version mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==12)throw new Error('v9 catalog count mismatch');
          if(new Set(catalog.items.map(x=>x.id)).size!==12)throw new Error('v9 duplicate IDs');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v9')throw new Error(`v9 metadata contract mismatch: ${item.id}`);
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error(`protected field leaked: ${item.id}`);
          }
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v9.js','utf8');
          if(!provider.includes("version:'v376-provider-6-ipa92-v1-v9'"))throw new Error('v9 provider version mismatch');
          console.log('PASS historical v9 public artifacts');
          NODE
          grep -Fq 'active protected question total after import: **1031**' .github/IPA92_V9_ACTIVATION_2026-09-13.md
