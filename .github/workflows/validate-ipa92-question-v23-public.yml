name: Validate IPA 9.2 question v23 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v23.js'
      - 'assets/question-catalog-ipa92-v23.json'
      - '.github/IPA92_V23_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v23-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v23-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v23 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v23.js
          node -e "const c=require('./assets/question-catalog-ipa92-v23.json');if(c.version!=='ipa92-catalog-v23'||c.contentVersion!=='ipa92-questions-v23'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-20-ipa92-v1-v23'" assets/protected-content-provider-v376-v23.js
          grep -Fq 'active protected question total after import: **1114**' .github/IPA92_V23_ACTIVATION_2026-09-14.md
