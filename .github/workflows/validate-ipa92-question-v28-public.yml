name: Validate IPA 9.2 question v28 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v28.js'
      - 'assets/question-catalog-ipa92-v28.json'
      - '.github/IPA92_V28_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v28-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v28-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v28 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v28.js
          node -e "const c=require('./assets/question-catalog-ipa92-v28.json');if(c.version!=='ipa92-catalog-v28'||c.contentVersion!=='ipa92-questions-v28'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-25-ipa92-v1-v28'" assets/protected-content-provider-v376-v28.js
          grep -Fq 'active protected question total after import: **1139**' .github/IPA92_V28_ACTIVATION_2026-09-15.md
