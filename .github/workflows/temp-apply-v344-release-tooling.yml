name: FE QUEST one-shot v344 release tooling transform

on:
  push:
    branches: ['v344-recent-learning-report']
    paths:
      - '.github/temp_apply_v344_release_tooling.py'
      - '.github/workflows/temp-apply-v344-release-tooling.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v344-recent-learning-report
          fetch-depth: 0
      - name: Apply v344 release transforms
        run: python3 .github/temp_apply_v344_release_tooling.py
      - name: Syntax check release tooling
        run: python3 -m py_compile .github/release/split_release_common.py .github/release/release_validate_split.py .github/release/release_materialize_split.py
      - name: Commit intended tooling changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/temp_apply_v344_release_tooling.py .github/workflows/temp-apply-v344-release-tooling.yml
          git add .github/release/split_release_common.py .github/release/release_validate_split.py .github/release/release_materialize_split.py .github/temp_apply_v344_release_tooling.py .github/workflows/temp-apply-v344-release-tooling.yml
          git commit -m 'Support v344 bounded learning outcome release transform'
          git push origin HEAD:v344-recent-learning-report
