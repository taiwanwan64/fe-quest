name: FE QUEST v340 first-run experience

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/first-run-experience-v340.yml'
      - '.github/release/split_release_common.py'
      - '.github/release/release_materialize_split.py'
      - '.github/release/prepare_reference_split.py'
      - '.github/release/release_validate_split.py'
      - '.github/workflows/release-validate.yml'

permissions:
  contents: read
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  v342_split_release_tooling_validation:
    if: startsWith(github.head_ref, 'cloud-sync-contract-v342')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v342 tooling branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize mechanical v342 split release in workspace
        run: GITHUB_REF_NAME="v342-staging" python3 .github/release/release_materialize_split.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build split v342 candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare mechanical v342 reference from main
        run: GITHUB_REF_NAME="v342-staging" python3 .github/release/prepare_reference_split.py

      - name: Build split v342 reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate split release tooling and external-JS runtime
        run: GITHUB_REF_NAME="v342-staging" python3 .github/release/release_validate_split.py

      - name: Show release evidence without committing v342 product files
        shell: bash
        run: |
          cat audits/RELEASE_TOOLING_CADENCE_AUDIT_v342.txt
          python3 - <<'PY'
          import json
          x=json.load(open('_regression/release-tooling-cadence-v342.fixture.json'))
          assert x['validation']['status']=='passed'
          print('V342_SPLIT_RELEASE_TOOLING_FIXTURE_OK')
          PY
