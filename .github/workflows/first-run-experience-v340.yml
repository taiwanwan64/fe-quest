name: FE QUEST v340 first-run experience

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/first-run-experience-v340.yml'
      - '.github/distribution-split-v341/generate_split.py'
      - '.github/distribution-split-v341/validate_split.py'

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  v341_distribution_transition:
    if: startsWith(github.head_ref, 'distribution-split-v341')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v341 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct previously approved inline v341 baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          shell=Path('app/base-shell-v341.html').read_text()
          shell=re.sub(r'<!-- FEQUEST_ASSET_RECOVERY_V341_START -->.*?<!-- FEQUEST_ASSET_RECOVERY_V341_END -->\n?','',shell,count=1,flags=re.S)
          css=Path('assets/app-v341.css').read_text();js=Path('assets/app-v341.js').read_text()
          assert shell.count('<link rel="stylesheet" href="./assets/app-v341.css">')==1
          assert shell.count('<script src="./assets/app-v341.js"></script>')==1
          inline=shell.replace('<link rel="stylesheet" href="./assets/app-v341.css">','<style>'+css+'</style>',1)
          inline=inline.replace('<script src="./assets/app-v341.js"></script>','<script>'+js+'</script>',1)
          Path('_site').mkdir(exist_ok=True)
          Path('_site/index.html').write_text(inline)
          print('V341_APPROVED_INLINE_RECONSTRUCTED',len(inline.encode()))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare untouched v340 parent
        shell: bash
        run: |
          rm -rf _parent
          mkdir _parent
          git archive origin/main | tar -x -C _parent

      - name: Build untouched v340 parent
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Refresh distribution discovery
        run: python3 .github/distribution-split-v341/discover.py

      - name: Generate external CSS JS minimal shell and recovery guard
        run: python3 .github/distribution-split-v341/generate_split.py

      - name: Build final split v341 site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_split
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate split equivalence learning and recovery contracts
        run: python3 .github/distribution-split-v341/validate_split.py

      - name: Finalize development plan for v341
        run: python3 .github/distribution-split-v341/finalize_plan.py

      - name: Commit validated v341 transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js app/base-shell-v341.html assets/app-v341.css assets/app-v341.js assets/asset-manifest-v341.json audits/V341_DISTRIBUTION_DISCOVERY.json audits/DISTRIBUTION_SPLIT_v341.md _regression/distribution-split-v341.fixture.json FE_QUEST_DEVELOPMENT_PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "Finalize FE QUEST v341 split recovery contract"
            git fetch origin "$GITHUB_HEAD_REF"
            git rebase "origin/$GITHUB_HEAD_REF"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

      - name: Package split v341 release
        shell: bash
        run: |
          cd _site_split
          zip ../FE_QUEST_PWA_v341.zip index.html manifest.webmanifest sw.js assets/app-v341.css assets/app-v341.js assets/asset-manifest-v341.json icon-192.png icon-512.png apple-touch-icon.png

      - name: Upload split v341 release
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v341-split-recovery
          path: FE_QUEST_PWA_v341.zip
          if-no-files-found: error
          retention-days: 90
