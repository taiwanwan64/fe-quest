name: FE QUEST v340 first-run experience

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/first-run-experience-v340.yml'
      - '.github/distribution-split-v341/generate_split.py'
      - '.github/distribution-split-v341/validate_split.py'

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  v341_distribution_transition:
    if: startsWith(github.head_ref, 'distribution-split-v341')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v341 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize inline shell to v340 source state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          idx=Path('index.html');t=idx.read_text()
          # After a previous split validation, reconstruct the approved inline source first.
          if '{% include_relative app/base-shell-v341.html %}' in t and Path('app/base-shell-v341.html').exists():
              shell=Path('app/base-shell-v341.html').read_text()
              shell=__import__('re').sub(r'<!-- FEQUEST_ASSET_RECOVERY_V341_START -->.*?<!-- FEQUEST_ASSET_RECOVERY_V341_END -->\n?','',shell,count=1,flags=__import__('re').S)
              css=Path('assets/app-v341.css').read_text();js=Path('assets/app-v341.js').read_text()
              shell=shell.replace('<link rel="stylesheet" href="./assets/app-v341.css">','<style>'+css+'</style>',1)
              shell=shell.replace('<script src="./assets/app-v341.js"></script>','<script>'+js+'</script>',1)
              idx.write_text('---\n---\n'+shell)
              t=idx.read_text()
          if '<title>FE QUEST PWA v341</title>' in t:
              t=t.replace('<title>FE QUEST PWA v341</title>','<title>FE QUEST PWA v340</title>',1)
              t=t.replace("const APP_VERSION = 'v341';","const APP_VERSION = 'v340';",1)
              idx.write_text(t)
          mp=Path('manifest.webmanifest');m=json.loads(mp.read_text())
          if m.get('name')=='FE QUEST v341':
              m['name']='FE QUEST v340';m['description']=m.get('description','').replace('v341','v340');mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          sw=Path('sw.js');t=sw.read_text()
          if "const APP_VERSION = 'v341';" in t:
              t=t.replace("const APP_VERSION = 'v341';","const APP_VERSION = 'v340';",1)
              t=t.replace("const CACHE_NAME = 'fe-quest-v341-1';","const CACHE_NAME = 'fe-quest-v340-1';",1)
              for row in ["  './assets/app-v341.css',\n","  './assets/app-v341.js',\n","  './assets/asset-manifest-v341.json',\n"]: t=t.replace(row,'')
              sw.write_text(t)
          PY
      - name: Materialize approved inline v341 release
        run: GITHUB_REF_NAME="v341-staging" python3 .github/release/release_materialize.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build inline v341 candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true
      - name: Prepare mechanical inline v341 reference
        run: GITHUB_REF_NAME="v341-staging" python3 .github/release/prepare_reference.py
      - name: Build mechanical inline v341 reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true
      - name: Validate inline release invariants before split
        run: GITHUB_REF_NAME="v341-staging" python3 .github/release/release_validate.py
      - name: Prepare untouched v340 parent
        shell: bash
        run: |
          rm -rf _parent
          mkdir _parent
          git archive origin/main | tar -x -C _parent
      - name: Build untouched v340 parent
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true
      - name: Refresh distribution discovery
        run: python3 .github/distribution-split-v341/discover.py
      - name: Generate external CSS JS and minimal shell
        run: python3 .github/distribution-split-v341/generate_split.py
      - name: Build final split v341 site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_split
          build_revision: ${{ github.sha }}
          verbose: true
      - name: Validate split equivalence learning and recovery contracts
        run: python3 .github/distribution-split-v341/validate_split.py
      - name: Finalize development plan for v341
        run: python3 .github/distribution-split-v341/finalize_plan.py
      - name: Commit validated v341 transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js app/base-shell-v341.html assets/app-v341.css assets/app-v341.js assets/asset-manifest-v341.json audits/V341_DISTRIBUTION_DISCOVERY.json audits/DISTRIBUTION_SPLIT_v341.md audits/RELEASE_TOOLING_CADENCE_AUDIT_v341.txt _regression/distribution-split-v341.fixture.json _regression/release-tooling-cadence-v341.fixture.json FE_QUEST_DEVELOPMENT_PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "Finalize FE QUEST v341 split recovery contract"
            git fetch origin "$GITHUB_HEAD_REF"
            git rebase "origin/$GITHUB_HEAD_REF"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
      - name: Package split v341 release
        shell: bash
        run: |
          cd _site_split
          zip ../FE_QUEST_PWA_v341.zip index.html manifest.webmanifest sw.js assets/app-v341.css assets/app-v341.js assets/asset-manifest-v341.json icon-192.png icon-512.png apple-touch-icon.png
      - name: Upload split v341 release
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v341-split-recovery
          path: FE_QUEST_PWA_v341.zip
          if-no-files-found: error
          retention-days: 90
