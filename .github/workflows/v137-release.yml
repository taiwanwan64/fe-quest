name: Release FE QUEST v137

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v137-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate v137 release
        run: python3 tools/v137_release.py

      - name: Validate v137 release
        run: |
          node --check /tmp/v137-app.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v137
          path: /tmp/FE_QUEST_PWA_v137.zip
          if-no-files-found: error

      - name: Commit release and cleanup
        run: |
          rm -f .github/workflows/v137-release.yml tools/v137_release.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir tools 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release FE QUEST v137'
          git push
