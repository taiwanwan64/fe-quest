name: Materialize FE QUEST v361 stack queue output order

on:
  push:
    branches: ['v361-stack-queue-output-order']
    paths:
      - 'app/stack-queue-output-order-v361.json'
      - '.github/v361/materialize_stack_queue_output_order.py'
      - '.github/workflows/v361-materialize-stack-queue-output-order.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v361-stack-queue-output-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize versioned split release
        run: python .github/v361/materialize_stack_queue_output_order.py
      - name: Validate generated release
        run: python .github/v361/validate_stack_queue_output_order.py
      - name: Commit generated v361 assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js app/base-shell-v361.html assets/app-v361.css assets/app-v361.js assets/asset-manifest-v361.json
          if git diff --cached --quiet; then
            echo 'v361 assets already materialized'
            exit 0
          fi
          git commit -m 'Materialize FE QUEST v361 split release'
          git push origin HEAD:v361-stack-queue-output-order
