name: FE QUEST v175 stable wrapper cadence validation

on:
  push:
    branches: [v175-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v175-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v175 release cadence
        run: python3 tools/v175_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build v175 with stable wrapper
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate FE QUEST v175 stable wrapper cadence
        run: python3 tools/v175_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V175_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Prove FE QUEST v175 stable wrapper release cadence"
            git push origin HEAD:v175-staging
          fi
          echo "FEQUEST_V175_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "FEQUEST_V175_VALIDATION_TREE=$(git rev-parse HEAD^{tree})"

      - name: Package FE QUEST v175
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v175.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          wc -c FE_QUEST_PWA_v175.zip
          sha256sum FE_QUEST_PWA_v175.zip
          sha256sum _site/index.html _site/manifest.webmanifest _site/sw.js _site/icon-192.png _site/icon-512.png _site/apple-touch-icon.png

      - name: Upload FE QUEST v175
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v175-standalone
          path: FE_QUEST_PWA_v175.zip
          if-no-files-found: error
          retention-days: 90
