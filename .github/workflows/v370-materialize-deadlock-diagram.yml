name: Materialize FE QUEST v370 deadlock diagram
on:
  push:
    branches: ['v370-deadlock-diagram']
    paths: ['app/deadlock-diagram-v370.js','app/deadlock-diagram-v370.css','.github/v370/materialize_deadlock_diagram.py','.github/workflows/v370-materialize-deadlock-diagram.yml']
permissions: {contents: write}
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: v370-deadlock-diagram, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/v370/materialize_deadlock_diagram.py
      - run: python .github/v370/validate_deadlock_diagram.py
      - name: Commit generated v370 assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js app/base-shell-v370.html assets/app-v370.css assets/app-v370.js assets/asset-manifest-v370.json
          if git diff --cached --quiet; then echo 'v370 assets already materialized'; exit 0; fi
          git commit -m 'Materialize FE QUEST v370 split release'
          git push origin HEAD:v370-deadlock-diagram
