name: Validate IPA 9.2 question v15 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v15.js'
      - 'assets/question-catalog-ipa92-v15.json'
      - '.github/IPA92_V15_ACTIVATION_2026-09-13.md'
      - '.github/workflows/validate-ipa92-question-v15-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v15-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate historical v15 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v15.js
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v15.json','utf8'));
          const expectedIds=['ipa92_a_aiops_001','ipa92_a_job_scheduling_001','ipa92_a_hot_cold_aisle_001','ipa92_a_mdf_001','ipa92_a_green_it_001'];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v15'||catalog.contentVersion!=='ipa92-questions-v15')throw new Error('v15 catalog version mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==5)throw new Error('v15 catalog count mismatch');
          const ids=catalog.items.map(item=>item.id);
          if(JSON.stringify(ids)!==JSON.stringify(expectedIds))throw new Error('v15 IDs/order mismatch');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v15')throw new Error('v15 metadata contract mismatch');
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');
          }
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v15.js','utf8');
          if(!provider.includes("version:'v376-provider-12-ipa92-v1-v15'"))throw new Error('v15 provider version mismatch');
          console.log('PASS historical v15 public artifacts');
          NODE
