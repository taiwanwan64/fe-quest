name: Generate IPA 9.2 v22 public activation

on:
  push:
    branches: [ipa92-v22-public-activation-20260914]
    paths:
      - '.github/workflows/generate-ipa92-v22-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ipa92-v22-public-activation-20260914
      - name: Generate v22 activation files
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          function mustReplace(s,a,b,label){if(!s.includes(a))throw new Error('missing pattern '+label);return s.replace(a,b)}
          function appendAfter(s,a,b,label){return mustReplace(s,a,a+b,label)}

          const v22Items=[
            {id:'ipa92_a_edge_ai_001',sourcePool:'subject_a',cat:'経営戦略',difficulty:'standard',concept:'エッジAI',coreTopicId:'core_19_04',qualityAudit:'ipa92-original-v22'},
            {id:'ipa92_a_hems_001',sourcePool:'subject_a',cat:'経営戦略',difficulty:'standard',concept:'HEMS',coreTopicId:'core_19_04',qualityAudit:'ipa92-original-v22'},
            {id:'ipa92_a_m2m_001',sourcePool:'subject_a',cat:'経営戦略',difficulty:'standard',concept:'M2M',coreTopicId:'core_19_04',qualityAudit:'ipa92-original-v22'},
            {id:'ipa92_a_smart_industry_001',sourcePool:'subject_a',cat:'経営戦略',difficulty:'standard',concept:'スマートファクトリーとスマート農業',coreTopicId:'core_19_02',qualityAudit:'ipa92-original-v22'},
            {id:'ipa92_a_maas_autonomous_001',sourcePool:'subject_a',cat:'経営戦略',difficulty:'standard',concept:'MaaSと自動運転',coreTopicId:'core_19_01',qualityAudit:'ipa92-original-v22'}
          ];
          fs.writeFileSync('assets/question-catalog-ipa92-v22.json',JSON.stringify({version:'ipa92-catalog-v22',contentVersion:'ipa92-questions-v22',contentVersions:['ipa92-questions-v22'],counts:{subjectA:5,catalogQuestions:5},items:v22Items},null,2)+'\n');

          let p=fs.readFileSync('assets/protected-content-provider-v376-v21.js','utf8');
          p=appendAfter(p,"const IPA92_V21_CATALOG_URL=new URL('question-catalog-ipa92-v21.json',SCRIPT_URL).toString();\n","const IPA92_V22_CATALOG_URL=new URL('question-catalog-ipa92-v22.json',SCRIPT_URL).toString();\n",'provider catalog url');
          p=appendAfter(p,"const IPA92_V21_CATALOG_VERSION='ipa92-catalog-v21';\n","const IPA92_V22_CATALOG_VERSION='ipa92-catalog-v22';\n",'provider catalog version');
          p=appendAfter(p,"const IPA92_V21_CONTENT_VERSION='ipa92-questions-v21';\n","const IPA92_V22_CONTENT_VERSION='ipa92-questions-v22';\n",'provider content version');
          p=appendAfter(p,"const IPA92_V21_TOTAL=5;\n","const IPA92_V22_TOTAL=5;\n",'provider total');
          p=mustReplace(p,"+IPA92_V21_TOTAL;\nconst MERGED_CATALOG_TOTAL","+IPA92_V21_TOTAL+IPA92_V22_TOTAL;\nconst MERGED_CATALOG_TOTAL",'provider extension total');
          p=mustReplace(p,"fetchJson(IPA92_V20_CATALOG_URL),fetchJson(IPA92_V21_CATALOG_URL)\n","fetchJson(IPA92_V20_CATALOG_URL),fetchJson(IPA92_V21_CATALOG_URL),fetchJson(IPA92_V22_CATALOG_URL)\n",'provider fetch list');
          p=mustReplace(p,"]).then(([base,legacy,v7,v8,v9,v10,v11,v12,v13,v14,v15,v16,v17,v18,v19,v20,v21])=>{","]).then(([base,legacy,v7,v8,v9,v10,v11,v12,v13,v14,v15,v16,v17,v18,v19,v20,v21,v22])=>{",'provider destructure');
          p=mustReplace(p,"        ['v21',v21,IPA92_V21_CATALOG_VERSION,IPA92_V21_CONTENT_VERSION,IPA92_V21_TOTAL,'ipa92-original-v21']\n      ];","        ['v21',v21,IPA92_V21_CATALOG_VERSION,IPA92_V21_CONTENT_VERSION,IPA92_V21_TOTAL,'ipa92-original-v21'],\n        ['v22',v22,IPA92_V22_CATALOG_VERSION,IPA92_V22_CONTENT_VERSION,IPA92_V22_TOTAL,'ipa92-original-v22']\n      ];",'provider entries');
          p=mustReplace(p,"...v20.items,...v21.items];","...v20.items,...v21.items,...v22.items];",'provider items');
          p=mustReplace(p,"IPA92_V20_CONTENT_VERSION,IPA92_V21_CONTENT_VERSION]),","IPA92_V20_CONTENT_VERSION,IPA92_V21_CONTENT_VERSION,IPA92_V22_CONTENT_VERSION]),",'provider versions');
          p=p.replaceAll('ipa92-catalog-v1-v21','ipa92-catalog-v1-v22').replaceAll('ipa92-questions-v1-v21','ipa92-questions-v1-v22');
          p=mustReplace(p,"version:'v376-provider-18-ipa92-v1-v21'","version:'v376-provider-19-ipa92-v1-v22'",'provider api version');
          fs.writeFileSync('assets/protected-content-provider-v376-v22.js',p);

          let c=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const meta=`  const IPA92_V22_METADATA=Object.freeze([\n${v22Items.map(x=>'    '+JSON.stringify(x)).join(',\n')}\n  ].map(item=>Object.freeze(item)));\n\n`;
          c=mustReplace(c,'  function installMetadata(items,label,expectedTotal){',meta+'  function installMetadata(items,label,expectedTotal){','config metadata');
          c=appendAfter(c,"  function installV21Metadata(){return installMetadata(IPA92_V21_METADATA,'v21',5)}\n","  function installV22Metadata(){return installMetadata(IPA92_V22_METADATA,'v22',5)}\n",'config installer');
          c=appendAfter(c,'    const v21Install=installV21Metadata();\n','    const v22Install=installV22Metadata();\n','config install call');
          c=appendAfter(c,'    root.FEQUEST_IPA92_V21_SUBJECT_A_METADATA_INSTALL=v21Install;\n','    root.FEQUEST_IPA92_V22_SUBJECT_A_METADATA_INSTALL=v22Install;\n','config install root');
          c=mustReplace(c,"    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-18-ipa92-v1-v21'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1104;","    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-19-ipa92-v1-v22'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1109;",'config provider contract');
          c=mustReplace(c,'&&v20Install.ok&&v21Install.ok;','&&v20Install.ok&&v21Install.ok&&v22Install.ok;','config ok');
          c=mustReplace(c,'v20:v20Install,v21:v21Install});','v20:v20Install,v21:v21Install,v22:v22Install});','config return');
          c=mustReplace(c,'  function activateV21Provider(){','  function activateV22Provider(){','config activate name');
          c=c.replaceAll("v376-provider-18-ipa92-v1-v21","v376-provider-19-ipa92-v1-v22");
          c=mustReplace(c,"    const id='fequest-ipa92-v21-provider';","    const id='fequest-ipa92-v22-provider';",'config script id');
          c=mustReplace(c,"      script.src='./assets/protected-content-provider-v376-v21.js';","      script.src='./assets/protected-content-provider-v376-v22.js';",'config src');
          c=appendAfter(c,'  root.FEQUEST_IPA92_V21_SUBJECT_A_METADATA=IPA92_V21_METADATA;\n','  root.FEQUEST_IPA92_V22_SUBJECT_A_METADATA=IPA92_V22_METADATA;\n','config metadata root');
          c=mustReplace(c,'  const latestProviderReady=activateV21Provider();','  const latestProviderReady=activateV22Provider();','config latest activate');
          c=mustReplace(c,'  root.FEQUEST_IPA92_V21_PROVIDER_READY=latestProviderReady;\n','  root.FEQUEST_IPA92_V22_PROVIDER_READY=latestProviderReady;\n  root.FEQUEST_IPA92_V21_PROVIDER_READY=latestProviderReady;\n','config latest ready');
          fs.writeFileSync('cloud/public-config-v342.js',c);

          let sw=fs.readFileSync('sw.js','utf8');
          sw=mustReplace(sw,"const CACHE_NAME = 'fe-quest-v377-20';","const CACHE_NAME = 'fe-quest-v377-21';",'sw cache');
          sw=appendAfter(sw,'  "./assets/protected-content-provider-v376-v21.js",\n','  "./assets/protected-content-provider-v376-v22.js",\n','sw provider');
          sw=appendAfter(sw,'  "./assets/question-catalog-ipa92-v21.json",\n','  "./assets/question-catalog-ipa92-v22.json",\n','sw catalog');
          fs.writeFileSync('sw.js',sw);

          fs.writeFileSync('.github/IPA92_V22_ACTIVATION_2026-09-14.md',`# FE QUEST — IPA Ver.9.2 v22 public activation — 2026-09-14\n\n## Scope\n\nThis activation publishes only public-safe metadata and runtime contracts for the protected v22 industrial/consumer technology batch. Protected stems, options, answers, explanations, hints and lesson bodies remain private.\n\n## Verified protected production evidence\n\n- private source merge commit: \`846382c447e78416d4d25266edb49b3bc275f00b\`\n- automatic dispatcher run: \`34820828775\` — success\n- automatic unified protected import run: \`34820837808\` — success\n- content version: \`ipa92-questions-v22\`\n- v22 active questions: **5**\n- v22 staging rows after finalization: **0**\n- active protected question total after import: **1109**\n- active protected lesson total: **130**\n- v22 payload SHA-256: \`9a50319e2633a233754fe39d6b5ae80d75529a47b8f94bf4406cec571ba72a36\`\n- latest lesson payload SHA-256: \`1bbf02f42e0c12337a9fca60b9be00cd2170952e37a35cbb281bb61bb17bba1c\`\n- lesson database content version remains \`v376-lessons-1\`\n\n## Semantic decisions\n\nFive original application/comparison questions cover seven targets: edge AI, HEMS, M2M, smart factory, smart agriculture, MaaS and autonomous driving. Existing edge-computing, IoT and FA/CIM practice is retained as the foundation rather than duplicated. Smart factory/smart agriculture and MaaS/autonomous driving are paired so learners distinguish application domain and service-model versus vehicle-control semantics.\n\n## Public runtime target\n\n- provider: \`v376-provider-19-ipa92-v1-v22\`\n- merged protected catalog total: **1109**\n- extension safe metadata total: **205**\n- merged Subject-A count: **915**\n- tracked Subject-A count: **924**\n- PWA cache: \`fe-quest-v377-21\`\n`);

          fs.mkdirSync('.github/generated',{recursive:true});
          fs.writeFileSync('.github/generated/validate-ipa92-question-v21-public.yml',`name: Validate IPA 9.2 question v21 historical artifacts\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v21.js'\n      - 'assets/question-catalog-ipa92-v21.json'\n      - '.github/IPA92_V21_ACTIVATION_2026-09-14.md'\n      - '.github/workflows/validate-ipa92-question-v21-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v21-history:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate immutable v21 artifacts\n        run: |\n          node --check assets/protected-content-provider-v376-v21.js\n          node -e \"const c=require('./assets/question-catalog-ipa92-v21.json');if(c.version!=='ipa92-catalog-v21'||c.contentVersion!=='ipa92-questions-v21'||c.items?.length!==5)process.exit(1)\"\n          grep -Fq \"version:'v376-provider-18-ipa92-v1-v21'\" assets/protected-content-provider-v376-v21.js\n          grep -Fq 'active protected question total after import: **1104**' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n`);

          fs.writeFileSync('.github/generated/validate-ipa92-question-v22-public.yml',`name: Validate IPA 9.2 question v22 public activation\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v22.js'\n      - 'assets/question-catalog-ipa92-v22.json'\n      - 'cloud/public-config-v342.js'\n      - 'sw.js'\n      - '.github/IPA92_V22_ACTIVATION_2026-09-14.md'\n      - '.github/workflows/validate-ipa92-question-v22-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v22-public:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate JavaScript syntax\n        run: |\n          node --check assets/protected-content-provider-v376-v22.js\n          node --check cloud/public-config-v342.js\n          node --check sw.js\n      - name: Validate v22 safe catalog and provider\n        run: |\n          node <<'CHECK'\n          const fs=require('node:fs'),vm=require('node:vm');\n          const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v22.json','utf8'));\n          const ids=['ipa92_a_edge_ai_001','ipa92_a_hems_001','ipa92_a_m2m_001','ipa92_a_smart_industry_001','ipa92_a_maas_autonomous_001'];\n          const topics=['core_19_04','core_19_04','core_19_04','core_19_02','core_19_01'];\n          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);\n          if(c.version!=='ipa92-catalog-v22'||c.contentVersion!=='ipa92-questions-v22'||JSON.stringify(c.contentVersions)!==JSON.stringify(['ipa92-questions-v22'])||c.counts?.subjectA!==5||c.counts?.catalogQuestions!==5||c.items?.length!==5||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v22 catalog contract');\n          c.items.forEach((item,i)=>{if(item.sourcePool!=='subject_a'||item.cat!=='経営戦略'||item.coreTopicId!==topics[i]||item.qualityAudit!=='ipa92-original-v22'||Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('v22 safe metadata '+item.id)});\n          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));const versions={};for(let i=7;i<=22;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));const source=fs.readFileSync('assets/protected-content-provider-v376-v22.js','utf8');\n          const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v22.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=22;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data}},window:{}};vm.createContext(ctx);vm.runInContext(source,ctx);\n          (async()=>{const api=ctx.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-19-ipa92-v1-v22'||api.catalogTotal!==1109)throw new Error('provider contract');const m=await api.loadCatalog();if(m.items.length!==1109||m.counts?.subjectA!==915||m.counts?.trackedSubjectA!==924||m.counts?.catalogQuestions!==1109)throw new Error('merged counts');const expected=Array.from({length:22},(_,i)=>'ipa92-questions-v'+(i+1));if(JSON.stringify(m.extensionContentVersions)!==JSON.stringify(expected)||new Set(m.items.map(x=>x.id)).size!==1109)throw new Error('versions/ids');console.log('PASS provider 1109')})().catch(e=>{console.error(e);process.exitCode=1});\n          CHECK\n      - name: Validate runtime metadata and release evidence\n        run: |\n          node <<'CHECK'\n          const fs=require('node:fs'),vm=require('node:vm');const source=fs.readFileSync('cloud/public-config-v342.js','utf8');const bank=Array.from({length:83},(_,i)=>({id:'legacy_'+i}));const listeners={};const script={id:'',src:'',async:true,addEventListener(t,f){listeners[t]=f}};let ctx;const document={getElementById(){return null},createElement(){return script},head:{appendChild(n){if(n.src!=='./assets/protected-content-provider-v376-v22.js')throw new Error('provider src');ctx.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-19-ipa92-v1-v22',catalogTotal:1109};listeners.load()}}};ctx={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-18-ipa92-v1-v21',catalogTotal:1104}};vm.createContext(ctx);vm.runInContext('const QUESTION_BANK='+JSON.stringify(bank)+';\\n'+source+'\\nglobalThis.__BANK__=QUESTION_BANK;',ctx);(async()=>{const r=await ctx.FEQUEST_IPA92_V22_PROVIDER_READY;if(!r?.ok||ctx.__BANK__.length!==205||ctx.FEQUEST_IPA92_V22_SUBJECT_A_METADATA?.length!==5)throw new Error('runtime metadata');for(let i=7;i<=21;i++)if(ctx['FEQUEST_IPA92_V'+i+'_PROVIDER_READY']!==ctx.FEQUEST_IPA92_V22_PROVIDER_READY)throw new Error('alias '+i);console.log('PASS runtime metadata 205')})().catch(e=>{console.error(e);process.exitCode=1});\n          CHECK\n          grep -Fq '\"./assets/protected-content-provider-v376-v22.js\"' sw.js\n          grep -Fq '\"./assets/question-catalog-ipa92-v22.json\"' sw.js\n          grep -Fq \"const CACHE_NAME = 'fe-quest-v377-21';\" sw.js\n          grep -Fq 'active protected question total after import: **1109**' .github/IPA92_V22_ACTIVATION_2026-09-14.md\n          grep -Fq '846382c447e78416d4d25266edb49b3bc275f00b' .github/IPA92_V22_ACTIVATION_2026-09-14.md\n          grep -Fq '9a50319e2633a233754fe39d6b5ae80d75529a47b8f94bf4406cec571ba72a36' .github/IPA92_V22_ACTIVATION_2026-09-14.md\n          grep -Fq '34820828775' .github/IPA92_V22_ACTIVATION_2026-09-14.md\n          grep -Fq '34820837808' .github/IPA92_V22_ACTIVATION_2026-09-14.md\n          grep -Fq 'v376-lessons-1' .github/IPA92_V22_ACTIVATION_2026-09-14.md\n`);

          let pub=fs.readFileSync('.github/workflows/validate-publication.yml','utf8');
          pub=appendAfter(pub,'          node --check assets/protected-content-provider-v376-v21.js\n','          node --check assets/protected-content-provider-v376-v22.js\n','publication syntax');
          pub=appendAfter(pub,'          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js"\n','          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v22.js"\n','publication provider file');
          pub=appendAfter(pub,'          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v21.json"\n','          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v22.json"\n','publication catalog file');
          pub=mustReplace(pub,"          grep -Fq \"const CACHE_NAME = 'fe-quest-v377-20';\" \"$RUNNER_TEMP/site/sw.js\"\n","          grep -Fq \"const CACHE_NAME = 'fe-quest-v377-21';\" \"$RUNNER_TEMP/site/sw.js\"\n",'publication cache');
          pub=appendAfter(pub,"          grep -Fq '\"./assets/protected-content-provider-v376-v21.js\"' \"$RUNNER_TEMP/site/sw.js\"\n","          grep -Fq '\"./assets/protected-content-provider-v376-v22.js\"' \"$RUNNER_TEMP/site/sw.js\"\n",'publication sw provider');
          pub=appendAfter(pub,"          grep -Fq '\"./assets/question-catalog-ipa92-v21.json\"' \"$RUNNER_TEMP/site/sw.js\"\n","          grep -Fq '\"./assets/question-catalog-ipa92-v22.json\"' \"$RUNNER_TEMP/site/sw.js\"\n",'publication sw catalog');
          pub=appendAfter(pub,"          grep -Fq \"version:'v376-provider-18-ipa92-v1-v21'\" \"$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js\"\n","          grep -Fq \"version:'v376-provider-19-ipa92-v1-v22'\" \"$RUNNER_TEMP/site/assets/protected-content-provider-v376-v22.js\"\n",'publication provider marker');
          fs.writeFileSync('.github/generated/validate-publication.yml',pub);

          let deploy=fs.readFileSync('.github/workflows/deploy-pages.yml','utf8');
          deploy=appendAfter(deploy,'          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js"\n','          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v22.js"\n','deploy provider file');
          deploy=appendAfter(deploy,'          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v21.json"\n','          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v22.json"\n','deploy catalog file');
          deploy=mustReplace(deploy,"          grep -Fq \"const CACHE_NAME = 'fe-quest-v377-20';\" \"$RUNNER_TEMP/site/sw.js\"\n","          grep -Fq \"const CACHE_NAME = 'fe-quest-v377-21';\" \"$RUNNER_TEMP/site/sw.js\"\n",'deploy cache');
          deploy=appendAfter(deploy,"          grep -Fq '\"./assets/protected-content-provider-v376-v21.js\"' \"$RUNNER_TEMP/site/sw.js\"\n","          grep -Fq '\"./assets/protected-content-provider-v376-v22.js\"' \"$RUNNER_TEMP/site/sw.js\"\n",'deploy sw provider');
          deploy=appendAfter(deploy,"          grep -Fq '\"./assets/question-catalog-ipa92-v21.json\"' \"$RUNNER_TEMP/site/sw.js\"\n","          grep -Fq '\"./assets/question-catalog-ipa92-v22.json\"' \"$RUNNER_TEMP/site/sw.js\"\n",'deploy sw catalog');
          deploy=appendAfter(deploy,"          grep -Fq \"version:'v376-provider-18-ipa92-v1-v21'\" \"$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js\"\n","          grep -Fq \"version:'v376-provider-19-ipa92-v1-v22'\" \"$RUNNER_TEMP/site/assets/protected-content-provider-v376-v22.js\"\n",'deploy provider marker');
          fs.writeFileSync('.github/generated/deploy-pages.yml',deploy);

          require('node:child_process').execFileSync(process.execPath,['--check','assets/protected-content-provider-v376-v22.js'],{stdio:'inherit'});
          require('node:child_process').execFileSync(process.execPath,['--check','cloud/public-config-v342.js'],{stdio:'inherit'});
          require('node:child_process').execFileSync(process.execPath,['--check','sw.js'],{stdio:'inherit'});
          NODE
      - name: Commit generated non-workflow and staged workflow files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/question-catalog-ipa92-v22.json assets/protected-content-provider-v376-v22.js cloud/public-config-v342.js sw.js .github/IPA92_V22_ACTIVATION_2026-09-14.md .github/generated/
          git commit -m 'Generate IPA 9.2 v22 public activation assets'
          git push origin HEAD:ipa92-v22-public-activation-20260914
