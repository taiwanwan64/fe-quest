name: Deploy sanitized FE QUEST production to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout deploy-only repository
        uses: actions/checkout@v6
      - name: Build Pages artifact from deploy files only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ "$RUNNER_TEMP/site/"
          printf '' > "$RUNNER_TEMP/site/.nojekyll"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/assets/app-v377.js"
          test -f "$RUNNER_TEMP/site/assets/app-v377.css"
          test -f "$RUNNER_TEMP/site/assets/ch3-depth-v383.css"
          grep -Fq '<link rel="stylesheet" href="./assets/ch3-depth-v383.css">' "$RUNNER_TEMP/site/index.html"
          grep -Fq '"./assets/ch3-depth-v383.css"' "$RUNNER_TEMP/site/sw.js"
