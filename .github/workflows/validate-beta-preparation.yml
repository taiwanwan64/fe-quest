name: Validate general release and feedback
on:
  pull_request:
    branches: [main]
    paths:
      - 'beta.html'
      - 'start.html'
      - 'help.html'
      - 'terms.html'
      - 'sw.js'
      - '.github/scripts/check-navigation-cache-v1.mjs'
      - 'feedback.html'
      - 'privacy.html'
      - 'assets/beta-*.css'
      - 'assets/start-v1.css'
      - 'assets/beta-*.js'
      - '.github/scripts/check-beta-preparation-v1.mjs'
      - '.github/workflows/validate-beta-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    container:\n      image: mcr.microsoft.com/playwright:v1.55.0-noble\n      options: --shm-size=1g\n    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep informational pages out of the app offline shell
        run: node .github/scripts/check-navigation-cache-v1.mjs
      - name: Validate questionnaire and public boundaries
        run: node .github/scripts/check-beta-preparation-v1.mjs
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Exercise mobile and desktop feedback journey
        run: node .github/scripts/check-beta-preparation-v1.mjs --browser

