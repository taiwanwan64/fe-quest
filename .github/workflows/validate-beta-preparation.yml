name: Validate beta recruitment and feedback
on:
  pull_request:
    branches: [main]
    paths:
      - 'beta.html'
      - 'feedback.html'
      - 'privacy.html'
      - 'assets/beta-*.css'
      - 'assets/beta-*.js'
      - '.github/scripts/check-beta-preparation-v1.mjs'
      - '.github/workflows/validate-beta-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate questionnaire and public boundaries
        run: node .github/scripts/check-beta-preparation-v1.mjs
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Exercise mobile and desktop feedback journey
        run: node .github/scripts/check-beta-preparation-v1.mjs --browser
