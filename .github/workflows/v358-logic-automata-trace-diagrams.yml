name: FE QUEST v358 logic and automata trace diagrams

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v358/**'
      - '.github/workflows/v358-logic-automata-trace-diagrams.yml'
      - '.github/workflows/v358-materialize-logic-automata-trace-diagrams.yml'
      - 'audits/V358_LOGIC_AUTOMATA_TRACE_DIAGRAMS.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v358.html'
      - 'app/logic-automata-trace-diagram-v358.js'
      - 'app/logic-automata-trace-diagram-v358.css'
      - 'assets/app-v358.css'
      - 'assets/app-v358.js'
      - 'assets/asset-manifest-v358.json'

permissions:
  contents: read

jobs:
  validate-v358-logic-automata-trace-diagrams:
    if: startsWith(github.head_ref, 'v358-logic-automata-trace-diagrams')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v358/.*|\.github/workflows/v358-logic-automata-trace-diagrams\.yml|\.github/workflows/v358-materialize-logic-automata-trace-diagrams\.yml|audits/V358_LOGIC_AUTOMATA_TRACE_DIAGRAMS\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v358\.html|app/logic-automata-trace-diagram-v358\.js|app/logic-automata-trace-diagram-v358\.css|assets/app-v358\.css|assets/app-v358\.js|assets/asset-manifest-v358\.json)$' | grep -q .; then
            echo 'Unexpected file in the v358 logic/automata trace release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v357.html assets/app-v357.css assets/app-v357.js assets/asset-manifest-v357.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v358/validate_logic_automata_trace_diagrams.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive trace diagrams
        run: python .github/v358/browser_logic_automata_trace_diagrams.py
      - name: Upload trace diagram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v358-logic-automata-trace-diagram-evidence
          path: _browser_evidence/v358/
          if-no-files-found: warn
          retention-days: 14
