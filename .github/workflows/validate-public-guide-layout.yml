name: Validate public guide layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/*.css'
      - '.github/scripts/check-public-guide-layout-v1.cjs'
      - '.github/workflows/validate-public-guide-layout.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/*.css'
      - '.github/scripts/check-public-guide-layout-v1.cjs'
      - '.github/workflows/validate-public-guide-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-guides:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling and Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Review public guides with local CSS
        env:
          GUIDE_QA_OUTPUT: ${{ runner.temp }}/public-guide-layout
        run: node .github/scripts/check-public-guide-layout-v1.cjs
      - name: Save layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-guide-layout
          path: ${{ runner.temp }}/public-guide-layout
          if-no-files-found: warn
          retention-days: 14
