name: FE QUEST v339 runtime safety and override cleanup

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/runtime-safety-override-cleanup/**'
      - '.github/workflows/runtime-safety-override-cleanup-v339.yml'
      - 'app/subject-b-final-xp-overrides-v219.txt'
      - 'app/subject-b-review-reason-route-overrides-v243.txt'
      - 'app/subject-b-security-review-reason-label-overrides-v245.txt'
      - 'app/subject-b-final-result-pipeline-v339.txt'

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    if: startsWith(github.head_ref, 'runtime-safety-override-cleanup-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Resolve v339 target
        id: release
        shell: bash
        run: |
          BRANCH="$GITHUB_HEAD_REF"
          if [[ ! "$BRANCH" =~ ^runtime-safety-override-cleanup-(v[0-9]+)$ ]]; then exit 1; fi
          VERSION="${BASH_REMATCH[1]}"; NUMBER="${VERSION#v}"; PREVIOUS="v$((NUMBER-1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Materialize conventional release shell
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build v339 candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare approved v339 reference
        shell: bash
        run: |
          rm -rf _reference
          mkdir _reference
          git archive origin/main | tar -x -C _reference
          for rel in \
            index.html manifest.webmanifest sw.js \
            app/subject-b-final-xp-overrides-v219.txt \
            app/subject-b-review-reason-route-overrides-v243.txt \
            app/subject-b-security-review-reason-label-overrides-v245.txt \
            app/subject-b-final-result-pipeline-v339.txt; do
            mkdir -p "_reference/$(dirname "$rel")"
            cp "$rel" "_reference/$rel"
          done

      - name: Build approved v339 reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare untouched v338 parent
        run: |
          rm -rf _parent_reference
          mkdir _parent_reference
          git archive origin/main | tar -x -C _parent_reference

      - name: Build untouched v338 parent
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent_reference
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate standard release invariants
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_validate.py

      - name: Validate runtime safety and override cleanup
        run: python3 .github/runtime-safety-override-cleanup/validate_v339.py

      - name: Commit validated v339 shell and evidence
        shell: bash
        run: |
          TARGET_BRANCH="$GITHUB_HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _regression audits index.html manifest.webmanifest sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Materialize FE QUEST v339 runtime safety release"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Package v339 release
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          cd _site
          zip "../FE_QUEST_PWA_${VERSION}.zip" index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png

      - name: Upload v339 release
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-${{ steps.release.outputs.version }}-standalone
          path: FE_QUEST_PWA_${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90
