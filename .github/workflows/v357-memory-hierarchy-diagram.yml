name: FE QUEST v357 memory hierarchy diagram

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v357/**'
      - '.github/workflows/v357-memory-hierarchy-diagram.yml'
      - '.github/workflows/v357-materialize-memory-hierarchy-diagram.yml'
      - 'audits/V357_MEMORY_HIERARCHY_DIAGRAM.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v357.html'
      - 'app/memory-hierarchy-diagram-v357.js'
      - 'app/memory-hierarchy-diagram-v357.css'
      - 'assets/app-v357.css'
      - 'assets/app-v357.js'
      - 'assets/asset-manifest-v357.json'

permissions:
  contents: read

jobs:
  validate-v357-memory-hierarchy-diagram:
    if: startsWith(github.head_ref, 'v357-memory-hierarchy-diagram')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v357/.*|\.github/workflows/v357-memory-hierarchy-diagram\.yml|\.github/workflows/v357-materialize-memory-hierarchy-diagram\.yml|audits/V357_MEMORY_HIERARCHY_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v357\.html|app/memory-hierarchy-diagram-v357\.js|app/memory-hierarchy-diagram-v357\.css|assets/app-v357\.css|assets/app-v357\.js|assets/asset-manifest-v357\.json)$' | grep -q .; then
            echo 'Unexpected file in the v357 memory hierarchy release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v356.html assets/app-v356.css assets/app-v356.js assets/asset-manifest-v356.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v357/validate_memory_hierarchy_diagram.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive memory hierarchy diagram
        run: python .github/v357/browser_memory_hierarchy_diagram.py
      - name: Upload memory hierarchy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v357-memory-hierarchy-diagram-evidence
          path: _browser_evidence/v357/
          if-no-files-found: warn
          retention-days: 14
