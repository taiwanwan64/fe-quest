name: Validate IPA 9.2 question v10 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v10.js'
      - 'assets/question-catalog-ipa92-v10.json'
      - '.github/IPA92_V10_ACTIVATION_2026-09-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v10-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate historical v10 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v10.js
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v10.json','utf8'));
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v10'||catalog.contentVersion!=='ipa92-questions-v10')throw new Error('v10 catalog version mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==16)throw new Error('v10 catalog count mismatch');
          if(new Set(catalog.items.map(x=>x.id)).size!==16)throw new Error('v10 duplicate IDs');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v10')throw new Error(`v10 metadata contract mismatch: ${item.id}`);
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error(`protected field leaked: ${item.id}`);
          }
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v10.js','utf8');
          if(!provider.includes("version:'v376-provider-7-ipa92-v1-v10'"))throw new Error('v10 provider version mismatch');
          console.log('PASS historical v10 public artifacts');
          NODE
          grep -Fq 'active protected question total after import: **1047**' .github/IPA92_V10_ACTIVATION_2026-09-13.md
