name: Validate IPA 9.2 question v19 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v19.js'
      - 'assets/question-catalog-ipa92-v19.json'
      - '.github/IPA92_V19_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v19-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v19-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v19 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v19.js
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v19.json','utf8'));
          const ids=['ipa92_a_persona_journey_001','ipa92_a_dynamic_pricing_001','ipa92_a_subscription_model_001','ipa92_a_omnichannel_001','ipa92_a_seo_lpo_001'];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(c.version!=='ipa92-catalog-v19'||c.contentVersion!=='ipa92-questions-v19'||c.items?.length!==5||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v19 catalog drift');
          for(const item of c.items)if(item.qualityAudit!=='ipa92-original-v19'||Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('v19 public metadata drift');
          const p=fs.readFileSync('assets/protected-content-provider-v376-v19.js','utf8');
          if(!p.includes("version:'v376-provider-16-ipa92-v1-v19'")||!p.includes("const IPA92_V19_TOTAL=5;"))throw new Error('v19 provider drift');
          console.log('PASS immutable v19 public artifacts');
          NODE
