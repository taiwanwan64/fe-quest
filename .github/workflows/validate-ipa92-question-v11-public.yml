name: Validate IPA 9.2 question v11 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v11.js'
      - 'assets/question-catalog-ipa92-v11.json'
      - '.github/IPA92_V11_ACTIVATION_2026-09-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v11-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate historical v11 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v11.js
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v11.json','utf8'));
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v11'||catalog.contentVersion!=='ipa92-questions-v11')throw new Error('v11 catalog version mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==8)throw new Error('v11 catalog count mismatch');
          if(new Set(catalog.items.map(x=>x.id)).size!==8)throw new Error('v11 duplicate IDs');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v11')throw new Error(`v11 metadata contract mismatch: ${item.id}`);
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error(`protected field leaked: ${item.id}`);
          }
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v11.js','utf8');
          if(!provider.includes("version:'v376-provider-8-ipa92-v1-v11'"))throw new Error('v11 provider version mismatch');
          console.log('PASS historical v11 public artifacts');
          NODE
          grep -Fq 'active protected question total after import: **1055**' .github/IPA92_V11_ACTIVATION_2026-09-13.md
