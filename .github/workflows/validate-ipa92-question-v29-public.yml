name: Validate IPA 9.2 question v29 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v29.js'
      - 'assets/question-catalog-ipa92-v29.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V29_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v29-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v29-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v29.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v29 safe public contract and runtime merge
        run: |
          node <<'CHECK'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v29.json','utf8'));
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v29.js','utf8');
          const config=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          const ids=['ipa92_a_dynamic_array_001','ipa92_a_linked_list_variants_001','ipa92_a_frequency_filters_001','ipa92_a_control_response_stability_001','ipa92_a_sensor_types_001'];
          if(catalog.version!=='ipa92-catalog-v29'||catalog.contentVersion!=='ipa92-questions-v29'||catalog.items?.length!==5)throw new Error('v29 catalog contract');
          if(catalog.counts?.subjectA!==5||catalog.counts?.catalogQuestions!==5)throw new Error('v29 catalog counts');
          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v29 catalog ids');
          for(const item of catalog.items){if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v29'||typeof item.cat!=='string'||typeof item.concept!=='string'||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||'')))throw new Error('invalid v29 safe metadata');if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');}
          if(!provider.includes("version:'v376-provider-26-ipa92-v1-v29'")||!provider.includes('const IPA92_V29_TOTAL=5;')||!provider.includes("const IPA92_V29_CONTENT_VERSION='ipa92-questions-v29';"))throw new Error('v29 provider contract');
          if(!config.includes('const IPA92_V29_METADATA=Object.freeze([')||!config.includes('activateV29Provider()')||!config.includes('catalogTotal===1144'))throw new Error('v29 public config contract');
          if(!sw.includes('"./assets/protected-content-provider-v376-v29.js"')||!sw.includes('"./assets/question-catalog-ipa92-v29.json"')||!sw.includes("const CACHE_NAME = 'fe-quest-v377-26';"))throw new Error('v29 service worker contract');
          const context={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v29.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const name=new URL(String(url)).pathname.split('/').pop();const p='assets/'+name;return {ok:true,status:200,json:async()=>JSON.parse(fs.readFileSync(p,'utf8'))}},window:{}};
          vm.createContext(context);vm.runInContext(provider,context,{filename:'assets/protected-content-provider-v376-v29.js'});
          (async()=>{const merged=await context.window.FEQUEST_PROTECTED_CONTENT.loadCatalog();if(merged.items.length!==1144)throw new Error('merged catalog total');if(merged.counts?.subjectA!==950||merged.counts?.trackedSubjectA!==959||merged.counts?.catalogQuestions!==1144)throw new Error('merged counts');for(const id of ids)if(!merged.items.some(x=>x.id===id))throw new Error('missing v29 id '+id);console.log('PASS v29 public contract: 5 safe metadata items, merged production total 1144');})().catch(e=>{console.error(e);process.exitCode=1});
          CHECK
      - name: Validate production evidence marker
        run: |
          grep -Fq 'active protected question total after import: **1144**' .github/IPA92_V29_ACTIVATION_2026-09-15.md
          grep -Fq 'a0f1536cfc928aa72411d713b36602ceb87d761c' .github/IPA92_V29_ACTIVATION_2026-09-15.md
          grep -Fq 'c817810ac57b29803f47e8c5ce26ab7e8f8a69197a92ba8219195f11f19449b1' .github/IPA92_V29_ACTIVATION_2026-09-15.md
          grep -Fq '34909608660' .github/IPA92_V29_ACTIVATION_2026-09-15.md
          grep -Fq 'v376-lessons-1' .github/IPA92_V29_ACTIVATION_2026-09-15.md
