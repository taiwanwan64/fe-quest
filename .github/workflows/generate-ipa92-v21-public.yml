name: Generate IPA 9.2 v21 public activation

on:
  push:
    branches: [ipa92-v21-public-activation-20260914]
    paths:
      - '.github/workflows/generate-ipa92-v21-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ipa92-v21-public-activation-20260914
      - name: Generate v21 activation files
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          function mustReplace(s,a,b,label){if(!s.includes(a))throw new Error('missing pattern '+label);return s.replace(a,b)}

          // Latest provider: extend v20 without changing historical artifacts.
          let p=fs.readFileSync('assets/protected-content-provider-v376-v20.js','utf8');
          p=mustReplace(p,"const IPA92_V20_CATALOG_URL=new URL('question-catalog-ipa92-v20.json',SCRIPT_URL).toString();\n","const IPA92_V20_CATALOG_URL=new URL('question-catalog-ipa92-v20.json',SCRIPT_URL).toString();\nconst IPA92_V21_CATALOG_URL=new URL('question-catalog-ipa92-v21.json',SCRIPT_URL).toString();\n",'provider catalog url');
          p=mustReplace(p,"const IPA92_V20_CATALOG_VERSION='ipa92-catalog-v20';\n","const IPA92_V20_CATALOG_VERSION='ipa92-catalog-v20';\nconst IPA92_V21_CATALOG_VERSION='ipa92-catalog-v21';\n",'provider catalog version');
          p=mustReplace(p,"const IPA92_V20_CONTENT_VERSION='ipa92-questions-v20';\n","const IPA92_V20_CONTENT_VERSION='ipa92-questions-v20';\nconst IPA92_V21_CONTENT_VERSION='ipa92-questions-v21';\n",'provider content version');
          p=mustReplace(p,"const IPA92_V20_TOTAL=5;\n","const IPA92_V20_TOTAL=5;\nconst IPA92_V21_TOTAL=5;\n",'provider total');
          p=mustReplace(p,"+IPA92_V20_TOTAL;\nconst MERGED_CATALOG_TOTAL","+IPA92_V20_TOTAL+IPA92_V21_TOTAL;\nconst MERGED_CATALOG_TOTAL",'provider extension total');
          p=mustReplace(p,"fetchJson(IPA92_V19_CATALOG_URL),fetchJson(IPA92_V20_CATALOG_URL)\n","fetchJson(IPA92_V19_CATALOG_URL),fetchJson(IPA92_V20_CATALOG_URL),fetchJson(IPA92_V21_CATALOG_URL)\n",'provider fetch list');
          p=mustReplace(p,"]).then(([base,legacy,v7,v8,v9,v10,v11,v12,v13,v14,v15,v16,v17,v18,v19,v20])=>{","]).then(([base,legacy,v7,v8,v9,v10,v11,v12,v13,v14,v15,v16,v17,v18,v19,v20,v21])=>{",'provider destructure');
          p=mustReplace(p,"        ['v20',v20,IPA92_V20_CATALOG_VERSION,IPA92_V20_CONTENT_VERSION,IPA92_V20_TOTAL,'ipa92-original-v20']\n      ];","        ['v20',v20,IPA92_V20_CATALOG_VERSION,IPA92_V20_CONTENT_VERSION,IPA92_V20_TOTAL,'ipa92-original-v20'],\n        ['v21',v21,IPA92_V21_CATALOG_VERSION,IPA92_V21_CONTENT_VERSION,IPA92_V21_TOTAL,'ipa92-original-v21']\n      ];",'provider entries');
          p=mustReplace(p,"...v19.items,...v20.items];","...v19.items,...v20.items,...v21.items];",'provider items');
          p=mustReplace(p,"IPA92_V19_CONTENT_VERSION,IPA92_V20_CONTENT_VERSION]),","IPA92_V19_CONTENT_VERSION,IPA92_V20_CONTENT_VERSION,IPA92_V21_CONTENT_VERSION]),",'provider versions');
          p=p.replaceAll('ipa92-catalog-v1-v20','ipa92-catalog-v1-v21').replaceAll('ipa92-questions-v1-v20','ipa92-questions-v1-v21');
          p=mustReplace(p,"version:'v376-provider-17-ipa92-v1-v20'","version:'v376-provider-18-ipa92-v1-v21'",'provider api version');
          fs.writeFileSync('assets/protected-content-provider-v376-v21.js',p);

          // Public config: install only public-safe v21 metadata and point all readiness aliases at latest provider.
          let c=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const meta=`  const IPA92_V21_METADATA=Object.freeze([\n    {"id":"ipa92_a_digital_twin_cps_001","sourcePool":"subject_a","cat":"経営戦略","difficulty":"standard","concept":"デジタルツインとCPS","coreTopicId":"core_19_04","qualityAudit":"ipa92-original-v21"},\n    {"id":"ipa92_a_smart_contract_001","sourcePool":"subject_a","cat":"経営戦略","difficulty":"standard","concept":"スマートコントラクト","coreTopicId":"core_19_03","qualityAudit":"ipa92-original-v21"},\n    {"id":"ipa92_a_ekyc_001","sourcePool":"subject_a","cat":"経営戦略","difficulty":"standard","concept":"eKYC","coreTopicId":"core_19_01","qualityAudit":"ipa92-original-v21"},\n    {"id":"ipa92_a_cbdc_001","sourcePool":"subject_a","cat":"経営戦略","difficulty":"standard","concept":"CBDC","coreTopicId":"core_19_01","qualityAudit":"ipa92-original-v21"},\n    {"id":"ipa92_a_nft_001","sourcePool":"subject_a","cat":"経営戦略","difficulty":"standard","concept":"NFT","coreTopicId":"core_19_03","qualityAudit":"ipa92-original-v21"}\n  ].map(item=>Object.freeze(item)));\n\n`;
          c=mustReplace(c,'  function installMetadata(items,label,expectedTotal){',meta+'  function installMetadata(items,label,expectedTotal){','config metadata');
          c=mustReplace(c,"  function installV20Metadata(){return installMetadata(IPA92_V20_METADATA,'v20',5)}\n","  function installV20Metadata(){return installMetadata(IPA92_V20_METADATA,'v20',5)}\n  function installV21Metadata(){return installMetadata(IPA92_V21_METADATA,'v21',5)}\n",'config installer');
          c=mustReplace(c,'    const v20Install=installV20Metadata();\n','    const v20Install=installV20Metadata();\n    const v21Install=installV21Metadata();\n','config install call');
          c=mustReplace(c,'    root.FEQUEST_IPA92_V20_SUBJECT_A_METADATA_INSTALL=v20Install;\n','    root.FEQUEST_IPA92_V20_SUBJECT_A_METADATA_INSTALL=v20Install;\n    root.FEQUEST_IPA92_V21_SUBJECT_A_METADATA_INSTALL=v21Install;\n','config install root');
          c=mustReplace(c,"    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-17-ipa92-v1-v20'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1099;","    const providerOk=root.FEQUEST_PROTECTED_CONTENT?.version==='v376-provider-18-ipa92-v1-v21'&&root.FEQUEST_PROTECTED_CONTENT?.catalogTotal===1104;",'config provider contract');
          c=mustReplace(c,'&&v19Install.ok&&v20Install.ok;','&&v19Install.ok&&v20Install.ok&&v21Install.ok;','config ok');
          c=mustReplace(c,'v19:v19Install,v20:v20Install});','v19:v19Install,v20:v20Install,v21:v21Install});','config return');
          c=mustReplace(c,'  function activateV20Provider(){','  function activateV21Provider(){','config activate name');
          c=c.replaceAll("v376-provider-17-ipa92-v1-v20","v376-provider-18-ipa92-v1-v21");
          c=mustReplace(c,"    const id='fequest-ipa92-v20-provider';","    const id='fequest-ipa92-v21-provider';",'config script id');
          c=mustReplace(c,"      script.src='./assets/protected-content-provider-v376-v20.js';","      script.src='./assets/protected-content-provider-v376-v21.js';",'config src');
          c=mustReplace(c,'  root.FEQUEST_IPA92_V20_SUBJECT_A_METADATA=IPA92_V20_METADATA;\n','  root.FEQUEST_IPA92_V20_SUBJECT_A_METADATA=IPA92_V20_METADATA;\n  root.FEQUEST_IPA92_V21_SUBJECT_A_METADATA=IPA92_V21_METADATA;\n','config metadata root');
          c=mustReplace(c,'  const latestProviderReady=activateV20Provider();','  const latestProviderReady=activateV21Provider();','config latest activate');
          c=mustReplace(c,'  root.FEQUEST_IPA92_V20_PROVIDER_READY=latestProviderReady;\n','  root.FEQUEST_IPA92_V21_PROVIDER_READY=latestProviderReady;\n  root.FEQUEST_IPA92_V20_PROVIDER_READY=latestProviderReady;\n','config latest ready');
          fs.writeFileSync('cloud/public-config-v342.js',c);

          // PWA cache.
          let sw=fs.readFileSync('sw.js','utf8');
          sw=mustReplace(sw,"const CACHE_NAME = 'fe-quest-v377-19';","const CACHE_NAME = 'fe-quest-v377-20';",'sw cache');
          sw=mustReplace(sw,'  "./assets/protected-content-provider-v376-v20.js",\n','  "./assets/protected-content-provider-v376-v20.js",\n  "./assets/protected-content-provider-v376-v21.js",\n','sw provider');
          sw=mustReplace(sw,'  "./assets/question-catalog-ipa92-v20.json",\n','  "./assets/question-catalog-ipa92-v20.json",\n  "./assets/question-catalog-ipa92-v21.json",\n','sw catalog');
          fs.writeFileSync('sw.js',sw);

          // Release evidence (no protected bodies).
          fs.writeFileSync('.github/IPA92_V21_ACTIVATION_2026-09-14.md',`# FE QUEST — IPA Ver.9.2 v21 public activation — 2026-09-14\n\n## Scope\n\nThis activation publishes only safe metadata/runtime contracts for the protected v21 digital-business batch. Protected stems, options, answers, explanations, hints and lesson bodies remain private.\n\n## Verified protected production evidence\n\n- private source merge commit: \`6f5d4991262f0d70baf150546a03cd98c2bb859d\`\n- automatic dispatcher run: \`34803853907\` — success\n- automatic unified protected import run: \`34803860430\` — success\n- content version: \`ipa92-questions-v21\`\n- v21 active questions: **5**\n- v21 staging rows after finalization: **0**\n- active protected question total after import: **1104**\n- active protected lesson total: **130**\n- v21 payload SHA-256: \`aa359621288e7420865246a1d3fabcecc6d35f63ef0a9ad9e70d8dbc10676953\`\n- latest lesson payload SHA-256: \`ee0370824bd667133fc04751f708db1d7b67d3051224db8d9c14f7724b0ca139\`\n- lesson database content version remains \`v376-lessons-1\`\n\n## Semantic decisions\n\nFive original application/comparison questions cover six targets: digital twin/CPS, smart contract, eKYC, CBDC and NFT. Digital twin and CPS are intentionally paired to distinguish a virtual counterpart from cyber/physical sensing-computation-control integration. NFT metadata and protected explanations do not imply that token ownership automatically transfers copyright or every legal right. eKYC is distinguished from routine login/access authentication.\n\n## Public runtime target\n\n- provider: \`v376-provider-18-ipa92-v1-v21\`\n- merged protected catalog total: **1104**\n- extension safe metadata total: **200**\n- merged Subject-A count: **910**\n- tracked Subject-A count: **919**\n- PWA cache: \`fe-quest-v377-20\`\n`);

          // Historical v20 validator staged outside workflows.
          fs.mkdirSync('.github/generated',{recursive:true});
          fs.writeFileSync('.github/generated/validate-ipa92-question-v20-public.yml',`name: Validate IPA 9.2 question v20 historical artifacts\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v20.js'\n      - 'assets/question-catalog-ipa92-v20.json'\n      - '.github/IPA92_V20_ACTIVATION_2026-09-14.md'\n      - '.github/workflows/validate-ipa92-question-v20-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v20-history:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate immutable v20 artifacts\n        run: |\n          node --check assets/protected-content-provider-v376-v20.js\n          node -e \"const c=require('./assets/question-catalog-ipa92-v20.json');if(c.version!=='ipa92-catalog-v20'||c.contentVersion!=='ipa92-questions-v20'||c.items?.length!==5)process.exit(1)\"\n          grep -Fq \"version:'v376-provider-17-ipa92-v1-v20'\" assets/protected-content-provider-v376-v20.js\n          grep -Fq 'active protected question total after import: **1099**' .github/IPA92_V20_ACTIVATION_2026-09-14.md\n`);

          fs.writeFileSync('.github/generated/validate-ipa92-question-v21-public.yml',`name: Validate IPA 9.2 question v21 public activation\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - 'assets/protected-content-provider-v376-v21.js'\n      - 'assets/question-catalog-ipa92-v21.json'\n      - 'cloud/public-config-v342.js'\n      - 'sw.js'\n      - '.github/IPA92_V21_ACTIVATION_2026-09-14.md'\n      - '.github/workflows/validate-ipa92-question-v21-public.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  validate-v21-public:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v6\n      - name: Validate JavaScript syntax\n        run: |\n          node --check assets/protected-content-provider-v376-v21.js\n          node --check cloud/public-config-v342.js\n          node --check sw.js\n      - name: Validate v21 safe catalog and provider\n        run: |\n          node <<'CHECK'\n          const fs=require('node:fs'),vm=require('node:vm');const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v21.json','utf8'));const ids=['ipa92_a_digital_twin_cps_001','ipa92_a_smart_contract_001','ipa92_a_ekyc_001','ipa92_a_cbdc_001','ipa92_a_nft_001'];const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);if(c.version!=='ipa92-catalog-v21'||c.contentVersion!=='ipa92-questions-v21'||JSON.stringify(c.contentVersions)!==JSON.stringify(['ipa92-questions-v21'])||c.counts?.subjectA!==5||c.counts?.catalogQuestions!==5||c.items?.length!==5||JSON.stringify(c.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v21 catalog contract');for(const item of c.items){if(item.sourcePool!=='subject_a'||item.cat!=='経営戦略'||!['core_19_01','core_19_03','core_19_04'].includes(item.coreTopicId)||item.qualityAudit!=='ipa92-original-v21'||Object.keys(item).some(k=>protectedKeys.has(k)))throw new Error('v21 safe metadata')}const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));const versions={};for(let i=7;i<=21;i++)versions[i]=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v'+i+'.json','utf8'));const source=fs.readFileSync('assets/protected-content-provider-v376-v21.js','utf8');const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v21.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const s=String(url);let data=base;if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;else for(let i=7;i<=21;i++)if(s.endsWith('question-catalog-ipa92-v'+i+'.json'))data=versions[i];return {ok:true,status:200,json:async()=>data}},window:{}};vm.createContext(ctx);vm.runInContext(source,ctx);(async()=>{const api=ctx.window.FEQUEST_PROTECTED_CONTENT;if(api?.version!=='v376-provider-18-ipa92-v1-v21'||api.catalogTotal!==1104)throw new Error('provider contract');const m=await api.loadCatalog();if(m.items.length!==1104||m.counts?.subjectA!==910||m.counts?.trackedSubjectA!==919||m.counts?.catalogQuestions!==1104)throw new Error('merged counts');const expected=Array.from({length:21},(_,i)=>'ipa92-questions-v'+(i+1));if(JSON.stringify(m.extensionContentVersions)!==JSON.stringify(expected)||new Set(m.items.map(x=>x.id)).size!==1104)throw new Error('versions/ids');console.log('PASS provider 1104')})().catch(e=>{console.error(e);process.exitCode=1});\n          CHECK\n      - name: Validate runtime metadata and release evidence\n        run: |\n          node <<'CHECK'\n          const fs=require('node:fs'),vm=require('node:vm');const source=fs.readFileSync('cloud/public-config-v342.js','utf8');const bank=Array.from({length:83},(_,i)=>({id:'legacy_'+i}));const listeners={};const script={id:'',src:'',async:true,addEventListener(t,f){listeners[t]=f}};let ctx;const document={getElementById(){return null},createElement(){return script},head:{appendChild(n){if(n.src!=='./assets/protected-content-provider-v376-v21.js')throw new Error('provider src');ctx.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-18-ipa92-v1-v21',catalogTotal:1104};listeners.load()}}};ctx={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-17-ipa92-v1-v20',catalogTotal:1099}};vm.createContext(ctx);vm.runInContext('const QUESTION_BANK='+JSON.stringify(bank)+';\\n'+source+'\\nglobalThis.__BANK__=QUESTION_BANK;',ctx);(async()=>{const r=await ctx.FEQUEST_IPA92_V21_PROVIDER_READY;if(!r?.ok||ctx.__BANK__.length!==200||ctx.FEQUEST_IPA92_V21_SUBJECT_A_METADATA?.length!==5)throw new Error('runtime metadata');for(let i=7;i<=20;i++)if(ctx['FEQUEST_IPA92_V'+i+'_PROVIDER_READY']!==ctx.FEQUEST_IPA92_V21_PROVIDER_READY)throw new Error('alias '+i);console.log('PASS runtime metadata 200')})().catch(e=>{console.error(e);process.exitCode=1});\n          CHECK\n          grep -Fq '\"./assets/protected-content-provider-v376-v21.js\"' sw.js\n          grep -Fq '\"./assets/question-catalog-ipa92-v21.json\"' sw.js\n          grep -Fq \"const CACHE_NAME = 'fe-quest-v377-20';\" sw.js\n          grep -Fq 'active protected question total after import: **1104**' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n          grep -Fq '6f5d4991262f0d70baf150546a03cd98c2bb859d' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n          grep -Fq 'aa359621288e7420865246a1d3fabcecc6d35f63ef0a9ad9e70d8dbc10676953' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n          grep -Fq '34803853907' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n          grep -Fq '34803860430' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n          grep -Fq 'v376-lessons-1' .github/IPA92_V21_ACTIVATION_2026-09-14.md\n`);

          // Publication/Pages guards: add latest safe assets and cache marker.
          for(const pair of [['.github/workflows/validate-publication.yml','.github/generated/validate-publication.yml'],['.github/workflows/deploy-pages.yml','.github/generated/deploy-pages.yml']]){
            let s=fs.readFileSync(pair[0],'utf8');
            s=s.replaceAll("const CACHE_NAME = 'fe-quest-v377-19';","const CACHE_NAME = 'fe-quest-v377-20';");
            s=s.replaceAll("const CACHE_NAME = \'fe-quest-v377-19\';","const CACHE_NAME = \'fe-quest-v377-20\';");
            s=s.replaceAll('protected-content-provider-v376-v20.js\n','protected-content-provider-v376-v20.js\n          node --check assets/protected-content-provider-v376-v21.js\n');
            s=s.replaceAll('protected-content-provider-v376-v20.js"\n','protected-content-provider-v376-v20.js"\n          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js"\n');
            s=s.replaceAll('question-catalog-ipa92-v20.json"\n','question-catalog-ipa92-v20.json"\n          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v21.json"\n');
            // deploy workflow may use explicit rsync/test paths outside RUNNER_TEMP syntax; append v21 after exact v20 lines generically when absent.
            if(!s.includes('protected-content-provider-v376-v21.js'))s=s.replace(/^(\s*.*protected-content-provider-v376-v20\.js.*)$/m,'$1\n$1'.replace('v20.js','v21.js'));
            if(!s.includes('question-catalog-ipa92-v21.json'))s=s.replace(/^(\s*.*question-catalog-ipa92-v20\.json.*)$/m,'$1\n$1'.replace('v20.json','v21.json'));
            fs.writeFileSync(pair[1],s);
          }
          NODE
      - name: Commit generated non-workflow and staged workflow files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/protected-content-provider-v376-v21.js cloud/public-config-v342.js sw.js .github/IPA92_V21_ACTIVATION_2026-09-14.md .github/generated
          git commit -m 'Generate IPA 9.2 v21 public activation assets'
          git push origin HEAD:ipa92-v21-public-activation-20260914
