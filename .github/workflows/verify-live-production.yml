name: Verify deployed FE QUEST v376 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-production.yml'

permissions:
  contents: read

jobs:
  live-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://taiwanwan64.github.io/fe-quest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow temporary access row provisioning and Pages propagation
        run: sleep 35
      - name: Verify actually deployed files match clean deploy repository
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/deployed"
          mkdir -p "$TMP"
          while IFS= read -r file; do
            case "$file" in
              .github/*) continue ;;
            esac
            mkdir -p "$TMP/$(dirname "$file")"
            curl --fail --silent --show-error --location --retry 4 \
              -H 'Cache-Control: no-cache' \
              "$BASE_URL/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
            cmp --silent "$file" "$TMP/$file" || { echo "deployed byte drift: $file" >&2; exit 1; }
          done < <(git ls-files)
          grep -Fq "const APP_VERSION = 'v376';" "$TMP/assets/app-v376.js"
          ! grep -Fq "const APP_VERSION = 'v375';" "$TMP/assets/app-v376.js"
          grep -Fq "const APP_VERSION = 'v376';" "$TMP/sw.js"
          grep -Fq "const CACHE_NAME = 'fe-quest-v376-1';" "$TMP/sw.js"
          grep -Fq "redirectTo:'https://taiwanwan64.github.io/fe-quest/'" "$TMP/cloud/public-config-v342.js"
          ! grep -RIl --exclude='*.png' -E 'fequest_lesson_bank_private|fequest_question_bank_private|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' "$TMP"
      - name: Validate deployed safe catalog
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=process.env.RUNNER_TEMP+'/deployed/assets/question-catalog-v376.json';
          const catalog=JSON.parse(fs.readFileSync(path,'utf8'));
          if(catalog.version!=='v376-catalog-1'||!Array.isArray(catalog.items)||catalog.items.length!==904)throw new Error('deployed catalog inventory mismatch');
          const forbidden=new Set(['q','stem','question','options','opts','a','answer','answerIndex','correctIndex','correctText','exp','explain','explanation','choiceExps','choiceExplanations']);
          function walk(value,trail=[]){
            if(Array.isArray(value)){value.forEach((v,i)=>walk(v,[...trail,String(i)]));return;}
            if(!value||typeof value!=='object')return;
            for(const [k,v] of Object.entries(value)){
              if(forbidden.has(k))throw new Error(`protected payload key in deployed catalog: ${[...trail,k].join('.')}`);
              walk(v,[...trail,k]);
            }
          }
          walk(catalog);
          console.log('PASS deployed safe catalog: 904 metadata-only records');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run final live browser journey with real protected services
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const BASE=process.env.BASE_URL;
          const accessCode=`final-live-${process.env.GITHUB_SHA}`;
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          let stage='boot';
          (async()=>{
            const browser=await chromium.launch();
            const context=await browser.newContext({viewport:{width:390,height:844},locale:'ja-JP'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e?.stack||e)));
            const waitBoot=()=>page.waitForFunction(()=>globalThis.FEQUEST_APP_BOOT_COMPLETE===true&&globalThis.studyInstalledV373===true&&!!globalThis.FEQUEST_PROTECTED_CONTENT&&!!globalThis.FEQUEST_PROTECTED_LESSONS,null,{timeout:20000});
            try{
              stage='load';
              await page.goto(`${BASE}/?live=${Date.now()}`,{waitUntil:'load',timeout:30000});
              await waitBoot();

              stage='service-worker';
              let ready=false;
              for(let attempt=0;attempt<4&&!ready;attempt++){
                try{
                  await page.waitForLoadState('load',{timeout:10000});
                  await waitBoot();
                  ready=await page.evaluate(async()=>{await navigator.serviceWorker.ready;return true;});
                }catch(e){
                  if(!String(e).includes('Execution context was destroyed'))throw e;
                  await page.waitForTimeout(500);
                }
              }
              assert(ready,'service worker did not stabilize');
              await page.waitForTimeout(750);
              await page.reload({waitUntil:'load',timeout:30000});
              await waitBoot();
              const checks=await page.evaluate(async()=>{
                const reg=await navigator.serviceWorker.ready;
                const worker=navigator.serviceWorker.controller||reg.active;
                if(!worker)throw new Error('service worker not active');
                const version=await new Promise((resolve,reject)=>{
                  const timer=setTimeout(()=>reject(new Error('service worker version timeout')),5000);
                  const handler=e=>{if(e.data?.type==='APP_VERSION'){clearTimeout(timer);navigator.serviceWorker.removeEventListener('message',handler);resolve(e.data.version);}};
                  navigator.serviceWorker.addEventListener('message',handler);
                  worker.postMessage({type:'GET_VERSION'});
                });
                return {version,redirect:globalThis.FEQUEST_PUBLIC_CLOUD_CONFIG_V342?.redirectTo||'',selfCheck:typeof globalThis.runV376SelfCheck==='function'};
              });
              assert(checks.version==='v376',`service worker version mismatch: ${checks.version}`);
              assert(checks.redirect==='https://taiwanwan64.github.io/fe-quest/',`auth redirect mismatch: ${checks.redirect}`);
              assert(checks.selfCheck,'v376 self-check adapter missing');
              const mismatchNotice=await page.locator('#appNotice.show #appNoticeTitle').filter({hasText:'アプリ更新が必要です'}).count();
              assert(mismatchNotice===0,'app/service-worker version mismatch notice appeared');
              await page.evaluate(code=>{
                globalThis.FEQUEST_PROTECTED_CONTENT.setAccessCode(code,{rememberForTab:true});
                globalThis.FEQUEST_PROTECTED_LESSONS.setAccessCode(code,{rememberForTab:true});
              },accessCode);

              stage='diagnostic';
              await page.locator('#firstRunAccountSkipV364').click();
              await page.locator('#firstV373Minutes').waitFor({state:'visible',timeout:10000});
              await page.locator('#firstV373Minutes').fill('10');
              await page.locator('#firstRunSettingsContinueV364').click();
              await page.locator('#diagBegin').click();
              for(let i=0;i<12;i++){
                await page.locator('#diagOptions .diag-option').first().click();
                await page.locator('#diagNext').click();
              }
              await page.waitForSelector('#diagResult',{state:'visible',timeout:20000});

              stage='plan-home';
              await page.locator('#diagFinish').click();
              await page.waitForSelector('#diagnosticPlanV373',{state:'visible',timeout:10000});
              await page.reload({waitUntil:'load',timeout:30000});
              await waitBoot();
              await page.waitForSelector('#confirmPlanV373',{state:'visible',timeout:10000});
              await page.locator('#confirmPlanV373').click();
              await page.waitForSelector('#home.active #todayPlan',{state:'visible',timeout:10000});

              stage='protected-lesson';
              const before=await page.evaluate(()=>{
                const rec=getDailyRecord(),task=ensureTodayPlanSnapshot().find(item=>!dailyTaskDone(rec,item));
                if(!task)throw new Error('today plan has no unfinished task');
                task.lane='lesson';task.questionLimit=0;
                profile.settings.resumeReadingV373={id:'core_01_01',scroll:0};
                if(!persistProfileSilently())throw new Error('could not save lesson resume fixture');
                renderDailyPlan();
                return {xp:profile.xp,progress:profile.lessonProgress?.core_01_01||0};
              });
              await page.locator('#todayResumeBtn').click();
              await page.waitForSelector('#lesson.active',{state:'visible',timeout:15000});
              const opened=await page.evaluate(()=>({lesson:activeLesson,active:!!globalThis.studyActiveV373,html:document.querySelector('#lesson')?.innerHTML||''}));
              assert(opened.lesson==='core_01_01'&&opened.active,'real protected lesson did not open');
              assert(opened.html.length>500,'protected lesson body was not rendered');

              stage='pause-reload-resume';
              await page.evaluate(()=>{globalThis.studyActiveV373.seconds=20;pauseStudyBlockV373();});
              assert(await page.locator('#home.active').isVisible(),'pause did not return to home');
              await page.reload({waitUntil:'load',timeout:30000});
              await waitBoot();
              await page.locator('#todayResumeBtn').click();
              await page.waitForSelector('#lesson.active',{state:'visible',timeout:15000});
              const resumed=await page.evaluate(()=>({seconds:globalThis.studyActiveV373?.seconds||0,progress:profile.lessonProgress?.core_01_01||0,xp:profile.xp}));
              assert(resumed.seconds>=20,'elapsed study time was not restored');
              assert(resumed.progress===before.progress&&resumed.xp===before.xp,'resume mutated completion or XP');

              stage='offline-reconnect';
              await context.setOffline(true);
              await page.reload({waitUntil:'domcontentloaded',timeout:15000}).catch(()=>{});
              await page.waitForTimeout(1000);
              assert((await page.locator('body').count())===1,'offline service-worker shell unavailable');
              await context.setOffline(false);
              await page.reload({waitUntil:'load',timeout:30000});
              await waitBoot();

              assert(errors.length===0,`page errors: ${errors.join(' | ')}`);
              console.log('PASS final production: deployed bytes + v376 SW + final auth redirect + real diagnostic/grading + bounded lesson + pause/reload + offline/reconnect');
            }finally{
              await browser.close();
            }
          })().catch(e=>{console.error(`stage=${stage}; ${e?.stack||e}`);process.exitCode=1;});
          NODE
