name: FE QUEST v126 explanation-depth release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v126-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v126
        run: |
          git apply --check tools/v125_to_v126.patch
          git apply tools/v125_to_v126.patch

      - name: Verify v126
        run: |
          python3 - <<'PY'
          import re, pathlib, json
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate HTML IDs'
          assert "const APP_VERSION = 'v126';" in s
          assert 'CORE_A_DEPTH_SUPPLEMENTS' in s
          assert "new Set(['core_20_05','core_16_02'])" in s
          json.load(open('manifest.webmanifest'))
          PY
          node --check /tmp/app.js
          node --check sw.js
          grep -q '"name": "FE QUEST v126"' manifest.webmanifest
          grep -q "fe-quest-v126-1" sw.js

      - name: Commit v126
        run: |
          rm -f tools/v125_to_v126.patch .github/workflows/v126-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release FE QUEST v126 explanation depth audit"
          git push
