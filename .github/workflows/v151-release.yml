name: Validate FE QUEST v151

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v151-release.yml'

permissions:
  contents: read
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v151.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v151' index.html
          grep -q "APP_VERSION = 'v151'" sw.js
          grep -q "CACHE_NAME = 'fe-quest-v151-1'" sw.js
          grep -q 'FE QUEST v151' manifest.webmanifest
          grep -q '{% capture v151block %}' index.html
          grep -q 'runV151SelfCheck()' index.html
          grep -q 'V151_RELEASE_SENTINEL_SPEC' app/v151-block-00.txt
          grep -q "architecture:'v151-full-ci-sentinel-declarative-contract'" app/v151-block-00.txt
          grep -q 'runV151ReleaseSentinelAudit' app/v151-block-00.txt
          cp app/v151-block-00.txt /tmp/v151-check.js
          node --check /tmp/v151-check.js
          python -m py_compile tools/v151_validate.py

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA and release contracts
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v151</title>' _site/index.html
          grep -q "const APP_VERSION = 'v151';" _site/index.html
          grep -q 'runV151SelfCheck' _site/index.html
          grep -q "APP_VERSION = 'v151'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v151-1'" _site/sw.js
          python -m json.tool _site/manifest.webmanifest >/dev/null
          python tools/v151_validate.py
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v151.zip .)

      - name: Upload standalone v151 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v151
          path: FE_QUEST_PWA_v151.zip
          retention-days: 90
