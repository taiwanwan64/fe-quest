name: FE QUEST v179 direct stable diagnostic archive inventory validation

on:
  push:
    branches: [v179-staging]

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v179 direct stable archive inventory
        run: python3 tools/v179_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build v179 direct-stable candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare counterfactual compact-boundary reference
        run: python3 tools/v179_prepare_reference.py

      - name: Build v179 compact-boundary reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate FE QUEST v179 direct stable archive inventory
        run: python3 tools/v179_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V179_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Direct FE QUEST v179 diagnostics to stable archive inventory"
            git push origin HEAD:v179-staging
          fi
          echo "FEQUEST_V179_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "FEQUEST_V179_VALIDATION_TREE=$(git rev-parse HEAD^{tree})"

      - name: Package FE QUEST v179
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v179.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          wc -c FE_QUEST_PWA_v179.zip
          sha256sum FE_QUEST_PWA_v179.zip
          sha256sum _site/index.html _site/manifest.webmanifest _site/sw.js _site/icon-192.png _site/icon-512.png _site/apple-touch-icon.png

      - name: Upload FE QUEST v179
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v179-standalone
          path: FE_QUEST_PWA_v179.zip
          if-no-files-found: error
          retention-days: 90
