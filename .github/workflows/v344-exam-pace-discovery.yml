name: FE QUEST v344 exam pace discovery

on:
  push:
    branches: ['v344-exam-pace-discovery']
    paths:
      - '.github/v344/discover_exam_pace.py'
      - '.github/workflows/v344-exam-pace-discovery.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.github/v344/discover_exam_pace.py'
      - '.github/workflows/v344-exam-pace-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'push' || github.head_ref == 'v344-exam-pace-discovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Discover existing exam pace signals
        run: python3 .github/v344/discover_exam_pace.py
