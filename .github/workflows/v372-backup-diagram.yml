name: FE QUEST v372 backup diagram
on:
  pull_request:
    branches: ['main']
    paths: ['.github/v372/**','.github/workflows/v372-*.yml','audits/V372_BACKUP_DIAGRAM.md','FE_QUEST_DEVELOPMENT_PLAN.md','index.html','manifest.webmanifest','sw.js','app/base-shell-v372.html','app/backup-diagram-v372.js','app/backup-diagram-v372.css','assets/app-v372.css','assets/app-v372.js','assets/asset-manifest-v372.json']
permissions: {contents: read}
jobs:
  validate-v372-backup-diagram:
    if: github.head_ref == 'v372-backup-diagram'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restrict learner-facing change
        run: |
          git diff --name-only origin/main...HEAD | python -c '
          import re,sys
          paths=sys.stdin.read().splitlines()
          allowed=r"^(\.github/v372/.*|\.github/workflows/v372-(backup-diagram|materialize-backup-diagram)\.yml|audits/V372_BACKUP_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v372\.html|app/backup-diagram-v372\.(js|css)|assets/app-v372\.(js|css)|assets/asset-manifest-v372\.json)$"
          unexpected=[p for p in paths if not re.fullmatch(allowed,p)]
          assert not unexpected,unexpected
          print("PASS bounded v372 file set:",len(paths))'
      - run: python .github/v372/validate_backup_diagram.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - run: node .github/v372/browser_backup_diagram.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v372-backup-diagram-evidence, path: _browser_evidence/v372/, if-no-files-found: warn, retention-days: 14}
