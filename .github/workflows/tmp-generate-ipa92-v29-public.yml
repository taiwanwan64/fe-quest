name: One-shot generate IPA 9.2 v29 public activation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/tmp-generate-v29-public.cjs'
      - '.github/workflows/tmp-generate-ipa92-v29-public.yml'

permissions:
  contents: write

jobs:
  generate-v29-public:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ipa92-v29-public-activation-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v29 public activation artifacts
        run: node .github/tmp-generate-v29-public.cjs
      - name: Stage generated workflow files outside workflow directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/generated-v29
          cp .github/workflows/validate-ipa92-question-v28-public.yml .github/generated-v29/validate-ipa92-question-v28-public.yml
          cp .github/workflows/validate-ipa92-question-v29-public.yml .github/generated-v29/validate-ipa92-question-v29-public.yml
          cp .github/workflows/validate-publication.yml .github/generated-v29/validate-publication.yml
          cp .github/workflows/deploy-pages.yml .github/generated-v29/deploy-pages.yml
          git checkout -- .github/workflows/validate-ipa92-question-v28-public.yml .github/workflows/validate-publication.yml .github/workflows/deploy-pages.yml
          rm .github/workflows/validate-ipa92-question-v29-public.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/protected-content-provider-v376-v29.js cloud/public-config-v342.js sw.js .github/generated-v29
          git commit -m 'Generate IPA 9.2 v29 public activation artifacts'
          git push origin HEAD:${GITHUB_HEAD_REF}
