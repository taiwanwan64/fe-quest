name: One-shot generate IPA 9.2 v29 public activation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/tmp-generate-v29-public.cjs'
      - '.github/workflows/tmp-generate-ipa92-v29-public.yml'

permissions:
  contents: write

jobs:
  generate-v29-public:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ipa92-v29-public-activation-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v29 public activation artifacts
        run: node .github/tmp-generate-v29-public.cjs
      - name: Commit generated artifacts and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp-generate-v29-public.cjs
          rm .github/workflows/tmp-generate-ipa92-v29-public.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Generate IPA 9.2 v29 public activation'
          git push origin HEAD:${GITHUB_HEAD_REF}
