name: Generate IPA 9.2 v18 activation

on:
  push:
    branches:
      - ipa92-v18-public-activation-20260914
    paths:
      - '.github/workflows/generate-ipa92-v18.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v18 activation files
        run: node .github/tools/generate-ipa92-v18.cjs
      - name: Commit generated non-workflow and staged workflow files
        env:
          BRANCH: ipa92-v18-public-activation-20260914
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/question-catalog-ipa92-v18.json assets/protected-content-provider-v376-v18.js cloud/public-config-v342.js sw.js .github/IPA92_V18_ACTIVATION_2026-09-14.md .github/generated
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate IPA 9.2 v18 public activation assets'
          git push origin "HEAD:${BRANCH}"
