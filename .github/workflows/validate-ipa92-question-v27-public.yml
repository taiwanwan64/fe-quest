name: Validate IPA 9.2 question v27 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v27.js'
      - 'assets/question-catalog-ipa92-v27.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V27_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v27-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v27-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v27.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v27 safe public contract
        run: |
          node <<'CHECK'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v27.json','utf8'));
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v27.js','utf8');
          const config=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          const ids=['ipa92_a_linear_algebra_001','ipa92_a_sequences_001','ipa92_a_interpolation_001','ipa92_a_dynamic_programming_001','ipa92_a_hash_search_001'];
          if(catalog.version!=='ipa92-catalog-v27'||catalog.contentVersion!=='ipa92-questions-v27'||catalog.items?.length!==5)throw new Error('v27 catalog contract');
          if(catalog.counts?.subjectA!==5||catalog.counts?.catalogQuestions!==5)throw new Error('v27 catalog counts');
          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v27 catalog ids');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v27'||typeof item.cat!=='string'||typeof item.concept!=='string'||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||'')))throw new Error('invalid v27 safe metadata');
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');
          }
          if(!provider.includes("version:'v376-provider-24-ipa92-v1-v27'")||!provider.includes('const IPA92_V27_TOTAL=5;')||!provider.includes("const IPA92_V27_CONTENT_VERSION='ipa92-questions-v27';"))throw new Error('v27 provider contract');
          if(!provider.includes('catalogTotal:MERGED_CATALOG_TOTAL'))throw new Error('v27 provider total contract');
          if(!config.includes('const IPA92_V27_METADATA=Object.freeze([')||!config.includes('activateV27Provider()')||!config.includes('catalogTotal===1134'))throw new Error('v27 public config contract');
          if(!sw.includes('"./assets/protected-content-provider-v376-v27.js"')||!sw.includes('"./assets/question-catalog-ipa92-v27.json"'))throw new Error('v27 service worker assets');
          if(!sw.includes("const CACHE_NAME = 'fe-quest-v377-24';"))throw new Error('unexpected cache identity');
          console.log('PASS v27 public contract: 5 safe metadata items, merged production total 1134');
          CHECK
      - name: Validate production evidence marker
        run: |
          grep -Fq 'active protected question total after import: **1134**' .github/IPA92_V27_ACTIVATION_2026-09-15.md
          grep -Fq 'bf095fe13d3e65733d14f76edccdd1dcdc60fe60' .github/IPA92_V27_ACTIVATION_2026-09-15.md
          grep -Fq '9b7a7571f3945b26eef6151ee0b21ca001aa0ad4d8d7612964438173d54dad99' .github/IPA92_V27_ACTIVATION_2026-09-15.md
          grep -Fq '34905638998' .github/IPA92_V27_ACTIVATION_2026-09-15.md
          grep -Fq '34905639101' .github/IPA92_V27_ACTIVATION_2026-09-15.md
          grep -Fq '34905862177' .github/IPA92_V27_ACTIVATION_2026-09-15.md
          grep -Fq 'v376-lessons-7-ipa92' .github/IPA92_V27_ACTIVATION_2026-09-15.md
