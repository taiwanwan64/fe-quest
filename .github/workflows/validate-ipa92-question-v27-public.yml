name: Validate IPA 9.2 question v27 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v27.js'
      - 'assets/question-catalog-ipa92-v27.json'
      - '.github/IPA92_V27_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v27-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v27-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v27 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v27.js
          node -e "const c=require('./assets/question-catalog-ipa92-v27.json');if(c.version!=='ipa92-catalog-v27'||c.contentVersion!=='ipa92-questions-v27'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-24-ipa92-v1-v27'" assets/protected-content-provider-v376-v27.js
          grep -Fq 'active protected question total after import: **1134**' .github/IPA92_V27_ACTIVATION_2026-09-15.md
