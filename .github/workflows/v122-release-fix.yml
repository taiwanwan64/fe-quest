name: FE QUEST v122 release fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v122-release-fix.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v122 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,shutil
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>FE QUEST PWA v121</title>','<title>FE QUEST PWA v122</title>',1)
          s=s.replace("const APP_VERSION = 'v121';","const APP_VERSION = 'v122';",1)
          s=s.replace("APP_VERSION==='v121'","APP_VERSION==='v122'",1).replace("'v121 version/schema contract drift'","'v122 version/schema contract drift'",1)
          s=re.sub(r'\.quiz-explain\.show\{[^}]*\}', '.quiz-explain.show{display:flow-root;height:auto!important;min-height:0!important;align-self:flex-start}', s, count=1)
          if '.quiz-explain h3:empty,.quiz-explanation:empty,.quiz-hint:empty{display:none}' not in s:
              s=s.replace('  .quiz-explain h3{margin-bottom:7px}\n','  .quiz-explain h3{margin-bottom:7px}\n  .quiz-explain h3:empty,.quiz-explanation:empty,.quiz-hint:empty{display:none}\n',1)
          s=re.sub(r'(\.quiz-hint\{\s*)margin-top:10px;color:var\(--muted\);font-size:14px;(\s*\})', r'\1margin-top:10px;color:var(--muted);font-size:14px;height:auto;min-height:0;\2', s, count=1)
          if '.quiz-explain > *:last-child{margin-bottom:0}' not in s:
              pos=s.find('  .reason-box{')
              if pos!=-1:
                  s=s[:pos]+'  .quiz-explain > *:last-child{margin-bottom:0}\n'+s[pos:]
          needle="quizExplain.classList.remove('show');"
          if "quizExplain.style.height='auto';" not in s and needle in s:
              s=s.replace(needle,needle+"\n  quizExplain.style.height='auto';\n  quizExplain.style.minHeight='0';",1)
          s=s.replace("(q||ch===focusChapter)?'open':''","q?'open':''",1)
          helper=Path('tools/v122_polite_helper.js').read_text(encoding='utf-8')+'\n'
          marker='function coreTopicArticleView(id){'
          if 'function politeCoreProse(text)' not in s and marker in s:
              s=s.replace(marker,helper+marker,1)
          s=s.replace('${learningHtml(beginner)}','${politeCoreHtml(beginner)}',1)
          s=s.replace('${learningHtml(e.deep)}','${politeCoreHtml(e.deep)}',1)
          s=s.replace('${e.extra.map(x=>`<li>${learningHtml(x)}</li>`).join(\'\')}','${e.extra.map(x=>`<li>${politeCoreHtml(x)}</li>`).join(\'\')}',1)
          s=s.replace('${learningHtml(t.example)}','${politeCoreHtml(t.example)}',1)
          s=s.replace('${learningHtml(CORE_A_CAUTION_GUIDES[id]||t.pitfall)}','${politeCoreHtml(CORE_A_CAUTION_GUIDES[id]||t.pitfall)}',1)
          if 'v122 Core A chapters must not auto-expand' not in s:
              marker2="    assert(document.querySelector('header #aiFab.ai-header-btn'),'v115 BIT先生 must live in the top-right header');\n"
              addition="    assert(!String(renderCoreCourseMap).includes(\"ch===focusChapter)?'open'\"),'v122 Core A chapters must not auto-expand the first incomplete chapter');\n    assert(politeCoreProse('CPU性能はクロック周波数だけでは決まらない。').endsWith('決まりません。'),'v122 Core A polite prose normalization missing');\n"
              if marker2 in s:
                  s=s.replace(marker2,marker2+addition,1)
          p.write_text(s,encoding='utf-8')
          m=Path('manifest.webmanifest')
          manifest=json.loads(m.read_text(encoding='utf-8'))
          manifest['name']='FE QUEST v122'
          manifest['description']='基本情報技術者試験向けPWA。v122ではヒント・確認ポイント欄を内容に応じた高さへ整理し、科目Aコアコースの章を初期状態ですべて閉じるよう変更。科目A教材の解説・補足・仕組み・注意などの説明文を表示時にです・ます調へ統一。v121までの問題集中UI、スマホ横スクロール対策、CTA配置、問題・教材データを維持。'
          m.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          sws=re.sub(r"const APP_VERSION = 'v\d+';","const APP_VERSION = 'v122';",sws,count=1)
          sws=re.sub(r"const CACHE_NAME = 'fe-quest-v\d+-1';","const CACHE_NAME = 'fe-quest-v122-1';",sws,count=1)
          sw.write_text(sws,encoding='utf-8')
          Path('audits').mkdir(exist_ok=True)
          shutil.copyfile('tools/v122_audit.txt','audits/CORE_A_LAYOUT_AND_TONE_AUDIT_v122.txt')
          PY

      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>FE QUEST PWA v122</title>' in s
          assert "const APP_VERSION = 'v122';" in s
          assert "(q||ch===focusChapter)?'open':''" not in s
          assert '.quiz-explain.show{display:flow-root;height:auto!important;min-height:0!important;align-self:flex-start}' in s
          assert 'function politeCoreProse(text)' in s
          assert '${politeCoreHtml(e.deep)}' in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/feq-v122-main.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))['name']=='FE QUEST v122'
          PY
          node --check /tmp/feq-v122-main.js
          node --check sw.js

      - name: Commit release
        shell: bash
        run: |
          rm -f .github/workflows/v122-layout-tone.yml .github/workflows/v122-release-fix.yml
          rm -f tools/v121_to_v122.patch tools/v122_polite_helper.js tools/v122_audit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release FE QUEST v122 layout and tone polish'
          git push
