name: Validate FE QUEST v140

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v140-validate.yml'

permissions:
  contents: write
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          rm -rf _site FE_QUEST_PWA_v140.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v140' index.html
          grep -q "APP_VERSION = 'v140'" sw.js
          grep -q 'FE QUEST v140' manifest.webmanifest
          grep -q '{% capture v140block %}' index.html
          grep -q "SUBJECT_A_V140_IDS.length!==16" app/v140-block-00.txt
          grep -q "v140-near-duplicate-pass" app/v140-block-00.txt
          cp app/v140-block-00.txt /tmp/v140-check.js
          node --check /tmp/v140-check.js

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v140</title>' _site/index.html
          grep -q "const APP_VERSION = 'v140';" _site/index.html
          grep -q 'v140-near-duplicate-pass' _site/index.html
          grep -q "APP_VERSION = 'v140'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v140-1'" _site/sw.js
          grep -q "v140 applied count drift" _site/index.html
          python -m json.tool _site/manifest.webmanifest >/dev/null
          python - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('_site/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          js='\n'.join(s for s in scripts if s.strip() and not s.lstrip().startswith('{'))
          pathlib.Path('/tmp/fe-v140-inline.js').write_text(js)
          subprocess.run(['node','--check','/tmp/fe-v140-inline.js'],check=True)
          PY
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v140.zip .)

      - name: Upload standalone v140 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v140
          path: FE_QUEST_PWA_v140.zip
          retention-days: 90

      - name: Finalize release and clean generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/v140-validate.yml
          rm -rf _site FE_QUEST_PWA_v139.zip FE_QUEST_PWA_v140.zip
          git add -A
          git commit -m 'Finalize FE QUEST v140 release'
          git push origin HEAD:main
