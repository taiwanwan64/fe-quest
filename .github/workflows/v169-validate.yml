name: FE QUEST v169 equivalence preflight validation

on:
  push:
    branches: [v169-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v169-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v169 equivalence preflight
        run: python3 tools/v169_materialize.py

      - name: Refine v169 syntactic-unit plan
        run: python3 tools/v169_refine.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Execute counterfactual equivalence harness
        run: python3 tools/v169_equivalence.py

      - name: Patch validator for refined plan
        run: python3 tools/v169_patch_validator.py

      - name: Validate FE QUEST v169
        run: python3 tools/v169_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V169_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST v169 refined equivalence preflight"
            git push origin HEAD:v169-staging
          fi
          echo "FEQUEST_V169_VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Package FE QUEST v169
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v169.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum FE_QUEST_PWA_v169.zip

      - name: Upload FE QUEST v169
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v169-standalone
          path: FE_QUEST_PWA_v169.zip
          if-no-files-found: error
          retention-days: 90
