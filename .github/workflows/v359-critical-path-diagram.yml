name: FE QUEST v359 critical path diagram

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v359/**'
      - '.github/workflows/v359-critical-path-diagram.yml'
      - '.github/workflows/v359-materialize-critical-path-diagram.yml'
      - 'audits/V359_CRITICAL_PATH_DIAGRAM.md'
      - 'FE_QUEST_DEVELOPMENT_PLAN.md'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/base-shell-v359.html'
      - 'app/critical-path-diagram-v359.js'
      - 'app/critical-path-diagram-v359.css'
      - 'assets/app-v359.css'
      - 'assets/app-v359.js'
      - 'assets/asset-manifest-v359.json'

permissions:
  contents: read

jobs:
  validate-v359-critical-path-diagram:
    if: startsWith(github.head_ref, 'v359-critical-path-diagram')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restrict the learner-facing change
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(\.github/v359/.*|\.github/workflows/v359-critical-path-diagram\.yml|\.github/workflows/v359-materialize-critical-path-diagram\.yml|audits/V359_CRITICAL_PATH_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v359\.html|app/critical-path-diagram-v359\.js|app/critical-path-diagram-v359\.css|assets/app-v359\.css|assets/app-v359\.js|assets/asset-manifest-v359\.json)$' | grep -q .; then
            echo 'Unexpected file in the v359 critical path release' >&2
            exit 1
          fi
          test -z "$(git diff --name-only origin/main...HEAD -- app/base-shell-v358.html assets/app-v358.css assets/app-v358.js assets/asset-manifest-v358.json cloud/)"
      - name: Validate static release and data boundaries
        run: python .github/v359/validate_critical_path_diagram.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate responsive critical path diagram
        run: python .github/v359/browser_critical_path_diagram.py
      - name: Upload critical path diagram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v359-critical-path-diagram-evidence
          path: _browser_evidence/v359/
          if-no-files-found: warn
          retention-days: 14
