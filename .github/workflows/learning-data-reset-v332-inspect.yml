name: FE QUEST v332 reset contract inspect

on:
  push:
    branches: ['learning-data-reset-v332']
    paths:
      - '.github/learning-data-reset-v332/**'
      - '.github/workflows/learning-data-reset-v332-inspect.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.github/learning-data-reset-v332/**'
      - '.github/workflows/learning-data-reset-v332-inspect.yml'

permissions:
  contents: read
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Materialize v332 shell
        run: GITHUB_REF_NAME='v332-staging' python3 .github/release/release_materialize.py
      - uses: actions/configure-pages@v5
      - name: Build candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: false
      - name: Inspect reset contracts
        run: python3 .github/learning-data-reset-v332/inspect.py
