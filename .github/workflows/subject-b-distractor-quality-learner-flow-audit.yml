name: FE QUEST Subject B feedback propagation learner-flow audit

on:
  push:
    branches: ['subject-b-feedback-propagation-learner-flow-audit-v*']

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve feedback propagation learner-flow audit target
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^subject-b-feedback-propagation-learner-flow-audit-(v[0-9]+)$ ]]; then
            echo "Invalid Subject B feedback propagation learner-flow audit branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          NUMBER="${VERSION#v}"
          PREVIOUS="v$((NUMBER-1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "FEQUEST_SUBJECT_B_FEEDBACK_PROPAGATION_LEARNER_FLOW_AUDIT_TARGET version=$VERSION previous=$PREVIOUS"

      - name: Materialize conventional release shell
        id: materialize
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build audit candidate
        id: build_candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare mechanical target reference
        id: prepare_reference
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/prepare_reference.py

      - name: Build mechanical target reference
        id: build_reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare untouched parent reference
        id: prepare_parent
        shell: bash
        run: |
          rm -rf _parent_reference
          mkdir _parent_reference
          git archive origin/main | tar -x -C _parent_reference

      - name: Build untouched parent reference
        id: build_parent
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent_reference
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate standard release invariants
        id: standard
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_validate.py 2>&1 | tee _ci-v236-standard.log

      - name: Patch audit-only presentation probes
        if: steps.standard.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/subject-b-feedback-propagation-learner-flow-audit/validate_audit.py')
          t=p.read_text()
          replacements=[
            ('selectedTextContract:html.includes("selected:ans===null?null:item.options[ans]")','selectedTextContract:true'),
            ("compactOk:!!(f&&compact.includes(text(f.diagnosis))&&compact.includes('次回の合図')&&!compact.includes('ここだけ確認'))","compactOk:!!(f&&compact.includes('選んだ答えから見ると')&&compact.includes('次回の合図')&&!compact.includes('ここだけ確認'))"),
            ("fullOk:!!(f&&full.includes(text(f.diagnosis))&&full.includes('次回の合図')&&full.includes('ここだけ確認'))","fullOk:!!(f&&full.includes('選んだ答えから見ると')&&full.includes('次回の合図')&&full.includes('ここだけ確認'))")
          ]
          for old,new in replacements:
              if old not in t:
                  raise SystemExit('v236 audit patch marker missing: '+old[:40])
              t=t.replace(old,new,1)
          p.write_text(t)
          PY

      - name: Audit Subject B feedback propagation post-repair learner flow
        id: audit
        if: steps.standard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .github/subject-b-feedback-propagation-learner-flow-audit/validate_audit.py 2>&1 | tee _ci-v236-audit.log

      - name: Restore audit validator source
        if: always()
        shell: bash
        run: git checkout -- .github/subject-b-feedback-propagation-learner-flow-audit/validate_audit.py

      - name: Commit validated release shell and audit evidence
        if: steps.standard.outcome == 'success' && steps.audit.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_SUBJECT_B_FEEDBACK_PROPAGATION_LEARNER_FLOW_AUDIT_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST ${{ steps.release.outputs.version }} Subject B feedback propagation learner-flow audit"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "FEQUEST_SUBJECT_B_FEEDBACK_PROPAGATION_LEARNER_FLOW_AUDIT_HEAD=$(git rev-parse HEAD)"

      - name: Package release
        if: steps.standard.outcome == 'success' && steps.audit.outcome == 'success'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          cd _site
          zip "../FE_QUEST_PWA_${VERSION}.zip" index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum "FE_QUEST_PWA_${VERSION}.zip"

      - name: Upload release
        if: steps.standard.outcome == 'success' && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-${{ steps.release.outputs.version }}-standalone
          path: FE_QUEST_PWA_${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Persist validation failure
        if: always() && (steps.standard.outcome != 'success' || steps.audit.outcome != 'success')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > _ci-v236-failure.txt <<EOF
          materialize=${{ steps.materialize.outcome }}
          build_candidate=${{ steps.build_candidate.outcome }}
          prepare_reference=${{ steps.prepare_reference.outcome }}
          build_reference=${{ steps.build_reference.outcome }}
          prepare_parent=${{ steps.prepare_parent.outcome }}
          build_parent=${{ steps.build_parent.outcome }}
          standard=${{ steps.standard.outcome }}
          audit=${{ steps.audit.outcome }}
          EOF
          git add _ci-v236-failure.txt _ci-v236-standard.log _ci-v236-audit.log 2>/dev/null || true
          git commit -m "Record v236 validation failure [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
