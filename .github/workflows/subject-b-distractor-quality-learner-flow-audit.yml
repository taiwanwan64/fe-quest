name: FE QUEST Subject B repeated-session diversity audit

on:
  push:
    branches: ['subject-b-feedback-propagation-learner-flow-audit-v*']

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve repeated-session diversity audit target
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^subject-b-feedback-propagation-learner-flow-audit-(v[0-9]+)$ ]]; then
            echo "Invalid Subject B repeated-session diversity audit branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          NUMBER="${VERSION#v}"
          PREVIOUS="v$((NUMBER-1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "FEQUEST_SUBJECT_B_REPEATED_SESSION_DIVERSITY_AUDIT_TARGET version=$VERSION previous=$PREVIOUS"

      - name: Materialize conventional release shell
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build audit candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare mechanical target reference
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/prepare_reference.py

      - name: Build mechanical target reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare untouched parent reference
        shell: bash
        run: |
          rm -rf _parent_reference
          mkdir _parent_reference
          git archive origin/main | tar -x -C _parent_reference

      - name: Build untouched parent reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent_reference
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate standard release invariants
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_validate.py

      - name: Patch validator branch alias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/subject-b-repeated-session-diversity-audit/validate_audit.py')
          t=p.read_text()
          old="m=re.fullmatch(r'subject-b-repeated-session-diversity-audit-(v(\\d+))',branch)"
          new="m=re.fullmatch(r'subject-b-feedback-propagation-learner-flow-audit-(v(\\d+))',branch)"
          if old not in t:
              raise SystemExit('v237 branch alias patch marker missing')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Audit repeated-session diversity and coverage
        run: python3 .github/subject-b-repeated-session-diversity-audit/validate_audit.py

      - name: Restore validator source
        if: always()
        run: git checkout -- .github/subject-b-repeated-session-diversity-audit/validate_audit.py

      - name: Commit validated release shell and audit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_SUBJECT_B_REPEATED_SESSION_DIVERSITY_AUDIT_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Materialize FE QUEST ${{ steps.release.outputs.version }} Subject B repeated-session diversity audit"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "FEQUEST_SUBJECT_B_REPEATED_SESSION_DIVERSITY_AUDIT_HEAD=$(git rev-parse HEAD)"

      - name: Package release
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          cd _site
          zip "../FE_QUEST_PWA_${VERSION}.zip" index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum "FE_QUEST_PWA_${VERSION}.zip"

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-${{ steps.release.outputs.version }}-standalone
          path: FE_QUEST_PWA_${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90
