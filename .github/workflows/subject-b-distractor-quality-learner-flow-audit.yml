name: FE QUEST Subject B repeated-session diversity audit

on:
  push:
    branches: ['subject-b-repeated-session-diversity-audit-v*']

permissions:
  contents: write
  pages: read

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve repeated-session diversity audit target
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^subject-b-repeated-session-diversity-audit-(v[0-9]+)$ ]]; then
            echo "Invalid Subject B repeated-session diversity audit branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          NUMBER="${VERSION#v}"
          PREVIOUS="v$((NUMBER-1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Materialize conventional release shell
        id: materialize
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build audit candidate
        id: build_candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare mechanical target reference
        id: prepare_reference
        shell: bash
        run: GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/prepare_reference.py

      - name: Build mechanical target reference
        id: build_reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_reference
          destination: ./_site_reference
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Prepare untouched parent reference
        id: prepare_parent
        shell: bash
        run: |
          rm -rf _parent_reference
          mkdir _parent_reference
          git archive origin/main | tar -x -C _parent_reference

      - name: Build untouched parent reference
        id: build_parent
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_parent_reference
          destination: ./_site_parent
          build_revision: ${{ github.sha }}
          verbose: true

      - name: Validate standard release invariants
        id: standard
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          GITHUB_REF_NAME="${{ steps.release.outputs.version }}-staging" python3 .github/release/release_validate.py 2>&1 | tee _ci-v238-standard.log

      - name: Patch audit-only source contract
        if: steps.standard.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/subject-b-repeated-session-diversity-audit/validate_audit.py')
          t=p.read_text()
          old="expected={'.github/subject-b-repeated-session-diversity-audit/validate_audit.py'}"
          new="expected={'.github/subject-b-repeated-session-diversity-audit/validate_audit.py','.github/workflows/subject-b-distractor-quality-learner-flow-audit.yml'}"
          if old not in t:
              raise SystemExit('v238 source-contract patch marker missing')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Diagnose final security rotation
        id: audit
        if: steps.standard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .github/subject-b-repeated-session-diversity-audit/validate_audit.py 2>&1 | tee _ci-v238-audit.log

      - name: Restore validator source
        if: always()
        run: git checkout -- .github/subject-b-repeated-session-diversity-audit/validate_audit.py

      - name: Commit validated release shell and audit evidence
        if: steps.standard.outcome == 'success' && steps.audit.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _regression audits index.html manifest.webmanifest sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Materialize FE QUEST ${{ steps.release.outputs.version }} Subject B security rotation diagnosis audit"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Persist validation failure
        if: always() && (steps.standard.outcome != 'success' || steps.audit.outcome != 'success')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > _ci-v238-failure.txt <<EOF
          materialize=${{ steps.materialize.outcome }}
          build_candidate=${{ steps.build_candidate.outcome }}
          prepare_reference=${{ steps.prepare_reference.outcome }}
          build_reference=${{ steps.build_reference.outcome }}
          prepare_parent=${{ steps.prepare_parent.outcome }}
          build_parent=${{ steps.build_parent.outcome }}
          standard=${{ steps.standard.outcome }}
          audit=${{ steps.audit.outcome }}
          EOF
          git add _ci-v238-failure.txt _ci-v238-standard.log _ci-v238-audit.log 2>/dev/null || true
          git commit -m "Record v238 validation failure [skip ci]" || true
          git push origin HEAD:"$GITHUB_REF_NAME" || true

      - name: Package release
        if: steps.standard.outcome == 'success' && steps.audit.outcome == 'success'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          cd _site
          zip "../FE_QUEST_PWA_${VERSION}.zip" index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          sha256sum "FE_QUEST_PWA_${VERSION}.zip"

      - name: Upload release
        if: steps.standard.outcome == 'success' && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-${{ steps.release.outputs.version }}-standalone
          path: FE_QUEST_PWA_${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90
