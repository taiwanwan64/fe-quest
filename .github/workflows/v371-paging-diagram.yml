name: FE QUEST v371 paging diagram
on:
  pull_request:
    branches: ['main']
    paths: ['.github/v371/**','.github/workflows/v371-*.yml','audits/V371_PAGING_DIAGRAM.md','FE_QUEST_DEVELOPMENT_PLAN.md','index.html','manifest.webmanifest','sw.js','app/base-shell-v371.html','app/paging-diagram-v371.js','app/paging-diagram-v371.css','assets/app-v371.css','assets/app-v371.js','assets/asset-manifest-v371.json']
permissions: {contents: read}
jobs:
  validate-v371-paging-diagram:
    if: github.head_ref == 'v371-paging-diagram'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restrict learner-facing change
        run: |
          git diff --name-only origin/main...HEAD | python -c '
          import re,sys
          paths=sys.stdin.read().splitlines()
          allowed=r"^(\.github/v371/.*|\.github/workflows/v371-(paging-diagram|materialize-paging-diagram)\.yml|audits/V371_PAGING_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v371\.html|app/paging-diagram-v371\.(js|css)|assets/app-v371\.(js|css)|assets/asset-manifest-v371\.json)$"
          unexpected=[p for p in paths if not re.fullmatch(allowed,p)]
          assert not unexpected,unexpected
          print("PASS bounded v371 file set:",len(paths))'
      - run: python .github/v371/validate_paging_diagram.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - run: node .github/v371/browser_paging_diagram.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v371-paging-diagram-evidence, path: _browser_evidence/v371/, if-no-files-found: warn, retention-days: 14}
