name: FE QUEST v176 stable release adapter validation

on:
  push:
    branches: [v176-staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: fe-quest-v176-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v176 stable release adapter
        run: python3 tools/v176_materialize.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build stable-adapter candidate
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Prepare versioned-adapter reference
        run: python3 tools/v176_prepare_reference.py

      - name: Build versioned-adapter reference
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_v176_reference_src
          destination: ./_site_reference

      - name: Validate FE QUEST v176 stable release adapter
        run: python3 tools/v176_validate.py

      - name: Commit validated materialized source and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app _regression audits index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "FEQUEST_V176_SOURCE_ALREADY_COMMITTED"
          else
            git commit -m "Stabilize FE QUEST v176 release adapter boundary"
            git push origin HEAD:v176-staging
          fi
          echo "FEQUEST_V176_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "FEQUEST_V176_VALIDATION_TREE=$(git rev-parse HEAD^{tree})"

      - name: Package FE QUEST v176
        run: |
          cd _site
          zip ../FE_QUEST_PWA_v176.zip index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png
          cd ..
          wc -c FE_QUEST_PWA_v176.zip
          sha256sum FE_QUEST_PWA_v176.zip
          sha256sum _site/index.html _site/manifest.webmanifest _site/sw.js _site/icon-192.png _site/icon-512.png _site/apple-touch-icon.png

      - name: Upload FE QUEST v176
        uses: actions/upload-artifact@v4
        with:
          name: fe-quest-v176-standalone
          path: FE_QUEST_PWA_v176.zip
          if-no-files-found: error
          retention-days: 90
