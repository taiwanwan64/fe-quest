name: FE QUEST v131 answer-cue release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v131-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild release script
        run: |
          cat tools/v131_payload.part0 tools/v131_payload.part1 tools/v131_payload.part2 tools/v131_payload.part3 > /tmp/v131.b64
          echo 'f74c690f291341f8e4ae64620f07d0e5a4e311efd32c3494c02609515f58e00e  /tmp/v131.b64' | sha256sum -c -
          base64 -d /tmp/v131.b64 | gzip -d > /tmp/release_v131.py
          echo '6dde74d5e47da7af408a4894a2020a54d0645f51c5c167e1157a027eb3129d1d  /tmp/release_v131.py' | sha256sum -c -
      - name: Apply v131
        run: python3 /tmp/release_v131.py
      - name: Verify v131
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          assert "const APP_VERSION = 'v131';" in s
          assert 'const PROFILE_SCHEMA_VERSION = 5;' in s
          assert 'SUBJECT_A_V131_ANSWER_CUE_OVERRIDE_IDS.length===23' in s
          assert json.loads(Path('manifest.webmanifest').read_text())['name']=='FE QUEST v131'
          a=Path('audits/SUBJECT_A_ANSWER_CUE_UNIQUENESS_AUDIT_v131.txt').read_text()
          assert '23問' in a and '0問' in a
          PY2
          node --check /tmp/app.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
      - name: Commit v131
        run: |
          rm -rf tools
          rm -f .github/workflows/v131-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release FE QUEST v131 answer-cue uniqueness audit'
          git push
