name: Validate IPA 9.2 question v14 public activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v14-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication candidate
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v14.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v14 public-safe catalog
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v14.json','utf8'));
          const expectedIds=['ipa92_a_pmo_001','ipa92_a_wbs_dictionary_001','ipa92_a_cocomo_001','ipa92_a_ccb_001'];
          const expectedTopics=['core_14_01','core_14_02','core_14_04','core_14_07'];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v14'||catalog.contentVersion!=='ipa92-questions-v14')throw new Error('v14 catalog version mismatch');
          if(JSON.stringify(catalog.contentVersions)!==JSON.stringify(['ipa92-questions-v14']))throw new Error('v14 contentVersions mismatch');
          if(catalog.counts?.subjectA!==4||catalog.counts?.catalogQuestions!==4)throw new Error('v14 counts mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==4)throw new Error('v14 item count mismatch');
          const ids=catalog.items.map(item=>item.id);
          if(JSON.stringify(ids)!==JSON.stringify(expectedIds))throw new Error('v14 IDs/order mismatch');
          if(new Set(ids).size!==4)throw new Error('v14 duplicate IDs');
          catalog.items.forEach((item,index)=>{
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v14')throw new Error(`v14 metadata contract mismatch: ${item.id}`);
            if(item.cat!=='マネジメント'||typeof item.concept!=='string'||item.coreTopicId!==expectedTopics[index])throw new Error(`v14 unsafe/incomplete metadata: ${item.id}`);
            const leaked=Object.keys(item).find(key=>protectedKeys.has(key));
            if(leaked)throw new Error(`protected field leaked: ${item.id}:${leaked}`);
          });
          console.log('PASS v14 safe catalog: 4 items');
          NODE
      - name: Validate protected provider merges to 1073
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));
          const legacy=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));
          const versions={};
          for(let i=7;i<=14;i++)versions[i]=JSON.parse(fs.readFileSync(`assets/question-catalog-ipa92-v${i}.json`,'utf8'));
          const source=fs.readFileSync('assets/protected-content-provider-v376-v14.js','utf8');
          const context={
            console,setTimeout,clearTimeout,URL,AbortController,
            document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v14.js'},baseURI:'https://example.test/'},
            sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},
            fetch:async url=>{
              const s=String(url);let data=base;
              if(s.endsWith('question-catalog-ipa92-v1-v6.json'))data=legacy;
              else for(let i=7;i<=14;i++)if(s.endsWith(`question-catalog-ipa92-v${i}.json`))data=versions[i];
              return {ok:true,status:200,json:async()=>data};
            },
            window:{}
          };
          vm.createContext(context);
          vm.runInContext(source,context,{filename:'assets/protected-content-provider-v376-v14.js'});
          (async()=>{
            const api=context.window.FEQUEST_PROTECTED_CONTENT;
            if(api?.version!=='v376-provider-11-ipa92-v1-v14'||api.catalogTotal!==1073)throw new Error('v14 provider contract mismatch');
            const merged=await api.loadCatalog();
            if(merged.items.length!==1073)throw new Error(`merged total mismatch: ${merged.items.length}`);
            if(merged.counts?.subjectA!==879)throw new Error(`merged subjectA mismatch: ${merged.counts?.subjectA}`);
            if(merged.counts?.trackedSubjectA!==888)throw new Error(`merged trackedSubjectA mismatch: ${merged.counts?.trackedSubjectA}`);
            if(merged.counts?.catalogQuestions!==1073)throw new Error(`merged catalogQuestions mismatch: ${merged.counts?.catalogQuestions}`);
            const expectedVersions=Array.from({length:14},(_,i)=>`ipa92-questions-v${i+1}`);
            if(JSON.stringify(merged.extensionContentVersions)!==JSON.stringify(expectedVersions))throw new Error('merged content versions mismatch');
            const ids=merged.items.map(item=>item.id);
            if(new Set(ids).size!==1073)throw new Error('merged duplicate IDs');
            for(const item of versions[14].items)if(!ids.includes(item.id))throw new Error(`merged catalog missing ${item.id}`);
            console.log('PASS protected provider merged catalog: 1073');
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Validate v14 runtime metadata activation
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const source=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const legacyItems=Array.from({length:83},(_,i)=>({id:`legacy_${i}`}));
          const listeners={};
          const script={id:'',src:'',async:true,addEventListener(type,fn){listeners[type]=fn;}};
          const document={
            baseURI:'https://example.test/',getElementById(){return null;},
            createElement(tag){if(tag!=='script')throw new Error('unexpected element');return script;},
            head:{appendChild(node){
              if(node!==script||node.src!=='./assets/protected-content-provider-v376-v14.js')throw new Error(`unexpected v14 provider src: ${node.src}`);
              context.FEQUEST_PROTECTED_CONTENT={version:'v376-provider-11-ipa92-v1-v14',catalogTotal:1073};
              listeners.load();
            }}
          };
          const context={console,document,FEQUEST_PROTECTED_CONTENT:{version:'v376-provider-10-ipa92-v1-v13',catalogTotal:1069}};
          vm.createContext(context);
          vm.runInContext(`const QUESTION_BANK=${JSON.stringify(legacyItems)};\n${source}\nglobalThis.__BANK__=QUESTION_BANK;`,context,{filename:'cloud/public-config-v342.js'});
          (async()=>{
            const ready=await context.FEQUEST_IPA92_V14_PROVIDER_READY;
            if(!ready?.ok)throw new Error(`v14 provider activation failed: ${JSON.stringify(ready)}`);
            for(const name of ['FEQUEST_IPA92_V7_PROVIDER_READY','FEQUEST_IPA92_V8_PROVIDER_READY','FEQUEST_IPA92_V9_PROVIDER_READY','FEQUEST_IPA92_V10_PROVIDER_READY','FEQUEST_IPA92_V11_PROVIDER_READY','FEQUEST_IPA92_V12_PROVIDER_READY','FEQUEST_IPA92_V13_PROVIDER_READY'])if(context[name]!==context.FEQUEST_IPA92_V14_PROVIDER_READY)throw new Error(`${name} does not point at latest provider`);
            const bank=context.__BANK__;
            if(bank.length!==169)throw new Error(`runtime metadata total mismatch: ${bank.length}`);
            const sets=[
              ['v7',context.FEQUEST_IPA92_V7_SUBJECT_A_METADATA,16,context.FEQUEST_IPA92_V7_SUBJECT_A_METADATA_INSTALL],
              ['v8',context.FEQUEST_IPA92_V8_SUBJECT_A_METADATA,16,context.FEQUEST_IPA92_V8_SUBJECT_A_METADATA_INSTALL],
              ['v9',context.FEQUEST_IPA92_V9_SUBJECT_A_METADATA,12,context.FEQUEST_IPA92_V9_SUBJECT_A_METADATA_INSTALL],
              ['v10',context.FEQUEST_IPA92_V10_SUBJECT_A_METADATA,16,context.FEQUEST_IPA92_V10_SUBJECT_A_METADATA_INSTALL],
              ['v11',context.FEQUEST_IPA92_V11_SUBJECT_A_METADATA,8,context.FEQUEST_IPA92_V11_SUBJECT_A_METADATA_INSTALL],
              ['v12',context.FEQUEST_IPA92_V12_SUBJECT_A_METADATA,8,context.FEQUEST_IPA92_V12_SUBJECT_A_METADATA_INSTALL],
              ['v13',context.FEQUEST_IPA92_V13_SUBJECT_A_METADATA,6,context.FEQUEST_IPA92_V13_SUBJECT_A_METADATA_INSTALL],
              ['v14',context.FEQUEST_IPA92_V14_SUBJECT_A_METADATA,4,context.FEQUEST_IPA92_V14_SUBJECT_A_METADATA_INSTALL]
            ];
            for(const [label,items,count,install] of sets){
              if(!Array.isArray(items)||items.length!==count)throw new Error(`runtime ${label} metadata mismatch`);
              if(install?.ok!==true)throw new Error(`runtime ${label} metadata installer failed`);
              for(const item of items)if(!bank.some(q=>q.id===item.id))throw new Error(`runtime missing ${item.id}`);
            }
            console.log('PASS v14 runtime metadata activation: total=169');
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Validate service-worker publication assets
        run: |
          grep -Fq '"./assets/protected-content-provider-v376-v14.js"' sw.js
          grep -Fq '"./assets/question-catalog-ipa92-v14.json"' sw.js
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-13';" sw.js
          test -f assets/protected-content-provider-v376-v14.js
          test -f assets/question-catalog-ipa92-v14.json
      - name: Validate verified import checkpoint
        run: |
          grep -Fq 'active protected question total after import: **1073**' .github/IPA92_V14_ACTIVATION_2026-09-13.md
          grep -Fq '5e559865621fbc810b8d3e3abd1b1db9625e304e' .github/IPA92_V14_ACTIVATION_2026-09-13.md
          grep -Fq '97ae7336e982f4e6dace924c061556332d5a7a8ae3836a90d9b44f32d188669a' .github/IPA92_V14_ACTIVATION_2026-09-13.md
          grep -Fq '34752476889' .github/IPA92_V14_ACTIVATION_2026-09-13.md
          grep -Fq 'workflow attempt: **1**' .github/IPA92_V14_ACTIVATION_2026-09-13.md
