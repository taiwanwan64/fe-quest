name: FE QUEST v345 discover exam pace renderer
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['v345-exam-pace-presentation']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'v345-exam-pace-presentation' }}
      - run: python3 .github/v345/discover_exam_pace_renderer.py
