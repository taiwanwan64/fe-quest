name: FE QUEST one-shot v345 exam pace preparation
on:
  push:
    branches: ['v345-exam-pace-presentation']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v345-exam-pace-presentation
          fetch-depth: 0
      - name: Prepare v345 release transform
        run: python3 .github/v345/prepare_exam_pace_release.py
      - name: Verify transform source
        shell: bash
        run: |
          python3 -m py_compile .github/release/split_release_common.py
          grep -F "V345_EXAM_PACE_SOURCE='app/exam-pace-v345.js'" .github/release/split_release_common.py
          grep -F "if version=='v345':" .github/release/split_release_common.py
      - name: Commit prepared release tooling and remove temporary discovery helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/v345/discover_exam_pace_renderer.py .github/workflows/v345-discover-exam-pace-renderer.yml .github/v345/prepare_exam_pace_release.py .github/workflows/v345-prepare-exam-pace.yml
          git add .github/release/split_release_common.py app/exam-pace-v345.js
          git commit -m 'Prepare v345 exam pace presentation release transform'
          git push origin HEAD:v345-exam-pace-presentation
