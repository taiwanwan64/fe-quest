name: FE QUEST v343 release continuity

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/release/split_release_common.py'
      - '.github/release/release_materialize_split.py'
      - '.github/release/release_validate_split.py'
      - '.github/release/validate_v343_continuity.py'
      - '.github/workflows/v343-release-continuity.yml'
      - '_regression/v343-release-continuity.fixture.json'
      - 'audits/V343_RELEASE_CONTINUITY.md'
      - 'cloud/**'
      - 'vendor/supabase/**'

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'post-v342-release-continuity-v343')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout continuity branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate v343 materialization inherits v342 production contracts
        run: python3 .github/release/validate_v343_continuity.py

      - name: Verify reproducible continuity evidence
        shell: bash
        run: |
          git diff --exit-code -- audits/V343_RELEASE_CONTINUITY.md _regression/v343-release-continuity.fixture.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          fx=json.loads(Path('_regression/v343-release-continuity.fixture.json').read_text())
          assert fx['result']=='PASS' and fx['caseCount']==26
          assert fx['target']=='v343' and fx['previous']=='v342'
          assert fx['cloudAssetCount']==15 and fx['productionVersion']=='v342'
          assert 'PASS — 26 / 26 V343 CONTINUITY CASES PASS' in Path('audits/V343_RELEASE_CONTINUITY.md').read_text()
          print('V343_RELEASE_CONTINUITY_REPRODUCIBLE')
          PY

      - name: Verify production root was not changed by the continuity work
        shell: bash
        run: |
          grep -F '{% include_relative app/base-shell-v342.html %}' index.html
          grep -F "const APP_VERSION = 'v342';" sw.js
          git diff --exit-code -- index.html sw.js app/base-shell-v342.html assets/app-v342.css assets/app-v342.js assets/asset-manifest-v342.json
