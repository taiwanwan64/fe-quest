name: FE QUEST v343 adaptive evidence discovery

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/v343/audit_adaptive_evidence.py'
      - '.github/workflows/v343-adaptive-evidence-discovery.yml'
      - 'assets/app-v342.js'

permissions:
  contents: read

jobs:
  audit:
    if: startsWith(github.head_ref, 'v343-adaptive-evidence-discovery')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v343 discovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Audit existing adaptive-learning evidence signals
        run: python3 .github/v343/audit_adaptive_evidence.py

      - name: Verify discovery does not modify production v342 files
        shell: bash
        run: |
          grep -F '{% include_relative app/base-shell-v342.html %}' index.html
          grep -F "const APP_VERSION = 'v342';" sw.js
          git diff --exit-code origin/main...HEAD -- index.html sw.js app/base-shell-v342.html assets/app-v342.css assets/app-v342.js assets/asset-manifest-v342.json
