name: Validate IPA 9.2 question v26 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v26.js'
      - 'assets/question-catalog-ipa92-v26.json'
      - '.github/IPA92_V26_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v26-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v26-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v26 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v26.js
          node -e "const c=require('./assets/question-catalog-ipa92-v26.json');if(c.version!=='ipa92-catalog-v26'||c.contentVersion!=='ipa92-questions-v26'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-23-ipa92-v1-v26'" assets/protected-content-provider-v376-v26.js
          grep -Fq 'active protected question total after import: **1129**' .github/IPA92_V26_ACTIVATION_2026-09-14.md
