name: Validate IPA 9.2 question v26 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v26.js'
      - 'assets/question-catalog-ipa92-v26.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V26_ACTIVATION_2026-09-14.md'
      - '.github/workflows/validate-ipa92-question-v26-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v26-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/protected-content-provider-v376-v26.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate v26 safe public contract
        run: |
          node <<'CHECK'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v26.json','utf8'));
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v26.js','utf8');
          const config=fs.readFileSync('cloud/public-config-v342.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          const ids=['ipa92_a_article36_agreement_001','ipa92_a_nda_001','ipa92_a_gpl_lgpl_001','ipa92_a_web_internet_standards_bodies_001','ipa92_a_jis_itu_iec_001'];
          if(catalog.version!=='ipa92-catalog-v26'||catalog.contentVersion!=='ipa92-questions-v26'||catalog.items?.length!==5)throw new Error('v26 catalog contract');
          if(catalog.counts?.subjectA!==5||catalog.counts?.catalogQuestions!==5)throw new Error('v26 catalog counts');
          if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v26 catalog ids');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v26'||typeof item.cat!=='string'||typeof item.concept!=='string'||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||'')))throw new Error('invalid v26 safe metadata');
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error('protected field leaked');
          }
          if(!provider.includes("version:'v376-provider-23-ipa92-v1-v26'")||!provider.includes('const IPA92_V26_TOTAL=5;')||!provider.includes("const IPA92_V26_CONTENT_VERSION='ipa92-questions-v26';"))throw new Error('v26 provider contract');
          if(!provider.includes('catalogTotal:MERGED_CATALOG_TOTAL'))throw new Error('v26 provider total contract');
          if(!config.includes('const IPA92_V26_METADATA=Object.freeze([')||!config.includes("activateV26Provider()")||!config.includes("catalogTotal===1129"))throw new Error('v26 public config contract');
          if(!sw.includes('"./assets/protected-content-provider-v376-v26.js"')||!sw.includes('"./assets/question-catalog-ipa92-v26.json"'))throw new Error('v26 service worker assets');
          if(!sw.includes("const CACHE_NAME = 'fe-quest-v377-24';"))throw new Error('unexpected cache identity');
          console.log('PASS v26 public contract: 5 safe metadata items, merged production total 1129');
          CHECK
      - name: Validate production evidence marker
        run: |
          grep -Fq 'active protected question total after import: **1129**' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq '7a6d6dfddf3f3902a78208aa112a2336d1c031e7' .github/IPA92_V26_ACTIVATION_2026-09-14.md
          grep -Fq 'f4b3f564c804c6561f4270d061a4684621eb594e44fc43661025c8875fe6a087' .github/IPA92_V26_ACTIVATION_2026-09-14.md
