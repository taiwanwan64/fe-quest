name: One-shot generate IPA 9.2 v31 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp-generate-v31-public.cjs'
      - '.github/workflows/tmp-generate-v31-public.yml'
      - 'assets/question-catalog-ipa92-v31.json'
      - '.github/IPA92_V31_ACTIVATION_2026-09-15.md'

permissions:
  contents: write

jobs:
  generate-v31-public:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v31 public activation artifacts
        run: node .github/tmp-generate-v31-public.cjs
      - name: Commit generated non-workflow artifacts and staged workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/protected-content-provider-v376-v31.js cloud/public-config-v342.js sw.js .github/generated-v31
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate IPA 9.2 v31 public activation artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
