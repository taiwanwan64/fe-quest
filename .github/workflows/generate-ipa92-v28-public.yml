name: Generate IPA 9.2 v28 public artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/v28/generate-public-v28.cjs'
      - '.github/workflows/generate-ipa92-v28-public.yml'
      - '.github/IPA92_V28_ACTIVATION_2026-09-15.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v28 public artifacts
        run: node .github/v28/generate-public-v28.cjs
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/question-catalog-ipa92-v28.json assets/protected-content-provider-v376-v28.js cloud/public-config-v342.js sw.js .github/generated-v28
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Generate IPA 9.2 v28 public artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
