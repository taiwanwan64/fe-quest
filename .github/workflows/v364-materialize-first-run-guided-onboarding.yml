name: Materialize FE QUEST v364 guided first run

on:
  push:
    branches: ['v364-first-run-guided-onboarding']
    paths:
      - 'app/first-run-guided-onboarding-v364.js'
      - '.github/v364/materialize_first_run_guided_onboarding.py'
      - '.github/workflows/v364-materialize-first-run-guided-onboarding.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v364-first-run-guided-onboarding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize versioned split release
        run: python .github/v364/materialize_first_run_guided_onboarding.py
      - name: Validate generated release
        run: python .github/v364/validate_first_run_guided_onboarding.py
      - name: Commit generated v364 assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js app/base-shell-v364.html assets/app-v364.css assets/app-v364.js assets/asset-manifest-v364.json
          if git diff --cached --quiet; then
            echo 'v364 assets already materialized'
            exit 0
          fi
          git commit -m 'Materialize FE QUEST v364 split release'
          git push origin HEAD:v364-first-run-guided-onboarding
