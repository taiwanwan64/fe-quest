name: Validate FE QUEST v141

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v141-validate.yml'

permissions:
  contents: write
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean validation workspace
        run: |
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v141.zip

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'FE QUEST PWA v141' index.html
          grep -q "APP_VERSION = 'v141'" sw.js
          grep -q "CACHE_NAME = 'fe-quest-v141-1'" sw.js
          grep -q 'FE QUEST v141' manifest.webmanifest
          grep -q '{% capture v141block %}' index.html
          grep -q 'v141-explanation-density-pass' app/v141-block-00.txt
          grep -q 'targetIds.length === 103' app/v141-block-00.txt
          grep -q 'changedChoices === 282' app/v141-block-00.txt
          grep -q 'beforeChars - afterChars === 14467' app/v141-block-00.txt
          ! grep -q 'genericBefore !== 413' app/v135-block-00.txt
          cp app/v141-block-00.txt /tmp/v141-check.js
          node --check /tmp/v141-check.js
          cp app/v135-block-00.txt /tmp/v135-check.js
          node --check /tmp/v135-check.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.index('{% capture runtimeGuard %}') < s.index('{% capture v132block %}')
          assert s.index('{{ runtimeGuard }}') < s.index('{{ v132block }}')
          assert "function assert(ok,msg)" in s
          assert "{{ v140block }}{{ v141block }}" in s
          PY

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate built PWA and runtime
        run: |
          set -euo pipefail
          grep -q '<title>FE QUEST PWA v141</title>' _site/index.html
          grep -q "const APP_VERSION = 'v141';" _site/index.html
          grep -q 'v141-explanation-density-pass' _site/index.html
          grep -q "APP_VERSION = 'v141'" _site/sw.js
          grep -q "CACHE_NAME = 'fe-quest-v141-1'" _site/sw.js
          python -m json.tool _site/manifest.webmanifest >/dev/null
          python - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('_site/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S|re.I)
          js='\n'.join(s for s in scripts if s.strip() and not s.lstrip().startswith('{'))
          pathlib.Path('/tmp/fe-v141-inline.js').write_text(js)
          subprocess.run(['node','--check','/tmp/fe-v141-inline.js'],check=True)

          stub=r'''
          const noop=()=>{};
          let dummy;
          const methods=new Set(['addEventListener','removeEventListener','appendChild','removeChild','replaceChildren','insertBefore','setAttribute','removeAttribute','focus','blur','click','scrollIntoView','select','setSelectionRange','dispatchEvent','showModal','close','play','pause']);
          const dummyHandler={
            get(t,p){
              if(p===Symbol.iterator)return function*(){};
              if(p==='length')return 0;
              if(p==='classList')return {add:noop,remove:noop,toggle:()=>false,contains:()=>false,replace:()=>false};
              if(p==='style')return {setProperty:noop,removeProperty:noop};
              if(p==='dataset')return {};
              if(p==='value')return '';
              if(p==='checked')return false;
              if(p==='disabled')return false;
              if(p==='innerHTML'||p==='textContent'||p==='innerText')return '';
              if(p==='getContext')return ()=>null;
              if(p==='getBoundingClientRect')return ()=>({top:0,left:0,right:0,bottom:0,width:0,height:0});
              if(p==='querySelectorAll')return ()=>[];
              if(p==='querySelector')return ()=>dummy();
              if(p==='closest')return ()=>null;
              if(p==='matches')return ()=>false;
              if(p==='contains')return ()=>false;
              if(methods.has(p))return noop;
              return Reflect.get(t,p) ?? noop;
            },
            set(t,p,v){t[p]=v;return true;}
          };
          dummy=()=>new Proxy({},dummyHandler);
          globalThis.document=new Proxy({
            readyState:'loading',body:dummy(),documentElement:dummy(),activeElement:null,
            querySelectorAll:()=>[],querySelector:()=>dummy(),getElementById:()=>dummy(),
            getElementsByClassName:()=>[],getElementsByTagName:()=>[],
            createElement:()=>dummy(),createTextNode:()=>dummy(),createDocumentFragment:()=>dummy(),
            addEventListener:noop,removeEventListener:noop
          },dummyHandler);
          globalThis.window=globalThis;
          globalThis.addEventListener=noop;
          globalThis.removeEventListener=noop;
          globalThis.scrollTo=noop;
          globalThis.scrollBy=noop;
          globalThis.location={href:'https://example.test/fe-quest/',origin:'https://example.test',pathname:'/fe-quest/',search:'',hash:'',assign:noop,replace:noop,reload:noop};
          globalThis.history={pushState:noop,replaceState:noop,back:noop,forward:noop,go:noop};
          const makeStorage=()=>{const m=new Map();return {getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>m.set(String(k),String(v)),removeItem:k=>m.delete(String(k)),clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size;}}};
          globalThis.localStorage=makeStorage();
          globalThis.sessionStorage=makeStorage();
          globalThis.navigator={userAgent:'node-runtime-smoke',language:'ja-JP',languages:['ja-JP'],onLine:true,clipboard:{writeText:async()=>{}},serviceWorker:{register:async()=>({}),addEventListener:noop,removeEventListener:noop,controller:null}};
          globalThis.matchMedia=()=>({matches:false,media:'',addEventListener:noop,removeEventListener:noop,addListener:noop,removeListener:noop});
          globalThis.getComputedStyle=()=>({getPropertyValue:()=>'',display:'block',visibility:'visible'});
          globalThis.requestAnimationFrame=()=>0;
          globalThis.cancelAnimationFrame=noop;
          globalThis.setInterval=()=>0;
          globalThis.clearInterval=noop;
          globalThis.setTimeout=(fn,ms)=>0;
          globalThis.clearTimeout=noop;
          globalThis.alert=noop;
          globalThis.confirm=()=>true;
          globalThis.prompt=()=>'';
          globalThis.fetch=async()=>({ok:true,status:200,type:'basic',json:async()=>({}),text:async()=>'',clone(){return this;}});
          globalThis.Notification=function(){};
          globalThis.Notification.permission='denied';
          globalThis.HTMLElement=class {};
          globalThis.Event=class {constructor(type,init={}){this.type=type;Object.assign(this,init);}};
          globalThis.CustomEvent=class extends globalThis.Event {constructor(type,init={}){super(type,init);this.detail=init.detail;}};
          globalThis.ResizeObserver=class {observe(){} unobserve(){} disconnect(){}};
          globalThis.IntersectionObserver=class {observe(){} unobserve(){} disconnect(){}};
          globalThis.CSS={escape:s=>String(s)};
          '''
          checks=r'''
          if(typeof QUESTION_BANK==='undefined') throw new Error('runtime smoke: QUESTION_BANK missing');
          if(QUESTION_BANK.length!==710) throw new Error(`runtime smoke: question count ${QUESTION_BANK.length}`);
          if(new Set(QUESTION_BANK.map(q=>q.id)).size!==710) throw new Error('runtime smoke: duplicate question id');
          const ans=[0,1,2,3].map(i=>QUESTION_BANK.filter(q=>q.a===i).length).join(',');
          if(ans!=='178,178,177,177') throw new Error(`runtime smoke: answer distribution ${ans}`);
          const cog=['想起','適用','判断'].map(k=>QUESTION_BANK.filter(q=>q.cognitiveLevel===k).length).join(',');
          if(cog!=='166,323,221') throw new Error(`runtime smoke: cognitive distribution ${cog}`);
          const a=globalThis.SUBJECT_A_V141_DENSITY_AUDIT;
          if(!a) throw new Error('runtime smoke: v141 audit stats missing');
          if(a.targetIds.length!==103||a.changedChoices!==282||a.removedChars!==14467) throw new Error(`runtime smoke: v141 stats ${JSON.stringify(a)}`);
          console.log('FEQUEST_RUNTIME_OK');
          '''
          pathlib.Path('/tmp/fe-v141-runtime.js').write_text(stub+'\n'+js+'\n'+checks)
          r=subprocess.run(['node','/tmp/fe-v141-runtime.js'],capture_output=True,text=True)
          print(r.stdout)
          print(r.stderr)
          if r.returncode!=0 or 'FEQUEST_RUNTIME_OK' not in r.stdout:
              raise SystemExit(r.returncode or 1)
          PY
          test -f _site/icon-192.png
          test -f _site/icon-512.png
          test -f _site/apple-touch-icon.png
          (cd _site && zip -qr ../FE_QUEST_PWA_v141.zip .)

      - name: Upload standalone v141 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FE_QUEST_PWA_v141
          path: FE_QUEST_PWA_v141.zip
          retention-days: 90

      - name: Finalize release and clean generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/v141-validate.yml
          sudo rm -rf _site
          rm -f FE_QUEST_PWA_v141.zip
          git add -A
          git commit -m 'Finalize FE QUEST v141 release'
          git push origin HEAD:main
