name: Validate IPA 9.2 question v35 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v35.js'
      - 'assets/question-catalog-ipa92-v35.json'
      - 'cloud/public-config-v342.js'
      - 'sw.js'
      - '.github/IPA92_V35_ACTIVATION_2026-09-16.md'
      - '.github/workflows/validate-ipa92-question-v35-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v35-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate syntax and safe metadata
        run: |
          node --check assets/protected-content-provider-v376-v35.js
          node --check cloud/public-config-v342.js
          node --check sw.js
          node <<'NODE'
          const fs=require('node:fs');const vm=require('node:vm');const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v35.json','utf8'));const provider=fs.readFileSync('assets/protected-content-provider-v376-v35.js','utf8');const config=fs.readFileSync('cloud/public-config-v342.js','utf8');const sw=fs.readFileSync('sw.js','utf8');const ids=['ipa92_a_positive_negative_logic_001','ipa92_a_open_closed_loop_control_001','ipa92_a_diode_transistor_001','ipa92_a_ic_lsi_vlsi_001','ipa92_a_fpga_001'];const topics=['core_07_02','core_02_09','core_07_02','core_07_02','core_07_02'];const cats=['コンピュータ','基礎理論','コンピュータ','コンピュータ','コンピュータ'];const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);if(catalog.version!=='ipa92-catalog-v35'||catalog.contentVersion!=='ipa92-questions-v35'||catalog.items?.length!==5||catalog.counts?.subjectA!==5)throw new Error('v35 catalog contract');if(JSON.stringify(catalog.items.map(x=>x.id))!==JSON.stringify(ids))throw new Error('v35 ids');for(let i=0;i<catalog.items.length;i++){const x=catalog.items[i];if(x.sourcePool!=='subject_a'||x.qualityAudit!=='ipa92-original-v35'||x.cat!==cats[i]||x.coreTopicId!==topics[i]||Object.keys(x).some(k=>protectedKeys.has(k)))throw new Error('unsafe v35 metadata');}if(!provider.includes("version:'v376-provider-32-ipa92-v1-v35'")||!provider.includes('const IPA92_V35_TOTAL=5;'))throw new Error('provider contract');if(!config.includes('IPA92_V35_METADATA')||!config.includes('activateV35Provider()')||!config.includes('catalogTotal===1173'))throw new Error('config contract');if(!sw.includes('protected-content-provider-v376-v35.js')||!sw.includes('question-catalog-ipa92-v35.json')||!sw.includes("fe-quest-v377-33"))throw new Error('sw contract');const ctx={console,setTimeout,clearTimeout,URL,AbortController,document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376-v35.js'},baseURI:'https://example.test/'},sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},fetch:async url=>{const n=new URL(String(url)).pathname.split('/').pop();return {ok:true,status:200,json:async()=>JSON.parse(fs.readFileSync('assets/'+n,'utf8'))}},window:{}};vm.createContext(ctx);vm.runInContext(provider,ctx);(async()=>{const merged=await ctx.window.FEQUEST_PROTECTED_CONTENT.loadCatalog();if(merged.items.length!==1173||merged.counts?.subjectA!==979||merged.counts?.trackedSubjectA!==988||merged.counts?.catalogQuestions!==1173)throw new Error('merged counts');for(const id of ids)if(!merged.items.some(x=>x.id===id))throw new Error('missing '+id);console.log('PASS v35 public runtime total=1173');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Validate production evidence
        run: |
          grep -Fq 'active protected question total after import: 1173' .github/IPA92_V35_ACTIVATION_2026-09-16.md
          grep -Fq 'b0fa37e0aa1e950d204113f636ce8f4bc80d45e7' .github/IPA92_V35_ACTIVATION_2026-09-16.md
          grep -Fq '035154d05b4a5f2dd51a31e7e1076a68b22b5c77b506c89a9920a288dab1f492' .github/IPA92_V35_ACTIVATION_2026-09-16.md
          grep -Fq '35042469138' .github/IPA92_V35_ACTIVATION_2026-09-16.md
          grep -Fq '171ec30fa2add5b53472c52332351a79286f931aae9f683d5f956f6fb75a26f1' .github/IPA92_V35_ACTIVATION_2026-09-16.md
