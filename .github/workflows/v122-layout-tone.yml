name: FE QUEST v122 layout tone release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v122-layout-tone.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v122 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit('missing target: '+label)
              s=s.replace(old,new,1)

          once('<title>FE QUEST PWA v121</title>','<title>FE QUEST PWA v122</title>','title')
          once("const APP_VERSION = 'v121';","const APP_VERSION = 'v122';",'app version')
          once("assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v121','v121 version/schema contract drift');","assert(PROFILE_SCHEMA_VERSION===5&&APP_VERSION==='v122','v122 version/schema contract drift');",'version assertion')

          once("""  .quiz-explain.show{display:block}\n  .quiz-explain h3{margin-bottom:7px}\n  .quiz-hint{\n    margin-top:10px;color:var(--muted);font-size:14px;\n  }""","""  .quiz-explain.show{display:flow-root;height:auto!important;min-height:0!important;align-self:flex-start}\n  .quiz-explain h3{margin-bottom:7px}\n  .quiz-explain h3:empty,.quiz-explanation:empty,.quiz-hint:empty{display:none}\n  .quiz-hint{\n    margin-top:10px;color:var(--muted);font-size:14px;height:auto;min-height:0;\n  }\n  .quiz-explain > *:last-child{margin-bottom:0}""",'quiz feedback css')

          once("""  const quizExplain=document.getElementById('quizExplain');\n  quizExplain.classList.remove('show');\n  quizExplain.querySelectorAll('.memory-next-note,.variant-source-note,.retry-note,.review-route-inline').forEach(x=>x.remove());""","""  const quizExplain=document.getElementById('quizExplain');\n  quizExplain.classList.remove('show');\n  quizExplain.style.height='auto';\n  quizExplain.style.minHeight='0';\n  quizExplain.querySelectorAll('.memory-next-note,.variant-source-note,.retry-note,.review-route-inline').forEach(x=>x.remove());""",'quiz feedback reset')

          once("output+=`<section class=\"core-chapter ${(q||ch===focusChapter)?'open':''}\">","output+=`<section class=\"core-chapter ${q?'open':''}\">",'core chapter default state')

          marker="function coreTopicArticleView(id){"
          if marker not in s:
              raise SystemExit('missing target: coreTopicArticleView')
          helper=r'''// ===== v122: Core A prose tone normalization =====
// Explanatory prose is shown in です・ます調. Formulae, labels, and short non-sentence fragments remain unchanged.
function politeCoreSentence(sentence){
  let src=String(sentence??'').trim();
  if(!src)return '';
  const hadStop=src.endsWith('。');
  let body=hadStop?src.slice(0,-1):src;
  if(/(?:です|ます|ません|でしょう|ください|しましょう)$/.test(body))return body+'。';

  const fixed=[
    ['とは限らない','とは限りません'],['わけではない','わけではありません'],['ではない','ではありません'],
    ['とはいえない','とはいえません'],['いえない','いえません'],['できない','できません'],
    ['必要がない','必要がありません'],['意味がない','意味がありません'],['値がない','値がありません'],['余裕がない','余裕がありません'],
    ['必要がある','必要があります'],['可能性がある','可能性があります'],['ことがある','ことがあります'],['ことが多い','ことが多いです'],
    ['である','です'],['という','といいます'],['し得る','する場合があります'],['得る','得ます'],
    ['となる','となります'],['になる','になります'],['ある','あります'],['いる','います'],['できる','できます'],
    ['られる','られます'],['れる','れます'],['せる','せます'],['する','します']
  ];
  for(const [from,to] of fixed){if(body.endsWith(from)){body=body.slice(0,-from.length)+to;return body+'。';}}

  const negative=[['しない','しません'],['わない','いません'],['かない','きません'],['さない','しません'],['たない','ちません'],['ばない','びません'],['まない','みません'],['らない','りません']];
  for(const [from,to] of negative){if(body.endsWith(from)){body=body.slice(0,-from.length)+to;return body+'。';}}
  if(body.endsWith('くない'))return body.slice(0,-3)+'くありません。';
  if(body.endsWith('ない'))return body.slice(0,-2)+'ません。';

  const ruGodan=['入る','走る','帰る','切る','知る','要る','減る','滑る','喋る','焦る','限る','握る','参る','混じる','交じる','返る','散る','照る','練る','捻る','蹴る','湿る','茂る','覆る','蘇る','遮る','陥る','至る','渡る','上がる','下がる','変わる','つながる','異なる','決まる','残る','守る','作る','取る','割る','測る','絞る','戻る','終わる','始まる','高まる','分かる','起こる','当たる','かかる','関わる','広がる','下回る','上回る'];
  if(body.endsWith('る')){
    if(ruGodan.some(v=>body.endsWith(v)))return body.slice(0,-1)+'ります。';
    const prev=body.at(-2)||'';
    if('いきぎしじちぢにひびぴみりえけげせぜてでねへべぺめれ'.includes(prev))return body.slice(0,-1)+'ます。';
    return body.slice(0,-1)+'ります。';
  }
  const godan=[['う','います'],['く','きます'],['ぐ','ぎます'],['す','します'],['つ','ちます'],['ぬ','にます'],['ぶ','びます'],['む','みます']];
  for(const [from,to] of godan){if(body.endsWith(from))return body.slice(0,-1)+to+'。';}

  if(body.endsWith('い'))return body+'です。';
  if(body.endsWith('だ'))return body.slice(0,-1)+'です。';
  if(/[ぁ-んァ-ヶ一-龠]$/.test(body))return body+'です。';
  return body+(hadStop?'。':'');
}
function politeCoreProse(text){
  const parts=String(text??'').match(/[^。]+。?/g)||[];
  return parts.map(p=>politeCoreSentence(p)).join('');
}
function politeCoreHtml(text){return learningHtml(politeCoreProse(text));}

'''
          s=s.replace(marker,helper+marker,1)

          for old,new,label in [
            ('<p>${learningHtml(beginner)}</p>','<p>${politeCoreHtml(beginner)}</p>','beginner prose'),
            ('<p>${learningHtml(e.deep)}</p>','<p>${politeCoreHtml(e.deep)}</p>','deep prose'),
            ("${e.extra.map(x=>`<li>${learningHtml(x)}</li>`).join('')}","${e.extra.map(x=>`<li>${politeCoreHtml(x)}</li>`).join('')}",'extra prose'),
            ('<p>${learningHtml(t.example)}</p>','<p>${politeCoreHtml(t.example)}</p>','example prose'),
            ('<p>${learningHtml(CORE_A_CAUTION_GUIDES[id]||t.pitfall)}</p>','<p>${politeCoreHtml(CORE_A_CAUTION_GUIDES[id]||t.pitfall)}</p>','caution prose')
          ]:
              once(old,new,label)

          assertion_marker="    assert(document.querySelector('header #aiFab.ai-header-btn'),'v115 BIT先生 must live in the top-right header');\n"
          if assertion_marker not in s:
              raise SystemExit('missing assertion marker')
          s=s.replace(assertion_marker,assertion_marker+"    assert(!String(renderCoreCourseMap).includes(\"ch===focusChapter)?'open'\"),'v122 Core A chapters must not auto-expand the first incomplete chapter');\n    assert(politeCoreProse('CPU性能はクロック周波数だけでは決まらない。').endsWith('決まりません。'),'v122 Core A polite prose normalization missing');\n",1)
          p.write_text(s,encoding='utf-8')

          m=Path('manifest.webmanifest')
          ms=m.read_text(encoding='utf-8')
          if '"name": "FE QUEST v121"' not in ms:
              raise SystemExit('manifest v121 name missing')
          ms=ms.replace('"name": "FE QUEST v121"','"name": "FE QUEST v122"',1)
          old_desc='"description": "基本情報技術者試験向けPWA。v121では誤答時の表示を「ヒント本文＋もう一度回答する」に絞り、「まだ正解は表示しません」「ヒントを使って」など問題解答に不要なメタ説明を削除。v120までの問題タグ整列、復習登録の非表示化、スマホ横スクロール対策、演習集中表示、CTA配置、問題・教材データを維持。"'
          new_desc='"description": "基本情報技術者試験向けPWA。v122ではヒント・確認ポイント欄を内容に応じた高さへ整理し、科目Aコアコースの章を初期状態ですべて閉じるよう変更。科目A教材の解説・補足・仕組み・注意などの説明文を表示時にです・ます調へ統一。v121までの問題集中UI、スマホ横スクロール対策、CTA配置、問題・教材データを維持。"'
          if old_desc not in ms:
              raise SystemExit('manifest v121 description missing')
          ms=ms.replace(old_desc,new_desc,1)
          m.write_text(ms,encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          if "const APP_VERSION = 'v121';" not in sws or "const CACHE_NAME = 'fe-quest-v121-1';" not in sws:
              raise SystemExit('service worker v121 target missing')
          sws=sws.replace("const APP_VERSION = 'v121';","const APP_VERSION = 'v122';",1)
          sws=sws.replace("const CACHE_NAME = 'fe-quest-v121-1';","const CACHE_NAME = 'fe-quest-v122-1';",1)
          sw.write_text(sws,encoding='utf-8')

          Path('audits').mkdir(exist_ok=True)
          Path('audits/CORE_A_LAYOUT_AND_TONE_AUDIT_v122.txt').write_text('''FE QUEST v122 — 科目Aレイアウト／文体監査

対象
1. 誤答後のヒント欄・正答後の確認ポイント欄に内容量以上の空白が残る。
2. 科目Aコアコースを開くと、最初の未完了章（初期状態では基礎理論1）が自動展開される。
3. 科目A教材の「解説」「仕組み」「注意」等で、常体とです・ます調が混在する。

修正
- quizExplainをheight:auto/min-height:0で明示し、空の見出し・説明・確認ポイントを非表示化。内容量に応じてカード高が決まる構成へ変更。
- 科目Aコアコースは通常表示時に全章を閉じる。検索中のみ該当章を展開。前回の続き／次の教材は上部の案内カードから開始できるため、一覧側で勝手に章を開かない。
- 科目Aコア教材の narrative prose（まずここから、解説、補足、仕組み、注意）を表示時にです・ます調へ統一。数式、比較表、短いラベル、問題文は対象外。
- 問題・教材の意味内容、正解キー、Profile Schema v5は変更しない。

検証
- MAIN_JS_SYNTAX_OK
- SW_SYNTAX_OK
- MANIFEST_JSON_OK
- APP_VERSION v122
- Profile Schema v5維持
- CORE_A_CHAPTER_DEFAULT_CLOSED_OK
- QUIZ_FEEDBACK_AUTO_HEIGHT_OK
- CORE_A_POLITE_PROSE_RENDER_OK
''',encoding='utf-8')
          PY

      - name: Verify v122
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v122';" in s
          assert "APP_VERSION==='v122'" in s
          assert "output+=`<section class=\"core-chapter ${q?'open':''}\">" in s
          assert '.quiz-explain.show{display:flow-root;height:auto!important;min-height:0!important;align-self:flex-start}' in s
          assert 'function politeCoreProse(text)' in s
          assert '<p>${politeCoreHtml(e.deep)}</p>' in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/feq-v122-main.js').write_text('\n'.join(scripts),encoding='utf-8')
          manifest=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['name']=='FE QUEST v122'
          PY
          node --check /tmp/feq-v122-main.js
          node --check sw.js

      - name: Commit v122 release
        shell: bash
        run: |
          rm -f .github/workflows/v122-layout-tone.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js audits/CORE_A_LAYOUT_AND_TONE_AUDIT_v122.txt .github/workflows/v122-layout-tone.yml
          git commit -m 'Release FE QUEST v122 layout and tone polish'
          git push
