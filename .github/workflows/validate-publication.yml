name: Validate sanitized FE QUEST publication

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication candidate
        uses: actions/checkout@v6
      - name: Validate IPA 9.2 coverage manifest
        run: node .github/scripts/check-ipa92-coverage.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check .github/scripts/check-ipa92-coverage.mjs
          node --check assets/first-impression-ux-v377.js
          node --check assets/ipa92-sort-lab-v377.js
          node --check assets/ipa92-graph-lab-v377.js
          node --check cloud/activation-loader-v342.js
          node --check sw.js
      - name: Execute IPA 9.2 sorting algorithm self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-sort-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('sort lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_SORT_TEST__={buildSteps,validateAlgorithms,ALGORITHM_ORDER};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_SORT_TEST__;
          if(!api||api.validateAlgorithms()!==true)throw new Error('sort lab validation did not pass');
          const expected='1,3,4,5,6,8';
          for(const key of api.ALGORITHM_ORDER){
            const steps=api.buildSteps(key);
            if(!Array.isArray(steps)||steps.length<2)throw new Error(`no usable steps for ${key}`);
            const actual=steps.at(-1).values.join(',');
            if(actual!==expected)throw new Error(`${key} final state ${actual} != ${expected}`);
            console.log(`PASS ${key}: steps=${steps.length} final=${actual}`);
          }
          NODE
      - name: Execute IPA 9.2 graph theory self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-graph-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('graph lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_GRAPH_TEST__={validateGraph,bfs,dfs,shortestPath,neighbors,NODE_ORDER};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_GRAPH_TEST__;
          if(!api||api.validateGraph()!==true)throw new Error('graph lab validation did not pass');
          const bfs=api.bfs('A',false);
          const dfs=api.dfs('A',false);
          const shortest=api.shortestPath('A','F',false);
          if(new Set(bfs).size!==api.NODE_ORDER.length)throw new Error(`BFS coverage invalid: ${bfs}`);
          if(new Set(dfs).size!==api.NODE_ORDER.length)throw new Error(`DFS coverage invalid: ${dfs}`);
          if(!shortest||shortest.length!==4)throw new Error(`shortest path invalid: ${shortest}`);
          if(api.shortestPath('F','A',true)!==null)throw new Error('directed reverse path unexpectedly exists');
          console.log(`PASS graph: BFS=${bfs.join('>')} DFS=${dfs.join('>')} shortest=${shortest.join('>')}`);
          NODE
      - name: Validate deploy-only publication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/assets/app-v377.js"
          test -f "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          test -f "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          test -f "$RUNNER_TEMP/site/assets/ipa92-sort-lab-v377.js"
          test -f "$RUNNER_TEMP/site/assets/ipa92-graph-lab-v377.js"
          test -f "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          test -f "$RUNNER_TEMP/site/sw.js"
          test ! -e "$RUNNER_TEMP/site/.github"
          test ! -e "$RUNNER_TEMP/site/supabase"
          grep -Fq "const APP_VERSION = 'v377';" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "function subjectACognitiveEvidence(){return undefined;}/* FEQUEST_V376_REDACTED_FUNCTION */" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "const cognitiveRaw=subjectACognitiveEvidence();" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "const cognitive=Number.isFinite(Number(cognitiveRaw))?Number(cognitiveRaw):0;" "$RUNNER_TEMP/site/assets/app-v377.js"
          ! grep -Fq "  const cognitive=subjectACognitiveEvidence();" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-9';" "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/ipa92-sort-lab-v377.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/ipa92-graph-lab-v377.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq "const VERSION='v377-first-impression-ux-7';" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "observerMode:'scoped-readiness'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "blankShellRecovery:'guarded-v2'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "studyBlockBarMode:'inline-active-screen'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "ipa92VennLab:'touch-v1'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "Ver.9.2対応強化中" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "sanitizeCompactReadiness(right,rightBar);" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "relocateStudyBlockBar();" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq '#diagIntro #diagBegin' "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          grep -Fq '#studyBlockBarV373[data-v377-inline="1"]' "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          grep -Fq '.ipa92-venn-backdrop' "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          grep -Fq "./assets/ipa92-sort-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "./assets/ipa92-graph-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "globalThis.FEQUEST_IPA92_SORT_LAB" "$RUNNER_TEMP/site/assets/ipa92-sort-lab-v377.js"
          grep -Fq "globalThis.FEQUEST_IPA92_GRAPH_LAB" "$RUNNER_TEMP/site/assets/ipa92-graph-lab-v377.js"
          grep -Fq "validateGraph();" "$RUNNER_TEMP/site/assets/ipa92-graph-lab-v377.js"
          ! grep -RIl --exclude='*.png' -E 'fequest_lesson_bank_private|fequest_question_bank_private|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' "$RUNNER_TEMP/site"
          sha256sum "$RUNNER_TEMP/site/assets/app-v377.js" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css" "$RUNNER_TEMP/site/assets/ipa92-sort-lab-v377.js" "$RUNNER_TEMP/site/assets/ipa92-graph-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js" "$RUNNER_TEMP/site/sw.js"
