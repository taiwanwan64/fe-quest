      - name: Validate IPA 9.2 public question metadata and runtime merge
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const extension=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));
          const contentVersions=['ipa92-questions-v1','ipa92-questions-v2','ipa92-questions-v3','ipa92-questions-v4','ipa92-questions-v5','ipa92-questions-v6'];
          if(extension.version!=='ipa92-catalog-v1-v6'||extension.contentVersion!=='ipa92-questions-v1-v6')throw new Error('IPA 9.2 extension catalog version mismatch');
          if(JSON.stringify(extension.contentVersions)!==JSON.stringify(contentVersions))throw new Error('IPA 9.2 extension contentVersions mismatch');
          if(!Array.isArray(extension.items)||extension.items.length!==83)throw new Error(`IPA 9.2 extension count mismatch: ${extension.items?.length}`);
          if(extension.counts?.subjectA!==83||extension.counts?.catalogQuestions!==83)throw new Error('IPA 9.2 extension counts invalid');
          const ids=extension.items.map(item=>item.id);
          if(new Set(ids).size!==83||ids.some(id=>!/^ipa92_a_[A-Za-z0-9_-]+$/.test(id)))throw new Error('IPA 9.2 extension IDs invalid');
          const expectedAuditCounts={
            'ipa92-original-v1':13,
            'ipa92-original-v2':14,
            'ipa92-original-v3':12,
            'ipa92-original-v4':12,
            'ipa92-original-v5':16,
            'ipa92-original-v6':16,
          };
          const auditCounts={};
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          for(const item of extension.items){
            if(item.sourcePool!=='subject_a')throw new Error(`unexpected source pool: ${item.id}`);
            if(typeof item.cat!=='string'||typeof item.concept!=='string'||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||'')))throw new Error(`invalid safe metadata: ${item.id}`);
            const leaked=Object.keys(item).find(key=>protectedKeys.has(key));
            if(leaked)throw new Error(`protected field leaked in public catalog: ${item.id}:${leaked}`);
            auditCounts[item.qualityAudit]=(auditCounts[item.qualityAudit]||0)+1;
          }
          if(JSON.stringify(auditCounts)!==JSON.stringify(expectedAuditCounts))throw new Error(`IPA 9.2 batch counts invalid: ${JSON.stringify(auditCounts)}`);

          const loader=fs.readFileSync('cloud/activation-loader-v342.js','utf8');
          const context={console,setTimeout,clearTimeout,URL};
          vm.createContext(context);
          vm.runInContext(`const QUESTION_BANK=[];\n${loader}\nglobalThis.__BANK__=QUESTION_BANK;`,context,{filename:'cloud/activation-loader-v342.js'});
          const bank=context.__BANK__;
          if(!Array.isArray(bank)||bank.length!==83)throw new Error(`runtime metadata install mismatch: ${bank?.length}`);
          const bankIds=bank.map(item=>item.id).sort();
          const catalogIds=[...ids].sort();
          if(JSON.stringify(bankIds)!==JSON.stringify(catalogIds))throw new Error('runtime metadata IDs differ from public extension catalog');
          if(context.FEQUEST_IPA92_SUBJECT_A_METADATA_INSTALL?.ok!==true)throw new Error('runtime metadata installer did not report success');
          if(context.FEQUEST_IPA92_SUBJECT_A_METADATA_INSTALL?.total!==83)throw new Error('runtime metadata installer total mismatch');

          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));
          const provider=fs.readFileSync('assets/protected-content-provider-v376.js','utf8');
          const providerContext={
            console,setTimeout,clearTimeout,URL,AbortController,
            document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376.js'},baseURI:'https://example.test/'},
            sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},
            fetch:async url=>({ok:true,status:200,json:async()=>String(url).endsWith('question-catalog-ipa92-v1-v6.json')?extension:base}),
            window:{}
          };
          vm.createContext(providerContext);
          vm.runInContext(provider,providerContext,{filename:'assets/protected-content-provider-v376.js'});
          (async()=>{
            if(providerContext.window.FEQUEST_PROTECTED_CONTENT.hasAccessCode()!==true)throw new Error('open preview access should be enabled');
            const merged=await providerContext.window.FEQUEST_PROTECTED_CONTENT.loadCatalog();
            if(merged.items.length!==987)throw new Error(`merged catalog count mismatch: ${merged.items.length}`);
            if(merged.counts?.subjectA!==793)throw new Error(`merged subjectA count mismatch: ${merged.counts?.subjectA}`);
            if(merged.counts?.trackedSubjectA!==802)throw new Error(`merged trackedSubjectA count mismatch: ${merged.counts?.trackedSubjectA}`);
            if(merged.counts?.catalogQuestions!==987)throw new Error(`merged catalogQuestions mismatch: ${merged.counts?.catalogQuestions}`);
            if(JSON.stringify(merged.extensionContentVersions)!==JSON.stringify(contentVersions))throw new Error('merged contentVersions mismatch');
            const mergedIds=merged.items.map(item=>item.id);
            if(new Set(mergedIds).size!==987)throw new Error('merged catalog duplicate IDs');
            for(const id of ids)if(!mergedIds.includes(id))throw new Error(`merged catalog missing ${id}`);
            console.log(`PASS IPA 9.2 public question runtime: base=${base.items.length} extension=${ids.length} merged=${merged.items.length}`);
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Execute IPA 9.2 sorting algorithm self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-sort-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('sort lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_SORT_TEST__={buildSteps,validateAlgorithms,ALGORITHM_ORDER};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_SORT_TEST__;
          if(!api||api.validateAlgorithms()!==true)throw new Error('sort lab validation did not pass');
          const expected='1,3,4,5,6,8';
          for(const key of api.ALGORITHM_ORDER){
            const steps=api.buildSteps(key);
            if(!Array.isArray(steps)||steps.length<2)throw new Error(`no usable steps for ${key}`);
            const actual=steps.at(-1).values.join(',');
            if(actual!==expected)throw new Error(`${key} final state ${actual} != ${expected}`);
            console.log(`PASS ${key}: steps=${steps.length} final=${actual}`);
          }
          NODE
      - name: Execute IPA 9.2 graph theory self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-graph-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
