name: Validate sanitized FE QUEST publication

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication candidate
        uses: actions/checkout@v6
      - name: Validate IPA 9.2 coverage manifest
        run: node .github/scripts/check-ipa92-coverage.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app-v377.js
          node --check .github/scripts/check-ipa92-coverage.mjs
          node --check assets/protected-content-provider-v376.js
          node --check assets/protected-content-provider-v376-v15.js
          node --check assets/protected-content-provider-v376-v16.js
          node --check assets/protected-content-provider-v376-v17.js
          node --check assets/protected-content-provider-v376-v18.js
          node --check assets/protected-content-provider-v376-v19.js
          node --check assets/protected-content-provider-v376-v20.js
          node --check assets/protected-content-provider-v376-v21.js
          node --check assets/protected-content-provider-v376-v22.js
          node --check assets/protected-content-provider-v376-v23.js
          node --check assets/protected-content-provider-v376-v24.js
          node --check assets/protected-content-provider-v376-v25.js
          node --check assets/protected-content-provider-v376-v26.js
          node --check assets/protected-content-provider-v376-v27.js
          node --check assets/protected-content-provider-v376-v28.js
          node --check assets/protected-content-provider-v376-v29.js
          node --check assets/protected-content-provider-v376-v30.js
          node --check assets/protected-content-provider-v376-v31.js
          node --check assets/protected-content-provider-v376-v32.js
          node --check assets/protected-content-provider-v376-v33.js
          node --check assets/protected-content-provider-v376-v34.js
          node --check assets/protected-content-provider-v376-v35.js
          node --check assets/first-impression-ux-v377.js
          node --check assets/ipa92-sort-lab-v377.js
          node --check assets/ipa92-graph-lab-v377.js
          node --check assets/ipa92-modeling-lab-v377.js
          node --check assets/ipa92-memory-lab-v377.js
          node --check cloud/activation-loader-v342.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate plan UI hotfix
        run: |
          grep -Fq "displayMinutes?displayMinutes+'分':''" assets/app-v377.js
          ! grep -Fq "x.min?x.min+'m':''" assets/app-v377.js
          grep -Fq "Math.max(0,Number(profile.activity?.[k]?.minutes)||0)" assets/app-v377.js
          grep -Fq "function analyticsDisplayMinutes(value){return Math.max(0,Math.round(Number(value)||0))}" assets/app-v377.js
          grep -Fq "analyticsDisplayMinutes(report.activity.minutes)" assets/app-v377.js
          grep -Fq "analyticsDisplayMinutes(seven)" assets/app-v377.js
          grep -Fq "analyticsDisplayMinutes(thirty)" assets/app-v377.js
          grep -Fq "#planFocusAction,#openStudySettingsV373{height:46px;min-height:46px" assets/app-v377.css
          grep -Fq "受験予定日から逆算する" assets/app-v377.js
          grep -Fq "学習時間から逆算する" assets/app-v377.js
          ! grep -Fq "必要時間の目安を使う" assets/app-v377.js
          ! grep -Fq "目安の時期を仮の日付にする" assets/app-v377.js
          ! grep -Fq "未定の場合は「時間から」か「どちらも未定」を選べます。提案された時期は予約日ではありません。" assets/app-v377.js
          ! grep -Fq "回して選ぶ" assets/app-v377.js
          ! grep -Fq "data-wheel-open" assets/app-v377.js
          grep -Fq "output.dataset.invalid=String(!valid)" assets/app-v377.js
          grep -Fq "confirmStudyPlanLeaveV373" assets/app-v377.js
          grep -Fq "prev==='plan'&&id!=='plan'" assets/app-v377.js
          grep -Fq ".study-inverse-action-v373{width:100%;min-height:46px;margin-top:10px" assets/app-v377.css
          grep -Fq ".minute-picker-v373 output[data-invalid=true]{color:#ad2929;font-weight:700}" assets/app-v377.css
          ! grep -Fq "決まっていることから考える" assets/app-v377.js
          ! grep -Fq 'id="${prefix}Mode"' assets/app-v377.js
          grep -Fq "planningModeV373:date.value?'both':'time'" assets/app-v377.js
          grep -Fq ".minute-input-v373 input{height:44px;min-height:44px!important;padding:6px 10px!important" assets/app-v377.css
          grep -Fq ".minute-picker-v373>.study-inverse-action-v373{margin-top:2px}" assets/app-v377.css
          ! grep -Fq "今日だけ別の時間にする" assets/app-v377.js
          ! grep -Fq "data-today-picker" assets/app-v377.js
          ! grep -Fq "settings.todayV373?.date===dateKey(date)" assets/app-v377.js
          grep -Fq "next.todayV373=null;" assets/app-v377.js
          grep -Fq "曜日ごとの時間</summary>" assets/app-v377.js
          grep -Fq "学習を進めると、復習の進み具合や科目B・模試の結果をもとに必要時間の目安を更新します。" assets/app-v377.js
          grep -Fq "function dailyTaskIsLearningEntryV373" assets/app-v377.js
          grep -Fq "tasks.find(t=>dailyTaskIsLearningEntryV373(t)&&!dailyTaskDone(rec,t))" assets/app-v377.js
          grep -Fq "pendingLearn.type==='studyBlockV373'&&pendingLearn.lane==='subjectB'" assets/app-v377.js
          ! grep -Fq "tasks.find(t=>dailyTaskSlot(t)==='learn'&&!dailyTaskDone(rec,t))" assets/app-v377.js
          grep -Fq "@media(max-width:720px){#planFocusAction,#openStudySettingsV373{width:100%;height:auto;min-height:46px;margin-left:0}}" assets/app-v377.css
          grep -Fq "@media(min-width:721px){html{scrollbar-gutter:stable}}" assets/app-v377.css
          grep -Fq "現在の理解度をざっくり確認し、最初に学ぶ内容を調整するための診断です。分からない問題があっても大丈夫です。" index.html
          ! grep -Fq "忘れている分野を見つけるための診断です。" index.html
          grep -Fq "policy:'optional-account-then-diagnostic-then-plan-review-then-home'" assets/app-v377.js
          grep -Fq "function firstRunGuidedTotalStepsV364(){return 2;}" assets/app-v377.js
          grep -Fq "writeUiState({[FIRST_RUN_ACCOUNT_STATE_V364]:mode,[FIRST_RUN_TOTAL_STEPS_V364]:2});" assets/app-v377.js
          ! grep -Fq "if(firstRunNeedsSettingsV364())renderFirstRunSettingsV364(root);" assets/app-v377.js
          grep -Fq "診断結果と教材量から必要時間の目安を見積もり、設定した学習時間・受験予定日で無理がないか確認します。必要時間は目安です。" assets/app-v377.js
          grep -Fq 'value.correct} / ${value.total} 正解' assets/protected-flow-bridge-v376.js
          grep -Fq "renderDiagnosticResult(scores,categories);" assets/protected-flow-bridge-v376.js
          ! grep -Fq '今日の学習は${effectiveStudyMinutes()}分を目安に自動調整します。' assets/protected-flow-bridge-v376.js
          grep -Fq "function diagnosticOverallRateV377()" assets/app-v377.js
          grep -Fq "Math.round(diagnosticOverallRateV377()*.25)" assets/app-v377.js
          grep -Fq "sampleCount>=2?.20:.10" assets/app-v377.js
          grep -Fq "if(!showA&&typeof renderSubjectBHub==='function')renderSubjectBHub();" assets/app-v377.js
          grep -Fq "const firstDiagnostic=profile.diagnosticCompleted!==true;" assets/protected-flow-bridge-v376.js
          grep -Fq "const screened=Math.round(50-errorRate*25*confidence);" assets/protected-flow-bridge-v376.js
          ! grep -Fq "科目Bの進捗を確認中…" index.html
          ! grep -Fq "必要なときだけ4つのモードから選べます" index.html
          grep -Fq "プログラムトレースから始める" index.html
          ! grep -Fq "論点" index.html
          grep -Fq "復習で定着したテーマ" index.html
          grep -Fq "このテーマを復習 →" assets/app-v377.js
          ! grep -Fq "この論点を復習 →" assets/app-v377.js
          ! grep -Fq "ログインは学習データの引継ぎに、招待コードはβ期間中の問題アクセス確認に使います。" assets/first-impression-ux-v377.js
          grep -Fq "診断を始める際に、案内された招待コードを1回入力してください。" assets/first-impression-ux-v377.js
          grep -Fq ".state-grid>.sub{grid-column:1/-1;white-space:nowrap}" assets/app-v377.css
          grep -Fq ".diag-nav button{width:110px;min-height:52px}" assets/app-v377.css
          ! grep -Fq "実際の所要時間は区切りごとに調整できます" assets/app-v377.js
          ! grep -Fq "区切りで終了できます。未完了の教材は次回に続けます。" assets/app-v377.js
          grep -Fq '今日の設定 ${effectiveStudyMinutes()}分' assets/app-v377.js
          grep -Fq "title,desc:'',questionLimit:" assets/app-v377.js
      - name: Validate IPA 9.2 public question metadata and runtime merge
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const extension=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v1-v6.json','utf8'));
          const contentVersions=['ipa92-questions-v1','ipa92-questions-v2','ipa92-questions-v3','ipa92-questions-v4','ipa92-questions-v5','ipa92-questions-v6'];
          if(extension.version!=='ipa92-catalog-v1-v6'||extension.contentVersion!=='ipa92-questions-v1-v6')throw new Error('IPA 9.2 extension catalog version mismatch');
          if(JSON.stringify(extension.contentVersions)!==JSON.stringify(contentVersions))throw new Error('IPA 9.2 extension contentVersions mismatch');
          if(!Array.isArray(extension.items)||extension.items.length!==83)throw new Error(`IPA 9.2 extension count mismatch: ${extension.items?.length}`);
          if(extension.counts?.subjectA!==83||extension.counts?.catalogQuestions!==83)throw new Error('IPA 9.2 extension counts invalid');
          const ids=extension.items.map(item=>item.id);
          if(new Set(ids).size!==83||ids.some(id=>!/^ipa92_a_[A-Za-z0-9_-]+$/.test(id)))throw new Error('IPA 9.2 extension IDs invalid');
          const expectedAuditCounts={
            'ipa92-original-v1':13,
            'ipa92-original-v2':14,
            'ipa92-original-v3':12,
            'ipa92-original-v4':12,
            'ipa92-original-v5':16,
            'ipa92-original-v6':16,
          };
          const auditCounts={};
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          for(const item of extension.items){
            if(item.sourcePool!=='subject_a')throw new Error(`unexpected source pool: ${item.id}`);
            if(typeof item.cat!=='string'||typeof item.concept!=='string'||!/^core_[0-9]{2}_[0-9]{2}$/.test(String(item.coreTopicId||'')))throw new Error(`invalid safe metadata: ${item.id}`);
            const leaked=Object.keys(item).find(key=>protectedKeys.has(key));
            if(leaked)throw new Error(`protected field leaked in public catalog: ${item.id}:${leaked}`);
            auditCounts[item.qualityAudit]=(auditCounts[item.qualityAudit]||0)+1;
          }
          if(JSON.stringify(auditCounts)!==JSON.stringify(expectedAuditCounts))throw new Error(`IPA 9.2 batch counts invalid: ${JSON.stringify(auditCounts)}`);

          const loader=fs.readFileSync('cloud/activation-loader-v342.js','utf8');
          const context={console,setTimeout,clearTimeout,URL};
          vm.createContext(context);
          vm.runInContext(`const QUESTION_BANK=[];\n${loader}\nglobalThis.__BANK__=QUESTION_BANK;`,context,{filename:'cloud/activation-loader-v342.js'});
          const bank=context.__BANK__;
          if(!Array.isArray(bank)||bank.length!==83)throw new Error(`runtime metadata install mismatch: ${bank?.length}`);
          const bankIds=bank.map(item=>item.id).sort();
          const catalogIds=[...ids].sort();
          if(JSON.stringify(bankIds)!==JSON.stringify(catalogIds))throw new Error('runtime metadata IDs differ from public extension catalog');
          if(context.FEQUEST_IPA92_SUBJECT_A_METADATA_INSTALL?.ok!==true)throw new Error('runtime metadata installer did not report success');
          if(context.FEQUEST_IPA92_SUBJECT_A_METADATA_INSTALL?.total!==83)throw new Error('runtime metadata installer total mismatch');

          const base=JSON.parse(fs.readFileSync('assets/question-catalog-v376.json','utf8'));
          const provider=fs.readFileSync('assets/protected-content-provider-v376.js','utf8');
          const providerContext={
            console,setTimeout,clearTimeout,URL,AbortController,
            document:{currentScript:{src:'https://example.test/assets/protected-content-provider-v376.js'},baseURI:'https://example.test/'},
            sessionStorage:{getItem(){return null},setItem(){},removeItem(){}},
            fetch:async url=>({ok:true,status:200,json:async()=>String(url).endsWith('question-catalog-ipa92-v1-v6.json')?extension:base}),
            window:{}
          };
          vm.createContext(providerContext);
          vm.runInContext(provider,providerContext,{filename:'assets/protected-content-provider-v376.js'});
          (async()=>{
            const merged=await providerContext.window.FEQUEST_PROTECTED_CONTENT.loadCatalog();
            if(merged.items.length!==987)throw new Error(`merged catalog count mismatch: ${merged.items.length}`);
            if(merged.counts?.subjectA!==793)throw new Error(`merged subjectA count mismatch: ${merged.counts?.subjectA}`);
            if(merged.counts?.trackedSubjectA!==802)throw new Error(`merged trackedSubjectA count mismatch: ${merged.counts?.trackedSubjectA}`);
            if(merged.counts?.catalogQuestions!==987)throw new Error(`merged catalogQuestions mismatch: ${merged.counts?.catalogQuestions}`);
            if(JSON.stringify(merged.extensionContentVersions)!==JSON.stringify(contentVersions))throw new Error('merged contentVersions mismatch');
            const mergedIds=merged.items.map(item=>item.id);
            if(new Set(mergedIds).size!==987)throw new Error('merged catalog duplicate IDs');
            for(const id of ids)if(!mergedIds.includes(id))throw new Error(`merged catalog missing ${id}`);
            console.log(`PASS IPA 9.2 public question runtime: base=${base.items.length} extension=${ids.length} merged=${merged.items.length}`);
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Execute IPA 9.2 sorting algorithm self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-sort-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('sort lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_SORT_TEST__={buildSteps,validateAlgorithms,ALGORITHM_ORDER};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_SORT_TEST__;
          if(!api||api.validateAlgorithms()!==true)throw new Error('sort lab validation did not pass');
          const expected='1,3,4,5,6,8';
          for(const key of api.ALGORITHM_ORDER){
            const steps=api.buildSteps(key);
            if(!Array.isArray(steps)||steps.length<2)throw new Error(`no usable steps for ${key}`);
            const actual=steps.at(-1).values.join(',');
            if(actual!==expected)throw new Error(`${key} final state ${actual} != ${expected}`);
            console.log(`PASS ${key}: steps=${steps.length} final=${actual}`);
          }
          NODE
      - name: Execute IPA 9.2 graph theory self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-graph-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('graph lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_GRAPH_TEST__={validateGraph,bfs,dfs,shortestPath,neighbors,NODE_ORDER};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_GRAPH_TEST__;
          if(!api||api.validateGraph()!==true)throw new Error('graph lab validation did not pass');
          const bfs=api.bfs('A',false);
          const dfs=api.dfs('A',false);
          const shortest=api.shortestPath('A','F',false);
          if(new Set(bfs).size!==api.NODE_ORDER.length)throw new Error(`BFS coverage invalid: ${bfs}`);
          if(new Set(dfs).size!==api.NODE_ORDER.length)throw new Error(`DFS coverage invalid: ${dfs}`);
          if(!shortest||shortest.length!==4)throw new Error(`shortest path invalid: ${shortest}`);
          if(api.shortestPath('F','A',true)!==null)throw new Error('directed reverse path unexpectedly exists');
          console.log(`PASS graph: BFS=${bfs.join('>')} DFS=${dfs.join('>')} shortest=${shortest.join('>')}`);
          NODE
      - name: Execute IPA 9.2 modeling lab self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-modeling-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('modeling lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_MODELING_TEST__={validateModelingLab,answerPractice,MODES,MODELS};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_MODELING_TEST__;
          if(!api||api.validateModelingLab()!==true)throw new Error('modeling lab validation did not pass');
          if(api.answerPractice('uml',1).correct!==true||api.answerPractice('dfd',0).correct!==true||api.answerPractice('er',1).correct!==true)throw new Error('modeling practice contract failed');
          console.log(`PASS modeling lab: modes=${api.MODES.join(',')}`);
          NODE
      - name: Execute IPA 9.2 memory lab self-check
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const file='assets/ipa92-memory-lab-v377.js';
          const source=fs.readFileSync(file,'utf8');
          const marker='function injectStyles(){';
          const cut=source.indexOf(marker);
          if(cut<0)throw new Error('memory lab test extraction marker missing');
          const executable=source.slice(0,cut)+`\nglobalThis.__IPA92_MEMORY_TEST__={validateMemoryLab,simulate,REFERENCES,ALGORITHMS};\n})();`;
          const context={console};
          vm.createContext(context);
          vm.runInContext(executable,context,{filename:file});
          const api=context.__IPA92_MEMORY_TEST__;
          if(!api||api.validateMemoryLab()!==true)throw new Error('memory lab validation did not pass');
          const fifo=api.simulate('fifo').at(-1);
          const lru=api.simulate('lru').at(-1);
          if(fifo.pageFaults!==6||lru.pageFaults!==7)throw new Error(`page replacement totals invalid: fifo=${fifo.pageFaults} lru=${lru.pageFaults}`);
          console.log(`PASS memory lab: refs=${api.REFERENCES.join(',')} fifoFaults=${fifo.pageFaults} lruFaults=${lru.pageFaults}`);
          NODE
      - name: Validate deploy-only publication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/assets/app-v377.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v15.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v16.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v18.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v19.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v20.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v22.js"
          grep -Fq '"./assets/protected-content-provider-v376-v23.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v23.js"
          grep -Fq '"./assets/protected-content-provider-v376-v24.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v24.js"
          grep -Fq '"./assets/protected-content-provider-v376-v25.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v25.js"
          grep -Fq '"./assets/protected-content-provider-v376-v26.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v26.js"
          grep -Fq '"./assets/protected-content-provider-v376-v27.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v27.js"
          grep -Fq '"./assets/protected-content-provider-v376-v28.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v28.js"
          grep -Fq '"./assets/protected-content-provider-v376-v29.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v29.js"
          grep -Fq '"./assets/protected-content-provider-v376-v30.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v30.js"
          grep -Fq '"./assets/protected-content-provider-v376-v31.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v31.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v32.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v33.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v34.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v35.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-v376.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v1.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v1-v6.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v15.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v16.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v17.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v18.json"
