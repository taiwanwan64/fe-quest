name: Validate sanitized FE QUEST publication

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication candidate
        uses: actions/checkout@v6
      - name: Validate IPA 9.2 coverage manifest
        run: node .github/scripts/check-ipa92-coverage.mjs
      - name: Exercise protected Subject B mini mock bridge
        run: node .github/scripts/check-b-mini-mock-v438.mjs
      - name: Exercise protected security mini mock bridge
        run: node .github/scripts/check-b-security-mini-v439.mjs
      - name: Exercise Subject A related-question review selection
        run: node .github/scripts/check-subject-a-review-related-v440.mjs
      - name: Exercise Subject A readiness evidence
        run: node .github/scripts/check-subject-a-readiness-v441.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app-v377.js
          node --check .github/scripts/check-ipa92-coverage.mjs
          node --check assets/protected-content-provider-v376.js
          node --check assets/protected-lesson-provider-v376.js
          node --check assets/protected-content-provider-v376-v15.js
          node --check assets/protected-content-provider-v376-v16.js
          node --check assets/protected-content-provider-v376-v17.js
          node --check assets/protected-content-provider-v376-v18.js
          node --check assets/protected-content-provider-v376-v19.js
          node --check assets/protected-content-provider-v376-v20.js
          node --check assets/protected-content-provider-v376-v21.js
          node --check assets/protected-content-provider-v376-v22.js
          node --check assets/protected-content-provider-v376-v23.js
          node --check assets/protected-content-provider-v376-v24.js
          node --check assets/protected-content-provider-v376-v25.js
          node --check assets/protected-content-provider-v376-v26.js
          node --check assets/protected-content-provider-v376-v27.js
          node --check assets/protected-content-provider-v376-v28.js
          node --check assets/protected-content-provider-v376-v29.js
          node --check assets/protected-content-provider-v376-v30.js
          node --check assets/protected-content-provider-v376-v31.js
          node --check assets/protected-content-provider-v376-v32.js
          node --check assets/protected-content-provider-v376-v33.js
          node --check assets/protected-content-provider-v376-v34.js
          node --check assets/protected-content-provider-v376-v35.js
          node --check assets/first-impression-ux-v377.js
          node --check assets/ipa92-sort-lab-v377.js
          node --check assets/ipa92-graph-lab-v377.js
          node --check assets/ipa92-modeling-lab-v377.js
          node --check assets/ipa92-memory-lab-v377.js
          node --check cloud/activation-loader-v342.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate public protected-content static boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const forbidden=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations','point','pitfall','correctText']);
          const files=fs.readdirSync('assets').filter(name=>/^question-catalog.*\.json$/.test(name));
          if(!files.length)throw new Error('question catalogs missing');
          function walk(value,file,trail='root'){
            if(Array.isArray(value)){value.forEach((item,index)=>walk(item,file,`${trail}[${index}]`));return;}
            if(!value||typeof value!=='object')return;
            for(const [key,item] of Object.entries(value)){
              if(forbidden.has(key))throw new Error(`protected field ${key} found in public catalog ${file} at ${trail}`);
              walk(item,file,`${trail}.${key}`);
            }
          }
          for(const file of files)walk(JSON.parse(fs.readFileSync(path.join('assets',file),'utf8')),file);
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          if(app.includes('const B_MOCK_EXTRA_DISTRACTOR='))throw new Error('legacy protected mini-mock distractor residual is public');
          if(app.includes('const B_MOCK_EXPLANATION='))throw new Error('legacy protected mini-mock explanation residual is public');
          if(!app.includes("policy:'public-static-assets-metadata-only-for-protected-question-content'"))throw new Error('v436 public-static policy missing');
          console.log(`PASS public protected-content static boundary: ${files.length} metadata catalogs`);
          NODE
      - name: Validate Subject B 50-question final-pool metadata
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const base=require('./assets/question-catalog-v376.json');
          const gap=require('./assets/question-catalog-b-gap-v1.json');
          const match=app.match(/const B_EXAM_ALGO_ITEMS=(\[[^\n]*\]);/);
          if(!match)throw new Error('B_EXAM_ALGO_ITEMS not found');
          const actual=JSON.parse(match[1]);
          const expected=[...base.items,...gap.items].filter(x=>x.sourcePool==='b_exam_algo');
          if(actual.length!==50||expected.length!==50)throw new Error('b_exam_algo count drift actual='+actual.length+' catalog='+expected.length);
          const actualByProtectedId=new Map(actual.map(x=>[x.protectedQuestionId,x]));
          if(actualByProtectedId.size!==50)throw new Error('duplicate protectedQuestionId in app metadata');
          for(const item of expected){
            const row=actualByProtectedId.get(item.id);
            if(!row)throw new Error('missing app metadata '+item.id);
            if(row.id!==item.parentId||row.level!==item.level||row.domain!==item.domain||row.format!==item.format||row.protected!==true){
              throw new Error('metadata mismatch '+item.id);
            }
          }
          const required=['b_exam_bexam_sq_05','b_exam_bexam_tree_06','b_exam_bexam_bit_06','b_exam_bexam_algo_04','b_exam_bexam_arr_06','b_exam_bexam_mat_05','b_exam_bexam_ctrl_05'];
          for(const id of required)if(!actualByProtectedId.has(id))throw new Error('missing gap metadata '+id);
          if(!app.includes('const B_FINAL_ALGO_POOL_V424_COUNT=50;'))throw new Error('v424 runtime pool contract missing');
          console.log('PASS Subject B final selector metadata: 50 questions');
          const selectorStart=app.indexOf('function bFinalSelectDescriptorsV376(){');
          const selectorEnd=app.indexOf('function bFinalProtectedItemV376',selectorStart);
          const selector=selectorStart>=0&&selectorEnd>selectorStart?app.slice(selectorStart,selectorEnd):'';
          if(!app.includes("policy:'algorithm-16-then-security-4'")||!app.includes('randomizesWithinBlocks:true')||!selector.includes('const algo=shuffled(bFinalSelectAlgoV376());')||!selector.includes('const security=shuffled(bFinalSelectSecurityV376());')||!selector.includes('const descriptors=[...algo,...security];')||!selector.includes("item.kind!=='algo'")||!selector.includes("item.kind!=='security'"))throw new Error('v425 final runtime order contract missing');
          if(selector.includes('shuffled([...bFinalSelectAlgoV376()'))throw new Error('v425 final runtime order regressed to mixed shuffle');
          console.log('PASS Subject B final runtime order: algorithm 16 then security 4');
          NODE
      - name: Validate protected runtime lifetime and metadata-only final resume
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "policy:'persist-resume-metadata-only-rehydrate-protected-final'",
            "schemaVersion:2",
            "protectedQuestionTextPersisted:false",
            "protectedOptionsPersisted:false",
            "rehydratesProtectedQuestionsOnResume:true",
            "function bFinalResumePayloadValidV435(value)",
            "function hydrateBFinalResumeV435(saved,remain)",
            "questionIds,optionMaps,answers:[...bFinalAnswers]",
            "bFinalProtectedItemV376(packet,saved.optionMaps[index])",
            "function releaseSubjectAPracticeRuntimeV435()",
            "function releaseSubjectAMockContextV435()",
            "function releaseSubjectBProtectedRuntimeV435()",
            "policy:'protected-content-runtime-only-while-active-or-immediate-review'",
            "FEQUEST_RUNTIME_HYGIENE_V435_READY===true"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing v435 runtime/resume contract: '+token);
          if(app.includes('items:bFinalItems'))throw new Error('full protected B-final items must not be written to resume storage');
          if(app.includes('bFinalResumePayloadValidV426'))throw new Error('legacy full-item B-final resume validator still active');

          const saveStart=app.indexOf('function saveBFinalResume(){');
          const saveEnd=app.indexOf('function readBFinalResume()',saveStart);
          const saveBody=saveStart>=0&&saveEnd>saveStart?app.slice(saveStart,saveEnd):'';
          if(!saveBody)throw new Error('B-final resume save function missing');
          for(const forbidden of ['items:bFinalItems','q:','options:','context:','code:','data:','incident:','evidence:','log:','explain:','correctText:']){
            if(saveBody.includes(forbidden))throw new Error('protected B-final content persisted in resume: '+forbidden);
          }
          for(const needed of ['questionIds','optionMaps','answers:[...bFinalAnswers]','flags:[...bFinalFlags]']){
            if(!saveBody.includes(needed))throw new Error('B-final resume metadata missing: '+needed);
          }

          const restoreStart=app.indexOf('async function hydrateBFinalResumeV435(saved,remain)');
          const restoreEnd=app.indexOf('function restoreBFinalResume()',restoreStart);
          const restoreBody=restoreStart>=0&&restoreEnd>restoreStart?app.slice(restoreStart,restoreEnd):'';
          for(const needed of ["bFinalBridgeV376().startSession(saved.questionIds)","packets.slice(0,16).some(packet=>packet.kind!=='algo')","packets.slice(16).some(packet=>packet.kind!=='security')","bFinalProtectedItemV376(packet,saved.optionMaps[index])"]){
            if(!restoreBody.includes(needed))throw new Error('B-final rehydrate contract missing: '+needed);
          }

          const mockStart=app.indexOf('function releaseSubjectAMockContextV435()');
          const mockEnd=app.indexOf('function randomizeMockQuestion',mockStart);
          const mockBody=mockStart>=0&&mockEnd>mockStart?app.slice(mockStart,mockEnd):'';
          if(!mockBody.includes('releaseSubjectAMockExamRuntimeV435();')||!mockBody.includes('releaseSubjectAMockResultMemoryV435();'))throw new Error('Subject A mock full cleanup missing');

          const practiceStart=app.indexOf('function releaseSubjectAPracticeRuntimeV435()');
          const practiceEnd=app.indexOf('function nextUnfinishedDailyTask',practiceStart);
          const practiceBody=practiceStart>=0&&practiceEnd>practiceStart?app.slice(practiceStart,practiceEnd):'';
          for(const needed of ['clearSubjectASession','quizItems=[]','sessionLog=[]','quizOptions']){
            if(!practiceBody.includes(needed))throw new Error('Subject A practice cleanup missing: '+needed);
          }

          const bStart=app.indexOf('function releaseSubjectBProtectedRuntimeV435()');
          const bEnd=app.indexOf('function setBMode(mode)',bStart);
          const bBody=bStart>=0&&bEnd>bStart?app.slice(bStart,bEnd):'';
          for(const needed of ['bTraceBridgeV376().clear()','bSecurityBridgeV376().clear()','bMockReleaseRuntimeV431()','bCompoundClearProtectedV376()','securityMockReleaseRuntimeV431()','bFinalReleaseExamRuntimeV430()','bFinalClearProtectedV376()']){
            if(!bBody.includes(needed))throw new Error('Subject B runtime cleanup missing: '+needed);
          }
          console.log('PASS protected runtime lifetime and B-final resume v435');
          NODE
      - name: Validate Subject B final grading order contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const bridge=fs.readFileSync('assets/protected-b-final-bridge-v376.js','utf8');
          const required=[
            "policy:'preserve-exact-question-order-through-server-grading'",
            "requiresExactSessionOrder:true",
            "requiresExactResultOrder:true",
            "function bFinalQuestionOrderMatchesV427(actual,expected)",
            "function bFinalGradeResultsMatchV427(results,expectedIds)",
            "!bFinalQuestionOrderMatchesV427(state.questionIds,ids)",
            "!bFinalGradeResultsMatchV427(results,ids)",
            "blankAnswersRemainIncorrect:true",
            "preventsLocalDoubleScoring:true"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing final grading contract: '+token);
          if(!bridge.includes("const submitted=blank?0:choice;"))throw new Error('blank submission contract missing');
          if(!bridge.includes("correct:blank?false:result.correct"))throw new Error('blank must remain incorrect');
          console.log('PASS Subject B final grading integrity v427');
          NODE
      - name: Validate Subject B security mistake identity contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "policy:'security-question-specific-mistake-identity'",
            "algorithmIdentity:'sourceId'",
            "securityIdentity:'protectedQuestionId'",
            "preservesLegacyHistoryFallback:true",
            "function bFinalMistakeKey(d)",
            "d?.kind==='security'&&d?.questionId?d.questionId:d?.sourceId",
            "questionId:item._protectedQuestionId"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing security mistake identity contract: '+token);
          console.log('PASS Subject B security mistake identity v428');
          NODE
      - name: Validate Subject B mat05 remediation parity
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "policy:'keep-new-standard-matrix-final-item-on-standard-remediation'",
            "repairedFinalId:'bexam_mat_05'",
            "repairedTarget:'matrix_sum'",
            "repairedTargetLevel:'標準'",
            "if(studyMode==='exam'&&sourceId==='bexam_mat_05')return {mode:'trace',id:'matrix_sum'};"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing mat05 remediation contract: '+token);
          const exMatch=app.match(/const B_EXERCISES=(\[[^\n]*\]);/);
          const examMatch=app.match(/const B_EXAM_ALGO_ITEMS=(\[[^\n]*\]);/);
          if(!exMatch||!examMatch)throw new Error('Subject B metadata arrays missing');
          const exercises=JSON.parse(exMatch[1]),exam=JSON.parse(examMatch[1]);
          const target=exercises.find(x=>x.id==='matrix_sum'),item=exam.find(x=>x.id==='bexam_mat_05');
          if(target?.level!=='標準'||item?.level!=='標準'||item?.domain!=='二次元配列')throw new Error('mat05 remediation level contract drift');
          console.log('PASS Subject B mat05 remediation parity v429');
          NODE
      - name: Validate Subject B post-submit retention contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "const PROFILE_SCHEMA_VERSION = 9;",
            "policy:'persist-analysis-metadata-only-after-final-submit'",
            "function bFinalHistoryAttemptForPersistenceV430(value)",
            "function normalizeBFinalHistoryForPersistenceV430(value)",
            "out.bFinalHistory=normalizeBFinalHistoryForPersistenceV430(p.bFinalHistory);",
            "function normalizeProfileDataV5ForChecksum(input)",
            "function profileIntegrityChecksumV5(p)",
            "if(schema===5)return profileIntegrityChecksumV5(p);",
            "const actual=profileChecksumForSchema(candidate,schema);",
            "profile.bFinalHistory=[persistedAttempt,...(profile.bFinalHistory||[])].slice(0,20)",
            "finishBFinalLegacyV376(timeUp);bFinalReleaseExamRuntimeV430();bFinalClearProtectedV376();return true;",
            "clearsImmediateResultMemoryWhenLeavingReview:true"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing v430 retention contract: '+token);
          if(app.includes('profile.bFinalHistory=[attempt,...'))throw new Error('full final attempt must not be persisted');
          const fnStart=app.indexOf('function bFinalHistoryDetailForPersistenceV430');
          const fnEnd=app.indexOf('function bFinalHistoryAttemptForPersistenceV430',fnStart);
          const detailFn=fnStart>=0&&fnEnd>fnStart?app.slice(fnStart,fnEnd):'';
          for(const forbidden of ['questionId','sourceId','title','selected','correct:','explain','studyMode']){
            if(detailFn.includes(forbidden))throw new Error('protected/detail field persisted: '+forbidden);
          }
          console.log('PASS Subject B post-submit retention v430');
          NODE
      - name: Validate Subject B short-practice retention contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "const PROFILE_SCHEMA_VERSION = 9;",
            "policy:'persist-analysis-metadata-only-for-short-subject-b-practice'",
            "profileSchemaVersion:7",
            "priorSchemaCompatibility:6",
            "function bMockHistoryAttemptForPersistenceV431(value)",
            "function bCompoundHistoryAttemptForPersistenceV431(value)",
            "function securityMockHistoryAttemptForPersistenceV431(value)",
            "out.bMockHistory=normalizeBMockHistoryForPersistenceV431(p.bMockHistory);",
            "out.bCompoundHistory=normalizeBCompoundHistoryForPersistenceV431(p.bCompoundHistory);",
            "out.securityMockHistory=normalizeSecurityMockHistoryForPersistenceV431(p.securityMockHistory);",
            "function normalizeProfileDataV6ForChecksum(input)",
            "function profileIntegrityChecksumV6(p)",
            "if(schema===6)return profileIntegrityChecksumV6(p);",
            "profile.bMockHistory=[persistedAttempt,...(profile.bMockHistory||[])].slice(0,20)",
            "profile.bCompoundHistory=[persistedAttempt,...(profile.bCompoundHistory||[])].slice(0,20)",
            "profile.securityMockHistory=[persistedAttempt,...(profile.securityMockHistory||[])].slice(0,20)",
            "clearsReviewMemoryWhenLeavingResult:true",
            "if(document.getElementById('bMockResult')?.classList.contains('show'))bMockReleaseResultMemoryV431();",
            "if(document.getElementById('bCompoundResult')?.classList.contains('show'))bCompoundReleaseResultMemoryV431();",
            "if(document.getElementById('secMockResult')?.classList.contains('show'))securityMockReleaseResultMemoryV431();",
            "if(document.getElementById('bFinalResult')?.classList.contains('show'))bFinalReleaseResultMemoryV430();"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing v431 short-practice retention contract: '+token);
          for(const forbiddenDirect of [
            'profile.bMockHistory=[attempt,...',
            'profile.securityMockHistory=[attempt,...',
            'profile.bCompoundHistory=[{date:localDateISO(0)'
          ])if(app.includes(forbiddenDirect))throw new Error('full short-practice attempt persisted: '+forbiddenDirect);
          const detailFns=[
            ['function bMockHistoryDetailForPersistenceV431','function bMockHistoryAttemptForPersistenceV431',['id','exId','title','q:','selected','correct:','explain']],
            ['function bCompoundHistoryDetailForPersistenceV431','function bCompoundHistoryAttemptForPersistenceV431',['q:','selected','correct:','exp','point','pitfall']],
            ['function securityMockHistoryDetailForPersistenceV431','function securityMockHistoryAttemptForPersistenceV431',['title','concept','q:','selected','correct:','explain']]
          ];
          for(const [startToken,endToken,forbidden] of detailFns){
            const start=app.indexOf(startToken),end=app.indexOf(endToken,start);
            const body=start>=0&&end>start?app.slice(start,end):'';
            if(!body)throw new Error('missing detail sanitizer '+startToken);
            for(const field of forbidden)if(body.includes(field))throw new Error('protected review field persisted in '+startToken+': '+field);
          }
          console.log('PASS Subject B short-practice retention v431');
          NODE
      - name: Validate Subject A mock post-submit retention contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "const PROFILE_SCHEMA_VERSION = 9;",
            "policy:'persist-analysis-metadata-only-for-subject-a-mock'",
            "profileSchemaVersion:8",
            "priorSchemaCompatibility:7",
            "function subjectAMockHistoryDetailForPersistenceV432(value)",
            "function subjectAMockHistoryAttemptForPersistenceV432(value)",
            "function normalizeSubjectAMockHistoryForPersistenceV432(value)",
            "out.mockHistory=normalizeSubjectAMockHistoryForPersistenceV432(p.mockHistory);",
            "function normalizeProfileDataV7ForChecksum(input)",
            "function profileIntegrityChecksumV7(p)",
            "if(schema===7)return profileIntegrityChecksumV7(p);",
            "profile.mockHistory.unshift(persistedMockAttempt);",
            "ok:mockAnswers[i]===q.a",
            "subjectAMockHistoryDetailOkV432(d)",
            "historicalReviewUsesCurrentProtectedQuestion:true"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing v432 Subject A mock retention contract: '+token);
          if(app.includes('profile.mockHistory.unshift(lastMockAttempt);'))throw new Error('full Subject A mock attempt must not be persisted');
          const start=app.indexOf('function subjectAMockHistoryDetailForPersistenceV432');
          const end=app.indexOf('function subjectAMockHistoryAttemptForPersistenceV432',start);
          const body=start>=0&&end>start?app.slice(start,end):'';
          if(!body)throw new Error('missing Subject A mock detail sanitizer');
          for(const forbidden of ['shownOptions','correctIndex','answerIndex','q:','options','explanation','exp']){
            if(body.includes(forbidden))throw new Error('protected Subject A mock review field persisted: '+forbidden);
          }
          const attemptStart=app.indexOf('function subjectAMockHistoryAttemptForPersistenceV432');
          const attemptEnd=app.indexOf('function normalizeSubjectAMockHistoryForPersistenceV432',attemptStart);
          const attemptBody=attemptStart>=0&&attemptEnd>attemptStart?app.slice(attemptStart,attemptEnd):'';
          for(const forbidden of ['shownOptions','correctIndex','answerIndex']){
            if(attemptBody.includes(forbidden))throw new Error('answer-position field persisted in Subject A mock attempt: '+forbidden);
          }
          console.log('PASS Subject A mock post-submit retention v432');
          NODE
      - name: Validate profile protected checkpoint retention contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const required=[
            "const PROFILE_SCHEMA_VERSION = 9;",
            "policy:'strip-protected-answer-positions-from-persistent-resume-checkpoints'",
            "profileSchemaVersion:9",
            "priorSchemaCompatibility:8",
            "function sanitizeBTraceResumeForPersistenceV434(value)",
            "function sanitizeBSecurityResumeForPersistenceV434(value)",
            "function normalizeDailyPlansForPersistenceV434(value)",
            "out.dailyPlans=normalizeDailyPlansForPersistenceV434(p.dailyPlans);",
            "function normalizeProfileDataV8ForChecksum(input)",
            "function profileIntegrityChecksumV8(p)",
            "if(schema===8)return profileIntegrityChecksumV8(p);",
            "resumeTail(id,resume.choiceIndex??null)",
            "const persistedChoiceIndex=!answered&&attempts===1?choiceIndex:null;"
          ];
          for(const token of required)if(!app.includes(token))throw new Error('missing v434 protected checkpoint retention contract: '+token);

          if(app.includes("choiceIndex:tail.choiceIndex"))throw new Error('trace tail correct-answer position must not be persisted');
          if(app.includes("choiceIndex:bTracePacketV376.choiceIndex"))throw new Error('active trace tail answer position must not be checkpointed');

          const traceStart=app.indexOf('function sanitizeBTraceResumeForPersistenceV434');
          const traceEnd=app.indexOf('function sanitizeBSecurityResumeForPersistenceV434',traceStart);
          const traceBody=traceStart>=0&&traceEnd>traceStart?app.slice(traceStart,traceEnd):'';
          if(!traceBody.includes("if(v.phase==='tail')delete v.choiceIndex;"))throw new Error('trace tail sanitizer missing');

          const secStart=app.indexOf('function sanitizeBSecurityResumeForPersistenceV434');
          const secEnd=app.indexOf('function dailyPlanRecordForPersistenceV434',secStart);
          const secBody=secStart>=0&&secEnd>secStart?app.slice(secStart,secEnd):'';
          if(!secBody.includes("v.answered===false&&attempts===1"))throw new Error('security retry sanitizer must keep only unfinished known-wrong choice');
          if(!secBody.includes("v.choiceIndex=keepKnownWrongChoice?v.choiceIndex:null;"))throw new Error('security answered checkpoint answer position not stripped');

          const v8Start=app.indexOf('function normalizeProfileDataV8ForChecksum');
          const v8End=app.indexOf('function profileIntegrityChecksumV8',v8Start);
          const v8Body=v8Start>=0&&v8End>v8Start?app.slice(v8Start,v8End):'';
          if(!v8Body.includes("'settings','dailyPlans','reviewJourney'"))throw new Error('schema 8 checksum compatibility must preserve raw dailyPlans');
          if(v8Body.includes('normalizeDailyPlansForPersistenceV434'))throw new Error('schema 8 checksum compatibility must not apply v434 sanitizer');

          const currentStart=app.indexOf('function normalizeProfileData(input)');
          const currentEnd=app.indexOf('// v96 backup compatibility',currentStart);
          const currentBody=currentStart>=0&&currentEnd>currentStart?app.slice(currentStart,currentEnd):'';
          if(!currentBody.includes('out.dailyPlans=normalizeDailyPlansForPersistenceV434(p.dailyPlans);'))throw new Error('current profile normalization must sanitize dailyPlans');

          console.log('PASS protected resume checkpoint retention v434');
          NODE
      - name: Validate bilingual learning terminology
        run: |
          grep -Fq "function fequestLocalizeProtectedLessonArticleV377" assets/app-v377.js
          grep -Fq "function fequestNaturalizeLessonVersionLabelsV377" assets/app-v377.js
          grep -Fq "function fequestPrepareResponsiveLessonTablesV377" assets/app-v377.js
          grep -Fq "root.querySelectorAll('table:not([class])')" assets/app-v377.js
