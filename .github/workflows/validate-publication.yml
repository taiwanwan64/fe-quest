          node --check cloud/activation-loader-v342.js
          node --check cloud/public-config-v342.js
          node --check sw.js
      - name: Validate Subject B 50-question final-pool metadata
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('assets/app-v377.js','utf8');
          const base=require('./assets/question-catalog-v376.json');
          const gap=require('./assets/question-catalog-b-gap-v1.json');
          const match=app.match(/const B_EXAM_ALGO_ITEMS=(\[[^\n]*\]);/);
          if(!match)throw new Error('B_EXAM_ALGO_ITEMS not found');
          const actual=JSON.parse(match[1]);
          const expected=[...base.items,...gap.items].filter(x=>x.sourcePool==='b_exam_algo');
          if(actual.length!==50||expected.length!==50)throw new Error('b_exam_algo count drift actual='+actual.length+' catalog='+expected.length);
          const actualByProtectedId=new Map(actual.map(x=>[x.protectedQuestionId,x]));
          if(actualByProtectedId.size!==50)throw new Error('duplicate protectedQuestionId in app metadata');
          for(const item of expected){
            const row=actualByProtectedId.get(item.id);
            if(!row)throw new Error('missing app metadata '+item.id);
            if(row.id!==item.parentId||row.level!==item.level||row.domain!==item.domain||row.format!==item.format||row.protected!==true){
              throw new Error('metadata mismatch '+item.id);
            }
          }
          const required=['b_exam_bexam_sq_05','b_exam_bexam_tree_06','b_exam_bexam_bit_06','b_exam_bexam_algo_04','b_exam_bexam_arr_06','b_exam_bexam_mat_05','b_exam_bexam_ctrl_05'];
          for(const id of required)if(!actualByProtectedId.has(id))throw new Error('missing gap metadata '+id);
          if(!app.includes('const B_FINAL_ALGO_POOL_V424_COUNT=50;'))throw new Error('v424 runtime pool contract missing');
          console.log('PASS Subject B final selector metadata: 50 questions');
          NODE
      - name: Validate bilingual learning terminology
