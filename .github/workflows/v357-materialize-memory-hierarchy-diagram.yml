name: Materialize FE QUEST v357 memory hierarchy diagram

on:
  push:
    branches: ['v357-memory-hierarchy-diagram']
    paths:
      - 'app/memory-hierarchy-diagram-v357.js'
      - 'app/memory-hierarchy-diagram-v357.css'
      - '.github/v357/materialize_memory_hierarchy_diagram.py'
      - '.github/workflows/v357-materialize-memory-hierarchy-diagram.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v357-memory-hierarchy-diagram
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize versioned split release
        run: python .github/v357/materialize_memory_hierarchy_diagram.py
      - name: Validate generated release
        run: python .github/v357/validate_memory_hierarchy_diagram.py
      - name: Commit generated v357 assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js app/base-shell-v357.html assets/app-v357.css assets/app-v357.js assets/asset-manifest-v357.json
          if git diff --cached --quiet; then
            echo 'v357 assets already materialized'
            exit 0
          fi
          git commit -m 'Materialize FE QUEST v357 split release'
          git push origin HEAD:v357-memory-hierarchy-diagram
