name: One-shot generate IPA 9.2 v34 public activation

on:
  push:
    branches: [ipa92-v34-public-activation-20260915]
    paths:
      - '.github/workflows/one-shot-generate-v34-public.yml'

permissions:
  contents: write

jobs:
  generate-v34-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ipa92-v34-public-activation-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v34 public activation artifacts
        run: node .github/tmp-generate-v34-public.cjs
      - name: Commit generated non-workflow artifacts and staged workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/protected-content-provider-v376-v34.js cloud/public-config-v342.js sw.js .github/generated-v34
          git diff --cached --quiet && exit 0
          git commit -m "Generate IPA 9.2 v34 public activation artifacts"
          git push
