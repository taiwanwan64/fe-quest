name: Validate IPA 9.2 question v30 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v30.js'
      - 'assets/question-catalog-ipa92-v30.json'
      - '.github/IPA92_V30_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v30-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v30-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v30 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v30.js
          node -e "const c=require('./assets/question-catalog-ipa92-v30.json');if(c.version!=='ipa92-catalog-v30'||c.contentVersion!=='ipa92-questions-v30'||c.items?.length!==4)process.exit(1)"
          grep -Fq "version:'v376-provider-27-ipa92-v1-v30'" assets/protected-content-provider-v376-v30.js
          grep -Fq 'active protected question total after import: **1148**' .github/IPA92_V30_ACTIVATION_2026-09-15.md
