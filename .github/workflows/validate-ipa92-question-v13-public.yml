name: Validate IPA 9.2 question v13 public activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v13.js'
      - 'assets/question-catalog-ipa92-v13.json'
      - '.github/IPA92_V13_ACTIVATION_2026-09-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v13-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate historical v13 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v13.js
          node <<'NODE'
          const fs=require('node:fs');
          const catalog=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v13.json','utf8'));
          const expectedIds=[
            'ipa92_a_low_code_001','ipa92_a_no_code_001',
            'ipa92_a_pair_programming_001','ipa92_a_mob_programming_001',
            'ipa92_a_kpt_001','ipa92_a_yagni_001'
          ];
          const protectedKeys=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);
          if(catalog.version!=='ipa92-catalog-v13'||catalog.contentVersion!=='ipa92-questions-v13')throw new Error('v13 catalog version mismatch');
          if(!Array.isArray(catalog.items)||catalog.items.length!==6)throw new Error('v13 catalog count mismatch');
          const ids=catalog.items.map(item=>item.id);
          if(JSON.stringify(ids)!==JSON.stringify(expectedIds))throw new Error('v13 IDs/order mismatch');
          if(new Set(ids).size!==6)throw new Error('v13 duplicate IDs');
          for(const item of catalog.items){
            if(item.sourcePool!=='subject_a'||item.qualityAudit!=='ipa92-original-v13')throw new Error(`v13 metadata contract mismatch: ${item.id}`);
            if(Object.keys(item).some(key=>protectedKeys.has(key)))throw new Error(`protected field leaked: ${item.id}`);
          }
          const provider=fs.readFileSync('assets/protected-content-provider-v376-v13.js','utf8');
          if(!provider.includes("version:'v376-provider-10-ipa92-v1-v13'"))throw new Error('v13 provider version mismatch');
          console.log('PASS historical v13 public artifacts');
          NODE
          grep -Fq 'active protected question total after import: **1069**' .github/IPA92_V13_ACTIVATION_2026-09-13.md
