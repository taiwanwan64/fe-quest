name: Generate IPA 9.2 v25 public artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/generate-ipa92-v25-public.cjs'
      - '.github/workflows/generate-ipa92-v25-public.yml'
      - 'assets/question-catalog-ipa92-v25.json'
      - '.github/IPA92_V25_ACTIVATION_2026-09-14.md'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v25 public artifacts
        run: node .github/scripts/generate-ipa92-v25-public.cjs
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/protected-content-provider-v376-v25.js cloud/public-config-v342.js sw.js .github/generated-v25
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Generate IPA 9.2 v25 public artifacts'
          git push origin HEAD:${{ github.head_ref }}
