name: FE QUEST v124 Core A tone audit release

on:
  push:
    branches: [main]
    paths: [.github/workflows/v124-release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v124
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v124_patch.py
          python /tmp/v124_patch.py
      - name: Verify v124
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import json,re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v124';" in s
          assert "politeCoreProse('違いを見る。')==='違いを見ます。'" in s
          assert 'function politeCoreCautionProse' in s
          assert json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))['name']=='FE QUEST v124'
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/main.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY2
          node --check /tmp/main.js
          node --check sw.js
      - name: Commit v124
        shell: bash
        run: |
          rm -f .github/workflows/v124-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release FE QUEST v124 Core A polite tone audit'
          git push
