name: FE QUEST v370 deadlock diagram
on:
  pull_request:
    branches: ['main']
    paths: ['.github/v370/**','.github/workflows/v370-*.yml','audits/V370_DEADLOCK_DIAGRAM.md','FE_QUEST_DEVELOPMENT_PLAN.md','index.html','manifest.webmanifest','sw.js','app/base-shell-v370.html','app/deadlock-diagram-v370.js','app/deadlock-diagram-v370.css','assets/app-v370.css','assets/app-v370.js','assets/asset-manifest-v370.json']
permissions: {contents: read}
jobs:
  validate-v370-deadlock-diagram:
    if: github.head_ref == 'v370-deadlock-diagram'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restrict learner-facing change
        run: |
          git diff --name-only origin/main...HEAD | python -c '
          import re,sys
          paths=sys.stdin.read().splitlines()
          allowed=r"^(\.github/v370/.*|\.github/workflows/v370-(deadlock-diagram|materialize-deadlock-diagram)\.yml|audits/V370_DEADLOCK_DIAGRAM\.md|FE_QUEST_DEVELOPMENT_PLAN\.md|index\.html|manifest\.webmanifest|sw\.js|app/base-shell-v370\.html|app/deadlock-diagram-v370\.(js|css)|assets/app-v370\.(js|css)|assets/asset-manifest-v370\.json)$"
          unexpected=[p for p in paths if not re.fullmatch(allowed,p)]
          assert not unexpected,unexpected
          print("PASS bounded v370 file set:",len(paths))'
      - run: python .github/v370/validate_deadlock_diagram.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - run: node .github/v370/browser_deadlock_diagram.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v370-deadlock-diagram-evidence, path: _browser_evidence/v370/, if-no-files-found: warn, retention-days: 14}
