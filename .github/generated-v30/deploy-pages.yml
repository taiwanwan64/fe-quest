name: Deploy sanitized FE QUEST production to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout deploy-only repository
        uses: actions/checkout@v6
      - name: Build Pages artifact from deploy files only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ "$RUNNER_TEMP/site/"
          printf '' > "$RUNNER_TEMP/site/.nojekyll"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/assets/app-v377.js"
          test -f "$RUNNER_TEMP/site/assets/app-v377.css"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v14.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v15.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v16.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v18.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v19.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v20.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v22.js"
          grep -Fq '"./assets/protected-content-provider-v376-v23.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v23.js"
          grep -Fq '"./assets/protected-content-provider-v376-v24.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v24.js"
          grep -Fq '"./assets/protected-content-provider-v376-v25.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v25.js"
          grep -Fq '"./assets/protected-content-provider-v376-v26.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v26.js"
          grep -Fq '"./assets/protected-content-provider-v376-v27.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v27.js"
          grep -Fq '"./assets/protected-content-provider-v376-v28.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v28.js"
          grep -Fq '"./assets/protected-content-provider-v376-v29.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v29.js"
          grep -Fq '"./assets/protected-content-provider-v376-v30.js"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v30.js"
          test -f "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          test -f "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          test -f "$RUNNER_TEMP/site/assets/ipa92-sort-lab-v377.js"
          test -f "$RUNNER_TEMP/site/assets/ipa92-graph-lab-v377.js"
          test -f "$RUNNER_TEMP/site/assets/ipa92-modeling-lab-v377.js"
          test -f "$RUNNER_TEMP/site/assets/ipa92-memory-lab-v377.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-v376.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v1-v6.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v14.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v15.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v16.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v17.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v18.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v19.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v20.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v21.json"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v22.json"
          grep -Fq '"./assets/question-catalog-ipa92-v23.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v23.json"
          grep -Fq '"./assets/question-catalog-ipa92-v24.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v24.json"
          grep -Fq '"./assets/question-catalog-ipa92-v25.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v25.json"
          grep -Fq '"./assets/question-catalog-ipa92-v26.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v26.json"
          grep -Fq '"./assets/question-catalog-ipa92-v27.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v27.json"
          grep -Fq '"./assets/question-catalog-ipa92-v28.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v28.json"
          grep -Fq '"./assets/question-catalog-ipa92-v29.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v29.json"
          grep -Fq '"./assets/question-catalog-ipa92-v30.json"' "$RUNNER_TEMP/site/sw.js"
          test -f "$RUNNER_TEMP/site/assets/question-catalog-ipa92-v30.json"
          test -f "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          test ! -e "$RUNNER_TEMP/site/.github"
          test ! -e "$RUNNER_TEMP/site/supabase"
          test ! -e "$RUNNER_TEMP/site/assets/app-v375.js"
          test ! -e "$RUNNER_TEMP/site/assets/app-v376.js"
          grep -Fq "const APP_VERSION = 'v377';" "$RUNNER_TEMP/site/assets/app-v377.js"
          ! grep -Fq "const APP_VERSION = 'v376';" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "function subjectACognitiveEvidence(){return undefined;}/* FEQUEST_V376_REDACTED_FUNCTION */" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "const cognitiveRaw=subjectACognitiveEvidence();" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "const cognitive=Number.isFinite(Number(cognitiveRaw))?Number(cognitiveRaw):0;" "$RUNNER_TEMP/site/assets/app-v377.js"
          ! grep -Fq "  const cognitive=subjectACognitiveEvidence();" "$RUNNER_TEMP/site/assets/app-v377.js"
          grep -Fq "const APP_VERSION = 'v377';" "$RUNNER_TEMP/site/sw.js"
          grep -Fq "const CACHE_NAME = 'fe-quest-v377-27';" "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/ipa92-sort-lab-v377.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/ipa92-graph-lab-v377.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/ipa92-modeling-lab-v377.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/ipa92-memory-lab-v377.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/question-catalog-ipa92-v1-v6.json"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/protected-content-provider-v376-v14.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/question-catalog-ipa92-v14.json"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/protected-content-provider-v376-v15.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/protected-content-provider-v376-v18.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/protected-content-provider-v376-v19.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/protected-content-provider-v376-v20.js"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/question-catalog-ipa92-v15.json"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/question-catalog-ipa92-v18.json"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/question-catalog-ipa92-v19.json"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq '"./assets/question-catalog-ipa92-v20.json"' "$RUNNER_TEMP/site/sw.js"
          grep -Fq "const IPA92_CATALOG_TOTAL=83;" "$RUNNER_TEMP/site/assets/protected-content-provider-v376.js"
          grep -Fq "const MERGED_CATALOG_TOTAL=BASE_CATALOG_TOTAL+IPA92_CATALOG_TOTAL;" "$RUNNER_TEMP/site/assets/protected-content-provider-v376.js"
          grep -Fq "question-catalog-ipa92-v1-v6.json" "$RUNNER_TEMP/site/assets/protected-content-provider-v376.js"
          grep -Fq "version:'v376-provider-11-ipa92-v1-v14'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v14.js"
          grep -Fq "version:'v376-provider-12-ipa92-v1-v15'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v15.js"
          grep -Fq "version:'v376-provider-14-ipa92-v1-v17'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v17.js"
          grep -Fq "version:'v376-provider-15-ipa92-v1-v18'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v18.js"
          grep -Fq "version:'v376-provider-16-ipa92-v1-v19'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v19.js"
          grep -Fq "version:'v376-provider-17-ipa92-v1-v20'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v20.js"
          grep -Fq "version:'v376-provider-20-ipa92-v1-v23'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v23.js"
          grep -Fq "version:'v376-provider-21-ipa92-v1-v24'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v24.js"
          grep -Fq "version:'v376-provider-22-ipa92-v1-v25'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v25.js"
          grep -Fq "version:'v376-provider-23-ipa92-v1-v26'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v26.js"
          grep -Fq "version:'v376-provider-24-ipa92-v1-v27'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v27.js"
          grep -Fq "version:'v376-provider-25-ipa92-v1-v28'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v28.js"
          grep -Fq "version:'v376-provider-26-ipa92-v1-v29'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v29.js"
          grep -Fq "version:'v376-provider-27-ipa92-v1-v30'" "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v30.js"
          test -f "$RUNNER_TEMP/site/assets/protected-content-provider-v376-v21.js"
          grep -Fq "const IPA92_SUBJECT_A_METADATA=Object.freeze([" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "installIpa92SubjectAMetadata();" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "const VERSION='v377-first-impression-ux-7';" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "observerMode:'scoped-readiness'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "blankShellRecovery:'guarded-v2'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "studyBlockBarMode:'inline-active-screen'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "ipa92VennLab:'touch-v1'" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "Ver.9.2対応強化中" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "sanitizeCompactReadiness(right,rightBar);" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "relocateStudyBlockBar();" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          ! grep -Fq "observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true})" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "データ収集中" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq "未判定" "$RUNNER_TEMP/site/assets/first-impression-ux-v377.js"
          grep -Fq '#diagIntro #diagBegin' "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          grep -Fq '#studyBlockBarV373[data-v377-inline="1"]' "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          grep -Fq '.ipa92-venn-backdrop' "$RUNNER_TEMP/site/assets/first-impression-ux-v377.css"
          grep -Fq "./assets/first-impression-ux-v377.js" "$RUNNER_TEMP/site/index.html"
          grep -Fq "./assets/first-impression-ux-v377.css" "$RUNNER_TEMP/site/index.html"
          grep -Fq "./assets/ipa92-sort-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "./assets/ipa92-graph-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "./assets/ipa92-modeling-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "./assets/ipa92-memory-lab-v377.js" "$RUNNER_TEMP/site/cloud/activation-loader-v342.js"
          grep -Fq "globalThis.FEQUEST_IPA92_SORT_LAB" "$RUNNER_TEMP/site/assets/ipa92-sort-lab-v377.js"
          grep -Fq "globalThis.FEQUEST_IPA92_GRAPH_LAB" "$RUNNER_TEMP/site/assets/ipa92-graph-lab-v377.js"
          grep -Fq "globalThis.FEQUEST_IPA92_MODELING_LAB" "$RUNNER_TEMP/site/assets/ipa92-modeling-lab-v377.js"
          grep -Fq "globalThis.FEQUEST_IPA92_MEMORY_LAB" "$RUNNER_TEMP/site/assets/ipa92-memory-lab-v377.js"
          grep -Fq "redirectTo:'https://taiwanwan64.github.io/fe-quest/'" "$RUNNER_TEMP/site/cloud/public-config-v342.js"
          ! grep -RIl --exclude='*.png' -E 'fequest_lesson_bank_private|fequest_question_bank_private|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' "$RUNNER_TEMP/site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
