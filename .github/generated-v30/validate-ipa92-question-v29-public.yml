name: Validate IPA 9.2 question v29 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v29.js'
      - 'assets/question-catalog-ipa92-v29.json'
      - '.github/IPA92_V29_ACTIVATION_2026-09-15.md'
      - '.github/workflows/validate-ipa92-question-v29-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v29-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate immutable v29 artifacts
        run: |
          node --check assets/protected-content-provider-v376-v29.js
          node -e "const c=require('./assets/question-catalog-ipa92-v29.json');if(c.version!=='ipa92-catalog-v29'||c.contentVersion!=='ipa92-questions-v29'||c.items?.length!==5)process.exit(1)"
          grep -Fq "version:'v376-provider-26-ipa92-v1-v29'" assets/protected-content-provider-v376-v29.js
          grep -Fq 'active protected question total after import: **1144**' .github/IPA92_V29_ACTIVATION_2026-09-15.md
