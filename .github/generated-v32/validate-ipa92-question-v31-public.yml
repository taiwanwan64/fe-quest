name: Validate IPA 9.2 question v31 historical artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/protected-content-provider-v376-v31.js'
      - 'assets/question-catalog-ipa92-v31.json'
      - '.github/workflows/validate-ipa92-question-v31-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v31-historical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: node --check assets/protected-content-provider-v376-v31.js
      - run: |
          node <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('assets/question-catalog-ipa92-v31.json','utf8'));const forbidden=new Set(['q','stem','options','answerIndex','answer_index','a','explanation','exp','hint','choiceExplanations','choice_explanations']);if(c.version!=='ipa92-catalog-v31'||c.contentVersion!=='ipa92-questions-v31'||c.items?.length!==5)throw new Error('v31 historical catalog');for(const x of c.items)if(Object.keys(x).some(k=>forbidden.has(k)))throw new Error('protected field leaked');console.log('PASS v31 historical artifacts');
          NODE
